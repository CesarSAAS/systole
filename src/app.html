<title>Systole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800;900&family=Caveat:wght@700&display=swap">
<style>
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --soft:#F4F6FA; --line:#E4E7EE; --line-2:#D3D8E2;
  --ink:#252A36; --muted:#7D8497; --shadow:rgba(37,42,54,.10);
  --heart:#FF4760; --heart-edge:#D42A45; --heart-soft:#FFE6EA;
  --go:#14B89C; --go-edge:#0B917A; --go-soft:#DDF6F0;
  --gold:#FFC22E; --gold-edge:#E09B00; --gold-soft:#FFF3D1;
  --ok:#3DBA4E; --ok-ink:#2A9A3A; --ok-soft:#DDF6DF;
  --ko:#FF4B4B; --ko-ink:#E03030; --ko-soft:#FFE3E3;
  --lock:#E4E7EE; --lock-edge:#C8CEDA; --lock-ink:#AAB1C2;
  --flat:#B9C0CE; --flat-edge:#949CAD; --pupil:#252A36;
  --bm-ink:#D42A45; --bm-shade-red:#F0364F; --bm-cheek:#FFA3B8; --bm-eye:#3A1B26; --bm-mouth:#5C1E30; --bm-ink-flat:#8A92A3;
  --u1:#14B89C; --u1e:#0B917A;
  --u2:#8A63F2; --u2e:#6A43D4;
  --u3:#FF8A34; --u3e:#DB6A14;
  --u4:#2F8CFF; --u4e:#1A6ED8;
  --u5:#F2549B; --u5e:#CE3279;
  --u6:#56C23C; --u6e:#3C9C26;
  --display:"Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
  --body:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131722; --panel:#1B2130; --soft:#20283A; --line:#2C3549; --line-2:#3A4560;
    --ink:#EEF1F7; --muted:#8E97AC; --shadow:rgba(0,0,0,.35);
    --heart-soft:#3B1C24; --go-soft:#123A33; --gold-soft:#3A3014;
    --ok-soft:#173820; --ok-ink:#6BD67A; --ko-soft:#3D1B1B; --ko-ink:#FF7C7C;
    --lock:#2C3549; --lock-edge:#222A3B; --lock-ink:#5C6680;
    --flat:#5C6578; --flat-edge:#454D5E; --pupil:#1B2130;
    --bm-ink-flat:#3F4757;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131722; --panel:#1B2130; --soft:#20283A; --line:#2C3549; --line-2:#3A4560;
  --ink:#EEF1F7; --muted:#8E97AC; --shadow:rgba(0,0,0,.35);
  --heart-soft:#3B1C24; --go-soft:#123A33; --gold-soft:#3A3014;
  --ok-soft:#173820; --ok-ink:#6BD67A; --ko-soft:#3D1B1B; --ko-ink:#FF7C7C;
  --lock:#2C3549; --lock-edge:#222A3B; --lock-ink:#5C6680;
  --flat:#5C6578; --flat-edge:#454D5E; --pupil:#1B2130;
  --bm-ink-flat:#3F4757;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; font-weight:600; line-height:1.45}
button{font:inherit; color:inherit}
h1,h2,h3{font-family:var(--display); margin:0; line-height:1.1; text-wrap:balance}
p{margin:0}
:focus-visible{outline:3px solid var(--u4); outline-offset:3px; border-radius:12px}

/* ---------- Chunky buttons ---------- */
.btn{--c:var(--go); --ce:var(--go-edge); --t:#fff;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
  font-family:var(--body); font-weight:900; font-size:15px; letter-spacing:.06em; text-transform:uppercase;
  padding:14px 18px; border:none; border-radius:16px; cursor:pointer; color:var(--t); background:var(--c);
  box-shadow:0 4px 0 var(--ce); transform:translateY(0); transition:transform .06s, box-shadow .06s, filter .15s}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px); box-shadow:0 0 0 var(--ce)}
.btn[disabled]{--c:var(--lock); --ce:var(--lock-edge); --t:var(--lock-ink); cursor:default; filter:none}
.btn[disabled]:active{transform:none; box-shadow:0 4px 0 var(--ce)}
.btn.ghost{--c:var(--panel); --ce:var(--line-2); --t:var(--u4); border:2px solid var(--line-2); box-shadow:0 4px 0 var(--line-2)}
.btn.red{--c:var(--ko); --ce:#D32F2F}
.btn.okb{--c:var(--ok); --ce:#2C9A3B}
.btn.heart{--c:var(--heart); --ce:var(--heart-edge)}
.btn.small{width:auto; padding:10px 14px; font-size:13px; border-radius:12px}
.linkbtn{background:none; border:none; color:var(--u4); font-weight:900; text-transform:uppercase; letter-spacing:.06em; font-size:14px; cursor:pointer; padding:10px}

/* ---------- Mascot ---------- */
.boum{display:block; overflow:visible}
.boum .bb{transform-origin:60px 70px}
.boum.beating .bb{animation:hb var(--beat,.83s) ease-in-out infinite}
@keyframes hb{0%{transform:scale(1)}12%{transform:scale(1.08,1.06)}24%{transform:scale(.97,.99)}36%{transform:scale(1.04)}56%,100%{transform:scale(1)}}
.boum .eyes{transform-box:fill-box; transform-origin:center; animation:blink 4.6s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.bubble{position:relative; background:var(--panel); border:2px solid var(--line); border-radius:16px; padding:12px 14px; font-weight:700}
.bubble::before{content:""; position:absolute; left:-10px; top:22px; width:16px; height:16px; background:var(--panel); border-left:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg)}
.bubble.up::before{left:28px; top:-10px; transform:rotate(135deg)}

/* ---------- Layout ---------- */
.shell{min-height:100%; display:grid; grid-template-columns:1fr}
.side{display:none}
.main{min-width:0; padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); border-bottom:2px solid var(--line)}
.topbar-in{max-width:600px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; gap:8px}
.brand{display:flex; align-items:center; gap:6px; font-family:var(--display); font-weight:800; font-size:24px; color:var(--heart); letter-spacing:-.01em}
.brand svg{width:26px; height:26px}
.stats{display:flex; gap:4px}
.stat{display:flex; align-items:center; gap:5px; font-weight:900; font-size:16px; padding:6px 8px; border-radius:12px; background:none; border:none; cursor:pointer; font-variant-numeric:tabular-nums}
.stat:hover{background:var(--soft)}
.stat svg{width:24px; height:24px}
.stat.streak{color:var(--heart)} .stat.streak.off{color:var(--lock-ink)}
.stat.xp{color:var(--gold-edge)} .stat.lives{color:var(--heart)}
.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg); border-top:2px solid var(--line); padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px)); display:flex; justify-content:space-around}
.tab{flex:1; max-width:140px; display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px; border:2px solid transparent; border-radius:14px; background:none; cursor:pointer; color:var(--muted); font-weight:800; font-size:12px; text-transform:uppercase; letter-spacing:.05em}
.tab svg{width:30px; height:30px}
.tab.on{color:var(--u4); border-color:color-mix(in srgb, var(--u4) 45%, transparent); background:color-mix(in srgb, var(--u4) 10%, transparent)}
.page{max-width:600px; margin:0 auto; padding-inline:16px; padding-block:18px 24px}

/* ---------- Home ---------- */
.coach{display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:center; margin-bottom:10px}
.goal{display:grid; gap:6px; padding:12px 14px; border:2px solid var(--line); border-radius:16px; margin-bottom:22px}
.goal-row{display:flex; justify-content:space-between; font-weight:800; font-size:14px}
.goal-row span:last-child{color:var(--muted); font-variant-numeric:tabular-nums}
.bar{height:16px; border-radius:99px; background:var(--line); overflow:hidden; position:relative}
.bar i{display:block; height:100%; border-radius:99px; background:var(--gold); position:relative; transition:width .5s cubic-bezier(.3,1.4,.5,1)}
.bar i::after{content:""; position:absolute; left:8px; right:8px; top:4px; height:4px; border-radius:4px; background:rgba(255,255,255,.35)}

.unit{margin-bottom:28px}
.banner{--uc:var(--u1); --uce:var(--u1e); background:var(--uc); color:#fff; border-radius:16px; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; gap:12px; box-shadow:0 4px 0 var(--uce)}
.banner small{display:block; font-weight:900; font-size:13px; letter-spacing:.06em; text-transform:uppercase; opacity:.85}
.banner h2{font-size:24px; font-weight:800}
.banner button{flex:none; display:flex; align-items:center; gap:6px; background:transparent; color:#fff; border:2px solid rgba(255,255,255,.45); border-radius:12px; padding:9px 12px; font-weight:900; font-size:13px; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; box-shadow:0 3px 0 rgba(0,0,0,.12)}
.banner button svg{width:18px; height:18px}
.path{display:flex; flex-direction:column; align-items:center; gap:20px; padding-block:64px 8px; position:relative}
.row{position:relative; width:100%; display:flex; justify-content:center; height:78px}
.nodewrap{position:relative; transform:translateX(var(--x,0))}
.node{--c:var(--u1); --ce:var(--u1e); position:relative; width:74px; height:66px; border-radius:50%; border:none; cursor:pointer; background:var(--c); box-shadow:0 7px 0 var(--ce); display:grid; place-items:center; transition:transform .06s, box-shadow .06s}
.node svg{width:34px; height:34px}
.node:active{transform:translateY(6px); box-shadow:0 1px 0 var(--ce)}
.node.locked{--c:var(--lock); --ce:var(--lock-edge); color:var(--lock-ink)}
.node.done{color:#fff}
.node.current{color:#fff}
.ring{position:absolute; left:50%; top:50%; width:98px; height:90px; margin:-45px 0 0 -49px; border-radius:50%; border:7px solid var(--line); pointer-events:none}
.ring::after{content:""; position:absolute; inset:-7px; border-radius:50%; border:7px solid var(--c0,var(--u1)); opacity:.35; animation:ringpulse 1.6s ease-out infinite}
@keyframes ringpulse{0%{transform:scale(1); opacity:.45}100%{transform:scale(1.25); opacity:0}}
.start-tip{position:absolute; bottom:calc(100% + 18px); left:50%; transform:translateX(-50%); white-space:nowrap; background:var(--panel); color:var(--c0,var(--u1)); border:2px solid var(--line); border-radius:12px; padding:8px 12px; font-weight:900; font-size:14px; letter-spacing:.05em; text-transform:uppercase; animation:bob 1.4s ease-in-out infinite; pointer-events:none}
.start-tip::after{content:""; position:absolute; left:50%; bottom:-8px; width:12px; height:12px; margin-left:-6px; background:var(--panel); border-right:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg)}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-6px)}}
.deco{position:absolute; top:-14px; width:110px; height:110px; pointer-events:none}
.deco.l{left:calc(50% - 190px)} .deco.r{right:calc(50% - 190px)}
.npop{position:absolute; top:calc(100% + 16px); left:calc(50% - var(--x,0px)); transform:translateX(-50%); z-index:10; width:min(300px, calc(100vw - 32px)); background:var(--c0); color:#fff; border-radius:16px; padding:16px; display:grid; gap:10px; box-shadow:0 8px 24px var(--shadow)}
.npop::before{content:""; position:absolute; top:-8px; left:calc(50% + var(--x,0px)); width:16px; height:16px; margin-left:-8px; background:var(--c0); transform:rotate(45deg)}
.npop h3{font-size:20px}
.npop p{font-size:14px; opacity:.92}
.npop .btn{--c:#fff; --ce:rgba(0,0,0,.18); --t:var(--c0)}
.npop.locked{background:var(--soft); color:var(--ink); border:2px solid var(--line)}
.npop.locked::before{background:var(--soft); border-left:2px solid var(--line); border-top:2px solid var(--line)}
.npop.locked p{color:var(--muted)}
.unit-sep{display:flex; align-items:center; gap:12px; color:var(--muted); font-weight:800; margin-block:8px 18px}
.unit-sep::before,.unit-sep::after{content:""; flex:1; height:2px; background:var(--line)}

/* ---------- Generic panels ---------- */
.card{border:2px solid var(--line); border-radius:16px; padding:16px}
.h-page{font-size:30px; font-weight:800; margin-bottom:14px}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.tile{border:2px solid var(--line); border-radius:16px; padding:12px 14px; display:flex; gap:10px; align-items:center}
.tile svg{width:30px; height:30px; flex:none}
.tile b{display:block; font-family:var(--display); font-size:22px; line-height:1; font-variant-numeric:tabular-nums}
.tile span{font-size:13px; color:var(--muted); font-weight:700}
.section-t{font-family:var(--display); font-size:22px; font-weight:800; margin:24px 0 10px}
.setting{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:2px solid var(--line)}
.setting:last-child{border-bottom:none}
.seg{display:flex; gap:6px}
.seg button{border:2px solid var(--line); background:var(--panel); border-radius:12px; padding:6px 10px; font-weight:900; cursor:pointer; box-shadow:0 3px 0 var(--line)}
.seg button.on{border-color:var(--u4); color:var(--u4); background:color-mix(in srgb,var(--u4) 10%,transparent); box-shadow:0 3px 0 color-mix(in srgb,var(--u4) 45%,transparent)}
.toggle{width:52px; height:30px; border-radius:99px; border:none; background:var(--lock); position:relative; cursor:pointer}
.toggle::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff; box-shadow:0 2px 0 rgba(0,0,0,.15); transition:left .15s}
.toggle.on{background:var(--go)} .toggle.on::after{left:25px}
.demo{border:2px dashed var(--line-2); border-radius:16px; padding:16px; display:grid; gap:10px; position:relative; margin-top:28px}
.sticker{position:absolute; top:-14px; right:14px; background:var(--gold); color:#5A3E00; font-weight:900; font-size:12px; letter-spacing:.06em; text-transform:uppercase; padding:4px 10px; border-radius:8px; transform:rotate(3deg); box-shadow:0 2px 0 var(--gold-edge)}
.demo p{font-size:14px; color:var(--muted)}
.demo .btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.leagues{display:grid; gap:10px}
.league{display:flex; align-items:center; gap:14px; padding:12px 14px; border:2px solid var(--line); border-radius:16px}
.league .badge{width:48px; height:48px; flex:none}
.league b{font-family:var(--display); font-size:19px; display:block; line-height:1.1}
.league span{font-size:13px; color:var(--muted)}
.league.me{border-color:var(--u4); background:color-mix(in srgb,var(--u4) 8%,transparent)}

/* ---------- Full screens ---------- */
.screen{position:fixed; inset:0; z-index:50; background:var(--bg); display:grid; grid-template-rows:auto 1fr auto; padding-top:env(safe-area-inset-top,0px)}
.screen .body{overflow-y:auto; padding-inline:16px}
.screen .inner{max-width:600px; margin:0 auto; padding-block:20px}
.screen .foot{border-top:2px solid var(--line); padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.screen .foot-in{max-width:600px; margin:0 auto; display:grid; gap:12px}
.center{min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:16px; padding-block:24px}
.center h1{font-size:34px; font-weight:800}
.center p.lead{font-size:18px; color:var(--muted); max-width:36ch}
.choice-list{display:grid; gap:10px; width:100%; max-width:420px; text-align:left}
.opt{display:flex; align-items:center; gap:12px; width:100%; padding:14px 16px; border:2px solid var(--line); border-radius:16px; background:var(--panel); box-shadow:0 4px 0 var(--line); cursor:pointer; font-weight:800; text-align:left; transition:transform .06s, box-shadow .06s}
.opt:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.opt .k{flex:none; width:30px; height:30px; border:2px solid var(--line); border-radius:9px; display:grid; place-items:center; font-size:14px; color:var(--muted); font-weight:900}
.opt small{display:block; color:var(--muted); font-weight:700; font-size:13px}
.opt.sel{border-color:var(--u4); background:color-mix(in srgb,var(--u4) 10%,transparent); box-shadow:0 4px 0 color-mix(in srgb,var(--u4) 50%,transparent); color:var(--u4)}
.opt.sel .k{border-color:var(--u4); color:var(--u4)}
.opt.good{border-color:var(--ok); background:var(--ok-soft); color:var(--ok-ink); box-shadow:0 4px 0 var(--ok)}
.opt.good .k{border-color:var(--ok); color:var(--ok-ink)}
.opt.bad{border-color:var(--ko); background:var(--ko-soft); color:var(--ko-ink); box-shadow:0 4px 0 var(--ko)}
.opt[disabled]{cursor:default}

/* ---------- Lesson ---------- */
.lhead{max-width:640px; width:100%; margin:0 auto; display:flex; align-items:center; gap:14px; padding:16px}
.xbtn{border:none; background:none; cursor:pointer; color:var(--lock-ink); padding:4px; display:grid; place-items:center}
.xbtn svg{width:26px; height:26px}
.lhead .bar{flex:1}
.lhead .bar i{background:var(--go)}
.lives-pill{display:flex; align-items:center; gap:4px; color:var(--heart); font-weight:900; font-size:18px; font-variant-numeric:tabular-nums}
.lives-pill svg{width:26px; height:26px}
.lives-pill.hit{animation:hit .5s}
@keyframes hit{0%,100%{transform:scale(1)}30%{transform:scale(1.35) rotate(-8deg)}60%{transform:scale(.9)}}
.kicker{font-family:var(--display); font-size:24px; font-weight:800; margin-bottom:18px}
.retry-tag{display:inline-flex; align-items:center; gap:6px; color:var(--u3); font-weight:900; font-size:13px; letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px}
.qtext{font-size:21px; font-weight:800; line-height:1.3; margin-bottom:22px}
.intro{display:grid; gap:18px}
.intro-top{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:center}
.memo{border:2px solid var(--line); border-radius:18px; overflow:hidden}
.memo-h{background:var(--c0,var(--u1)); color:#fff; padding:10px 16px; font-weight:900; font-size:13px; letter-spacing:.08em; text-transform:uppercase; display:flex; justify-content:space-between}
.memo ol{list-style:none; margin:0; padding:6px 16px; counter-reset:m}
.memo li{counter-increment:m; display:grid; grid-template-columns:32px 1fr; gap:10px; padding:12px 0; border-bottom:2px dashed var(--line); font-weight:700; animation:rise .35s both}
.memo li:last-child{border-bottom:none}
.memo li:nth-child(2){animation-delay:.12s} .memo li:nth-child(3){animation-delay:.24s}
.memo li::before{content:counter(m); width:28px; height:28px; border-radius:50%; background:var(--soft); color:var(--c0,var(--u1)); display:grid; place-items:center; font-weight:900; font-family:var(--display)}
@keyframes rise{from{transform:translateY(8px)}to{transform:none}}
.vf{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.vf .opt{justify-content:center; padding:22px 16px; font-size:19px}
.pairs{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.pairs .col{display:grid; gap:10px; align-content:start}
.ptile{min-height:58px; padding:10px 12px; border:2px solid var(--line); border-radius:14px; background:var(--panel); box-shadow:0 4px 0 var(--line); font-weight:800; cursor:pointer; text-align:center; font-size:15px; line-height:1.25; transition:transform .06s, box-shadow .06s, opacity .3s}
.ptile:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.ptile.sel{border-color:var(--u4); color:var(--u4); background:color-mix(in srgb,var(--u4) 10%,transparent); box-shadow:0 4px 0 color-mix(in srgb,var(--u4) 50%,transparent)}
.ptile.bad{border-color:var(--ko); color:var(--ko-ink); background:var(--ko-soft); animation:shake .35s}
.ptile.good{border-color:var(--ok); color:var(--ok-ink); background:var(--ok-soft)}
.ptile.gone{opacity:.35; box-shadow:0 4px 0 var(--line); border-color:var(--line); color:var(--muted); background:var(--panel); cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lfoot{transition:background .2s}
.lfoot.good{background:var(--ok-soft); border-top-color:transparent}
.lfoot.bad{background:var(--ko-soft); border-top-color:transparent}
.verdict{display:grid; grid-template-columns:auto 1fr; gap:12px; align-items:start}
.verdict .ico{width:52px; height:52px; border-radius:50%; background:var(--panel); display:grid; place-items:center}
.verdict .ico svg{width:30px; height:30px}
.verdict h3{font-size:24px; font-weight:800}
.lfoot.good .verdict h3,.lfoot.good .verdict .ico{color:var(--ok-ink)}
.lfoot.bad .verdict h3,.lfoot.bad .verdict .ico{color:var(--ko-ink)}
.verdict p{font-size:15px; font-weight:700; margin-top:4px}
.verdict p.ans{font-weight:900}
@media (min-width:700px){ .foot-in.split{grid-template-columns:1fr 220px; align-items:center} }

/* ---------- End & streak ---------- */
.endtiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:440px}
.etile{border-radius:14px; border:2px solid var(--tc); overflow:hidden; background:var(--tc)}
.etile small{display:block; color:#fff; font-weight:900; font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:5px 4px}
.etile div{background:var(--bg); border-radius:11px 11px 12px 12px; padding:12px 4px; display:flex; align-items:center; justify-content:center; gap:5px; color:var(--tc); font-family:var(--display); font-weight:800; font-size:22px; font-variant-numeric:tabular-nums}
.etile svg{width:20px; height:20px}
.bignum{font-family:var(--display); font-weight:800; font-size:96px; line-height:.9; color:var(--heart); font-variant-numeric:tabular-nums}
.bignum.flat{color:var(--flat)}
.bpm{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:99px; background:var(--heart-soft); color:var(--heart-edge); font-weight:900; font-size:14px}
.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; width:100%; max-width:380px; padding:14px; border:2px solid var(--line); border-radius:16px}
.day{display:grid; justify-items:center; gap:6px; font-size:12px; font-weight:900; color:var(--muted)}
.day i{width:30px; height:30px; border-radius:50%; background:var(--lock); display:grid; place-items:center}
.day i svg{width:18px; height:18px}
.day.on i{background:var(--heart); color:#fff}
.day.freeze i{background:var(--u4); color:#fff}
.day.today{color:var(--ink)}
.ecgline{width:100%; max-width:420px; height:60px}
.ecgline path{fill:none; stroke-width:4; stroke-linecap:round; stroke-linejoin:round}
.ecgline.live path{stroke:var(--heart); stroke-dasharray:640; animation:trace 2.2s linear infinite}
.ecgline.flatl path{stroke:var(--flat)}
@keyframes trace{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
.defibs{display:flex; gap:8px; align-items:center; justify-content:center; font-weight:800; color:var(--muted)}
.defibs svg{width:34px; height:34px}

/* ---------- Modal ---------- */
.scrim{position:fixed; inset:0; z-index:80; background:rgba(15,18,28,.55); display:flex; align-items:flex-end; justify-content:center; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet{width:100%; max-width:480px; max-height:86vh; overflow-y:auto; background:var(--panel); border-radius:22px; padding:22px 18px 18px; display:grid; gap:14px; text-align:center; animation:sheet .22s cubic-bezier(.3,1.3,.5,1)}
@keyframes sheet{from{transform:translateY(40px)}to{transform:none}}
.sheet h2{font-size:26px; font-weight:800}
.sheet p{color:var(--muted)}
.sheet .mascot{display:flex; justify-content:center}
@media (min-width:700px){ .scrim{align-items:center} }
.guide{text-align:left; display:grid; gap:0}
.guide li{list-style:none; display:grid; grid-template-columns:1fr auto; gap:2px 10px; padding:10px 0; border-bottom:2px solid var(--line)}
.guide li:last-child{border-bottom:none}
.guide b{font-weight:900}
.guide span{grid-column:1; font-size:14px; color:var(--muted)}
.chip{grid-row:1; grid-column:2; align-self:start; font-size:11px; font-weight:900; letter-spacing:.06em; text-transform:uppercase; padding:3px 8px; border-radius:99px}
.chip.lycee{background:var(--go-soft); color:var(--go-edge)}
.chip.pont{background:var(--gold-soft); color:var(--gold-edge)}
.chip.fac{background:color-mix(in srgb,var(--u2) 14%,transparent); color:var(--u2)}
.guide-hs{font-size:14px; color:var(--muted); text-align:left; padding:10px 12px; background:var(--soft); border-radius:12px}
canvas.confetti{position:fixed; inset:0; z-index:90; pointer-events:none; width:100%; height:100%}

/* ---------- Motion & FX ---------- */
canvas.fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:95}
.brand{background:none; border:none; padding:0; cursor:pointer}
.brand:active svg{transform:scale(.9)}
.poke{background:none; border:none; padding:0; cursor:pointer; border-radius:50%}
.boum.jump{animation:jump .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes jump{0%{transform:none}30%{transform:translateY(-22px) rotate(-6deg)}55%{transform:scale(1.08,.92)}75%{transform:translateY(-6px)}100%{transform:none}}
.bubble.wiggle{animation:wig .4s}
@keyframes wig{0%,100%{transform:none}30%{transform:rotate(-2deg) scale(1.03)}60%{transform:rotate(1.5deg)}}
.node.stamp{animation:stamp .6s cubic-bezier(.3,1.7,.5,1)}
@keyframes stamp{0%{transform:scale(1.5) rotate(-10deg)}100%{transform:none}}
.node.unlocking{animation:unlockIn .8s .5s cubic-bezier(.3,1.6,.5,1) both}
@keyframes unlockIn{0%{filter:grayscale(1) brightness(1.1); transform:scale(.8)}60%{filter:none; transform:scale(1.15)}100%{transform:none}}
.stat.bump{animation:bump .5s .35s cubic-bezier(.3,1.8,.5,1) both}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4) rotate(-6deg)}100%{transform:scale(1)}}

.combo{display:inline-flex; align-items:center; gap:1px; font-family:var(--display); font-weight:800; font-size:18px; line-height:1; color:var(--u4); padding:4px 8px 3px; border-radius:10px; font-variant-numeric:tabular-nums}
.combo svg{width:17px; height:17px}
.combo.t0{color:var(--ok-ink)}
.combo.t1{color:#fff; background:linear-gradient(135deg,#FFB020,#FF5A1F); animation:humO 1s ease-in-out infinite}
.combo.t2{color:#fff; background:linear-gradient(135deg,#1E9BFF,#7C5CFF); animation:hum 1.1s ease-in-out infinite}
.combo.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1)}
.combo.t1.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1), humO 1s .45s ease-in-out infinite}
.combo.t2.bump{animation:bump .45s cubic-bezier(.3,1.8,.5,1), hum 1.1s .45s ease-in-out infinite}
@keyframes humO{0%,100%{box-shadow:0 0 0 2px rgba(255,176,32,.35), 0 0 10px rgba(255,106,31,.45)}50%{box-shadow:0 0 0 3px rgba(255,176,32,.7), 0 0 20px rgba(255,106,31,.8)}}
@keyframes hum{0%,100%{box-shadow:0 0 0 2px rgba(127,231,255,.35), 0 0 10px rgba(30,155,255,.45)}50%{box-shadow:0 0 0 3px rgba(127,231,255,.7), 0 0 22px rgba(30,155,255,.85)}}
.bar.charged i{background:linear-gradient(90deg,#14B89C 0%,#3FD6FF 25%,#14B89C 50%,#3FD6FF 75%,#14B89C 100%); background-size:200% 100%; animation:charge .8s linear infinite; box-shadow:0 0 12px rgba(63,214,255,.75)}
@keyframes charge{to{background-position:-200% 0}}
.lives-pill{position:relative}
.minus{position:absolute; right:-6px; top:-8px; color:var(--ko); font-family:var(--display); font-weight:800; font-size:20px; pointer-events:none; animation:floatUp .9s ease-out forwards}
@keyframes floatUp{to{transform:translateY(-28px); opacity:0}}
.screen.quake{animation:quake .35s}
@keyframes quake{0%,100%{transform:none}20%{transform:translate(-6px,2px)}40%{transform:translate(5px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}

.inner.enter{animation:stepIn .38s cubic-bezier(.2,1.1,.4,1)}
@keyframes stepIn{from{transform:translateX(36px); opacity:.25}}
.enter .opt,.enter .ptile{animation:optIn .42s cubic-bezier(.3,1.4,.5,1) both}
.enter .choice-list .opt:nth-child(2),.enter .vf .opt:nth-child(2),.enter .col .ptile:nth-child(2){animation-delay:.05s}
.enter .choice-list .opt:nth-child(3),.enter .col .ptile:nth-child(3){animation-delay:.1s}
.enter .choice-list .opt:nth-child(4),.enter .col .ptile:nth-child(4){animation-delay:.15s}
@keyframes optIn{from{transform:translateY(14px) scale(.96); opacity:.3}}
.opt.good.popnow,.ptile.good.pop{animation:popGood .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes popGood{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
.opt.bad.shakenow{animation:shake .4s}
.lfoot.rise{animation:footUp .34s cubic-bezier(.2,1.35,.4,1)}
@keyframes footUp{from{transform:translateY(100%)}}
.rise .ico{animation:icoPop .5s .08s cubic-bezier(.3,1.8,.5,1) both}
@keyframes icoPop{from{transform:scale(0) rotate(-40deg)}}
.lost{display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; opacity:.8; margin-top:4px}
.lost svg{width:14px; height:14px}

.combo-pop{position:fixed; left:50%; top:36%; z-index:96; transform:translate(-50%,-50%); display:grid; justify-items:center; gap:8px; pointer-events:none; animation:cpIn .5s cubic-bezier(.2,1.7,.4,1) both}
.combo-pop.out{animation:cpOut .35s ease-in forwards}
.cp-n{display:flex; align-items:center; gap:2px; font-family:var(--display); font-weight:800; font-size:88px; line-height:.9; color:#fff; -webkit-text-stroke:4px #1A6ED8; paint-order:stroke fill; text-shadow:0 5px 0 #1A6ED8, 0 0 30px rgba(63,214,255,.9)}
.cp-n svg{width:70px; height:70px; filter:drop-shadow(0 0 12px rgba(255,210,60,.9))}
.cp-t{font-weight:900; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#fff; background:linear-gradient(135deg,#1E9BFF,#7C5CFF); padding:7px 16px; border-radius:99px; box-shadow:0 4px 0 #3D2BB0; white-space:nowrap}
@keyframes cpIn{from{transform:translate(-50%,-50%) scale(.2) rotate(-14deg); opacity:0}}
@keyframes cpOut{to{transform:translate(-50%,-90%) scale(.8); opacity:0}}

.titlepop{animation:titlePop .6s cubic-bezier(.3,1.7,.5,1) both}
@keyframes titlePop{from{transform:scale(.3); opacity:.2}}
.jumper .boum{animation:hop .9s .3s cubic-bezier(.3,1.4,.5,1) 3}
@keyframes hop{0%,100%{transform:none}30%{transform:translateY(-28px) rotate(-5deg)}55%{transform:scale(1.07,.93)}}
.endtiles .etile{transform:scale(0)}
.etile.land{animation:landT .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes landT{0%{transform:translateY(-60px) scale(2.2); opacity:.2}60%{transform:translateY(0) scale(.9); opacity:1}100%{transform:none; opacity:1}}
.etile div.landed{animation:bump .35s}

/* Judgement words */
.judge{position:fixed; z-index:96; pointer-events:none; display:grid; justify-items:center; transform:translate(-50%,-50%); animation:judgeIn 1s cubic-bezier(.2,1.4,.4,1) forwards}
.judge b{font-family:var(--display); font-weight:800; font-style:italic; font-size:36px; line-height:1; letter-spacing:.02em; color:#fff; -webkit-text-stroke:5px var(--jc); paint-order:stroke fill; text-shadow:0 4px 0 var(--jc), 0 0 22px var(--jg); white-space:nowrap}
.judge small{font-family:var(--display); font-weight:800; font-size:15px; letter-spacing:.06em; text-transform:uppercase; color:#fff; -webkit-text-stroke:3px var(--jc); paint-order:stroke fill; margin-top:2px}
.judge.t0{--jc:#2A9A3A; --jg:rgba(61,186,78,.6)}
.judge.t1{--jc:#E8620F; --jg:rgba(255,138,31,.75)}
.judge.t2{--jc:#1A6ED8; --jg:rgba(63,214,255,.9)}
.judge.miss{--jc:#D32F2F; --jg:rgba(255,75,75,.5)}
.judge.miss b{font-size:28px}
@keyframes judgeIn{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg); opacity:0}18%{transform:translate(-50%,-50%) scale(1.25) rotate(-4deg); opacity:1}30%{transform:translate(-50%,-50%) scale(1) rotate(-3deg)}75%{opacity:1}100%{transform:translate(-50%,-115%) scale(.95) rotate(-3deg); opacity:0}}

/* Progress bar tiers: green -> orange -> electric blue */
.lbar{transition:box-shadow .3s}
.lbar.tier0 i{background:var(--ok)}
.lbar.tier1 i{background:linear-gradient(90deg,#FFB020 0%,#FF5A1F 25%,#FFB020 50%,#FF5A1F 75%,#FFB020 100%); background-size:200% 100%; animation:charge .7s linear infinite; box-shadow:0 0 12px rgba(255,106,31,.75)}
.lbar.tier2{box-shadow:0 0 0 2px rgba(127,231,255,.45), 0 0 16px rgba(30,155,255,.45)}
.lbar.tier2 i{background:linear-gradient(90deg,#1E9BFF 0%,#7FE7FF 25%,#7C5CFF 50%,#7FE7FF 75%,#1E9BFF 100%); background-size:200% 100%; animation:charge .45s linear infinite; box-shadow:0 0 16px rgba(63,180,255,.9)}
.ptile.gone{opacity:.55; border-color:color-mix(in srgb,var(--ok) 45%,var(--line)); background:color-mix(in srgb,var(--ok-soft) 60%,var(--panel)); color:var(--ok-ink); box-shadow:0 4px 0 color-mix(in srgb,var(--ok) 30%,var(--line))}

/* End screen */
.endwrap{gap:14px}
.hero{position:relative; width:170px; height:170px; display:grid; grid-template-columns:minmax(0,1fr); place-items:center}
.rays{position:absolute; left:50%; top:50%; width:440px; height:440px; margin:-220px 0 0 -220px; border-radius:50%; background:repeating-conic-gradient(from 0deg, color-mix(in srgb,var(--rc) 32%,transparent) 0deg 9deg, transparent 9deg 18deg); -webkit-mask:radial-gradient(circle,#000 16%,transparent 66%); mask:radial-gradient(circle,#000 16%,transparent 66%); animation:raySpin 14s linear infinite, raysIn .8s .35s both; pointer-events:none}
@keyframes raySpin{to{transform:rotate(360deg)}}
@keyframes raysIn{from{opacity:0}}
.bw{position:relative}
.bw-slam{animation:slam .45s cubic-bezier(.55,0,.9,.5) both}
@keyframes slam{0%{transform:translateY(-110vh)}82%{transform:translateY(0) scale(1.28,.7)}100%{transform:none}}
.bw-spin{animation:spinIn .55s cubic-bezier(.3,1.3,.5,1) both}
@keyframes spinIn{0%{transform:scale(0) rotate(-720deg)}100%{transform:none}}
.bw-rocket{animation:rocket .5s cubic-bezier(.2,1.1,.4,1) both}
@keyframes rocket{0%{transform:translateY(70vh) scale(.6,1.5)}75%{transform:translateY(-24px) scale(.95,1.08)}100%{transform:none}}
.bw-pulse{animation:bigPulse .72s ease-out both}
@keyframes bigPulse{0%{transform:scale(.2)}22%{transform:scale(.55)}32%{transform:scale(.45)}55%{transform:scale(.8)}66%{transform:scale(.7)}88%{transform:scale(1.2)}100%{transform:none}}
.bw.party .boum{animation:hop .8s cubic-bezier(.3,1.4,.5,1) 3}
.end-title{font-size:34px; font-weight:800; color:var(--gold-edge); transform:scale(0)}
.end-title.in{animation:titleIn .55s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes titleIn{0%{transform:scale(.3)}100%{transform:scale(1)}}
.acc{position:relative; width:150px; height:150px}
.acc svg{width:100%; height:100%; transform:rotate(-90deg)}
.acc-track{fill:none; stroke:var(--line); stroke-width:14}
.acc-fill{fill:none; stroke-width:14; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100}
.acc-in{position:absolute; inset:0; display:grid; place-content:center; text-align:center}
.acc-in b{font-family:var(--display); font-size:38px; font-weight:800; line-height:1; font-variant-numeric:tabular-nums}
.acc-in span{font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.gstamp{position:absolute; left:calc(100% - 44px); top:2px; font-family:var(--display); font-weight:800; font-style:italic; font-size:20px; color:#fff; background:var(--sc); padding:6px 12px 4px; border-radius:10px; box-shadow:0 4px 0 rgba(0,0,0,.2); transform:rotate(10deg) scale(0); white-space:nowrap}
.gstamp.in{animation:stampIn .45s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes stampIn{0%{transform:rotate(14deg) scale(3); opacity:0}60%{transform:rotate(8deg) scale(.9); opacity:1}100%{transform:rotate(10deg) scale(1); opacity:1}}
.bignum.popnum{animation:numPop .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes numPop{0%{transform:scale(1.9); filter:brightness(1.6)}100%{transform:none}}
.chip-combo{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:linear-gradient(135deg,#1E9BFF,#7C5CFF); color:#fff; font-weight:900; font-size:14px; animation:titlePop .5s 1.5s cubic-bezier(.3,1.7,.5,1) both}
.chip-combo svg{width:16px; height:16px}

/* ---------- Splash ---------- */
.splash{position:fixed; inset:0; z-index:94; background:#FF4760; display:grid; place-items:center; overflow:hidden; cursor:pointer}
.sp-line{position:fixed; left:0; top:calc(50% - 110px); width:100vw; height:120px}
.sp-line path{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-linejoin:round}
.flatp{stroke-dasharray:100; stroke-dashoffset:100; opacity:.9; animation:draw .55s ease-out forwards}
.beatp{opacity:0}
.zap .flatp{opacity:0; transition:opacity .08s}
.zap .beatp{opacity:.45; stroke-dasharray:100; stroke-dashoffset:100; animation:draw .9s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sp-stage{position:relative; display:grid; justify-items:center; gap:10px}
.sp-logo{width:156px; height:156px; transform:scale(0)}
.sp-logo svg{width:100%; height:100%; overflow:visible}
.zap .sp-logo{animation:logoIn .75s cubic-bezier(.2,1.7,.4,1) forwards}
@keyframes logoIn{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1)}}
.beat .sp-logo svg{animation:hb .75s ease-in-out infinite; transform-origin:50% 60%}
.sp-word{font-family:var(--display); font-weight:800; font-size:60px; line-height:1; color:#fff; text-shadow:0 5px 0 #D42A45}
.sp-word span{display:inline-block; transform:scale(0)}
.word .sp-word span{animation:letter .5s cubic-bezier(.3,1.8,.5,1) forwards; animation-delay:calc(var(--i) * 55ms)}
@keyframes letter{0%{transform:translateY(26px) scale(0)}100%{transform:none}}
.sp-tag{color:#fff; font-weight:800; font-size:17px; opacity:0}
.word .sp-tag{animation:fadeUp .4s .45s forwards}
@keyframes fadeUp{from{transform:translateY(8px); opacity:0}to{transform:none; opacity:.92}}
.splash.out{animation:spOut .4s ease-in forwards}
@keyframes spOut{to{opacity:0; transform:scale(1.25)}}

/* ---------- Boum skits ---------- */
.screen .body{overflow-x:hidden}
.boum .bm-ink{fill:none; stroke:var(--bm-line); stroke-linecap:round; stroke-linejoin:round}
.boum .bm-fill{fill:none; stroke:var(--bm-body); stroke-linecap:round}
.boum .bm-foot{fill:var(--bm-shade); stroke:var(--bm-line); stroke-width:2.2; stroke-linejoin:round}
.boum .bm-shine{fill:none; stroke:#fff; stroke-opacity:.5; stroke-linecap:round}
.boum .bm-cheek{fill:var(--bm-cheek); opacity:.78}
.boum .bm-swoosh{fill:none; stroke:var(--bm-line); stroke-width:1.5; stroke-linecap:round; opacity:.55}
.boum .pad{fill:#E4E7EE; stroke:#949CAD; stroke-width:2}
.boum .spiral{transform-box:fill-box; transform-origin:center; animation:spinz .9s linear infinite}
@keyframes spinz{to{transform:rotate(360deg)}}
.boum .arms{transform-origin:60px 106px; transition:transform .2s}
.poke .boum{transform-origin:50% 90%}
.boum.flip{animation:flip .7s cubic-bezier(.3,1.3,.5,1)}
@keyframes flip{0%{transform:none}45%{transform:translateY(-34px) rotate(-200deg)}80%{transform:translateY(0) rotate(-360deg)}100%{transform:rotate(-360deg)}}
.boum.shiver{animation:shiver .7s}
@keyframes shiver{0%{transform:none}35%{transform:scale(1.08,.92) translateY(4px)}50%{transform:scale(.9,1.14) translateY(-10px)}60%{transform:translateX(-4px)}70%{transform:translateX(4px)}80%{transform:translateX(-3px)}100%{transform:none}}
.boum.spinme{animation:spinme .8s cubic-bezier(.3,1.2,.5,1)}
@keyframes spinme{to{transform:rotateY(720deg)}}
.boum.faint{animation:faint 1.5s ease-in-out}
@keyframes faint{0%{transform:none}25%,75%{transform:rotate(80deg) translate(6px,8px); filter:grayscale(1)}100%{transform:none}}
.boum.sing1{animation:sway .28s ease-in-out 4 alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

.hero.wide{width:300px; height:180px}
.defib-duo{position:relative; display:grid; place-items:center}
.defib-duo .defib-ico{position:absolute; right:calc(100% + 4px); top:50%; transform:translateY(-50%); display:grid}
.stage{position:relative; width:100%; min-width:0; height:100%; display:flex; align-items:center; justify-content:center}
.stage > *{flex:none}
.say{position:absolute; left:50%; top:-14px; z-index:3; background:var(--panel); color:var(--ink); border:2px solid var(--line); border-radius:14px; padding:6px 12px; font-weight:900; font-size:15px; white-space:nowrap; transform:translateX(-50%) scale(0); pointer-events:none}
.say:empty{display:none}
.say.in{animation:sayIn .32s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes sayIn{to{transform:translateX(-50%) scale(1)}}

.sk-write{position:relative; width:300px; height:170px}
.paper{position:absolute; left:0; right:0; top:24px; height:112px; border-radius:6px; transform:rotate(-2deg); background-color:#FFFFFF;
  background-image:linear-gradient(90deg,transparent 30px,#F07A8C 30px,#F07A8C 32px,transparent 32px),repeating-linear-gradient(180deg,#9FB3EA 0 1px,transparent 1px 32px),repeating-linear-gradient(180deg,#DCE4F8 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,#DCE4F8 0 1px,transparent 1px 32px);
  box-shadow:0 5px 0 rgba(0,0,0,.08),0 12px 24px var(--shadow); display:flex; align-items:center; padding-left:42px}
.ink{font-family:"Caveat","Comic Sans MS",cursive; font-weight:700; font-size:46px; color:#1F3FBF; line-height:1; white-space:nowrap; clip-path:inset(-12px 100% -12px 0)}
.ink.go{animation:inkw 1.3s steps(26,end) forwards}
@keyframes inkw{to{clip-path:inset(-12px 0 -12px 0)}}
.uline{position:absolute; left:40px; right:24px; bottom:14px; height:12px; overflow:visible}
.uline path{fill:none; stroke:#E53950; stroke-width:4; stroke-linecap:round; stroke-dasharray:100; stroke-dashoffset:100}
.uline.go path{animation:draw .3s ease-out forwards}
.writer{position:absolute; left:0; top:-2px; transform:translateX(var(--x0)) scale(0)}
.writer.in{animation:wIn .35s cubic-bezier(.3,1.7,.5,1) forwards}
@keyframes wIn{to{transform:translateX(var(--x0)) scale(1)}}
.writer.go{transform:translateX(var(--x0)); animation:wGo 1.3s linear forwards}
@keyframes wGo{from{transform:translateX(var(--x0))}to{transform:translateX(var(--x1))}}
.writer.go .boum{animation:scrib .11s ease-in-out infinite alternate}
@keyframes scrib{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-5px) rotate(4deg)}}
.writer.done{transform:translateX(var(--x1)); transition:transform .4s cubic-bezier(.3,1.3,.5,1)}
.writer.hop .boum{animation:jump .6s cubic-bezier(.3,1.5,.5,1)}

.sk-sing{position:relative; width:170px; height:170px; display:grid; place-items:center}
.spot{position:absolute; left:50%; top:-150px; width:240px; height:330px; margin-left:-120px; background:linear-gradient(180deg,rgba(255,226,122,0),rgba(255,226,122,.45)); clip-path:polygon(42% 0,58% 0,100% 100%,0 100%); pointer-events:none; animation:spotIn .5s both}
@keyframes spotIn{from{opacity:0}}
.sk-sing .boum{animation:sway .45s ease-in-out infinite alternate}
.sk-sing.bow .boum{animation:bowd .8s ease-in-out forwards}
@keyframes bowd{0%{transform:none}40%,70%{transform:translateY(8px) rotate(14deg) scale(1,.9)}100%{transform:none}}
.sk-sing .mouth{transform-box:fill-box; transform-origin:center; transform:scaleY(.25); transition:transform .06s}
.sk-sing.open .mouth{transform:scaleY(1.2)}
.note{position:absolute; left:52%; top:50%; width:28px; height:28px; pointer-events:none; animation:noteUp 1.3s ease-out forwards}
.note svg{width:100%; height:100%}
@keyframes noteUp{0%{transform:translate(0,0) scale(.3); opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-130px) rotate(var(--r)) scale(1.15); opacity:0}}

.crash-layer{position:fixed; inset:0; z-index:93; pointer-events:none; overflow:hidden}
.flyer{position:absolute; width:220px; height:220px; margin:-110px 0 0 -110px; animation:flyIn .62s cubic-bezier(.6,0,1,.6) forwards}
@keyframes flyIn{0%{transform:scale(.06) rotate(-40deg)}100%{transform:scale(2.6) rotate(0)}}
.flyer.smash{animation:smashIn .12s ease-out forwards}
@keyframes smashIn{from{transform:scale(2.6)}to{transform:scale(3,2.35)}}
.flyer.slidedown{animation:slideDown 1s cubic-bezier(.5,0,.9,.6) forwards}
@keyframes slideDown{0%{transform:scale(3,2.35)}25%{transform:translateY(14px) scale(3,2.4)}100%{transform:translateY(95vh) scale(2.6,3) rotate(10deg)}}
.cracks{position:absolute; inset:0; width:100%; height:100%; fill:none; stroke-linecap:round; stroke-linejoin:round; animation:crackIn .1s ease-out}
@keyframes crackIn{from{opacity:0}}
.crash-layer.fade{animation:fadeOut .6s forwards}
@keyframes fadeOut{to{opacity:0}}

.sk-defib{position:relative; width:230px; height:170px; display:grid; place-items:center}
.sk-defib.charging .pad{animation:padGlow .16s infinite alternate}
@keyframes padGlow{to{fill:#FFE27A; stroke:#FFB300}}
.sk-defib.charging .boum{animation:tremble .08s infinite}
@keyframes tremble{0%{transform:translate(0,0)}50%{transform:translate(1px,-1px)}100%{transform:translate(-1px,1px)}}
.sk-defib.zapped .boum{animation:electro .5s steps(1)}
@keyframes electro{0%{filter:invert(1) brightness(1.4); transform:translate(-4px,2px) scale(1.06)}20%{filter:none; transform:translate(4px,-2px)}40%{filter:invert(1) brightness(1.4); transform:translate(-3px,-2px) scale(1.08)}60%{filter:none; transform:translate(3px,2px)}80%{filter:invert(1) brightness(1.3)}100%{filter:none; transform:none}}
.puff{position:absolute; left:calc(50% + var(--x)); top:28px; width:22px; height:22px; border-radius:50%; background:#B9C0CE; opacity:0; animation:puff 1.1s var(--d) ease-out forwards; pointer-events:none}
@keyframes puff{0%{transform:scale(.3); opacity:.9}100%{transform:translateY(-60px) scale(2.2); opacity:0}}

.sk-cardio{position:relative; width:210px; height:170px; display:grid; place-items:center}
.sk-cardio .bb{transition:transform .22s ease-in-out}
.sk-cardio.down .bb{transform:translateY(15px) scale(1.04,.94)}
.sk-cardio.down .arms{transform:scaleY(.6)}
.count{position:absolute; right:0; top:10px; font-family:var(--display); font-weight:800; font-size:44px; color:var(--u4); transform:scale(0)}
.count.pop{animation:cntPop .45s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes cntPop{from{transform:scale(2) rotate(-12deg); opacity:.3}to{transform:rotate(-6deg); opacity:1}}

.sk-balloon{position:relative; width:170px; height:170px; display:grid; place-items:center}
.sk-balloon.inflate .boum{animation:inflate 1.35s cubic-bezier(.4,0,.8,.6) forwards}
@keyframes inflate{0%{transform:scale(1)}20%{transform:scale(1.15,1.08)}32%{transform:scale(1.08,1.2)}52%{transform:scale(1.45,1.32)}66%{transform:scale(1.38,1.55)}86%{transform:scale(1.85,1.78)}100%{transform:scale(2,1.95)}}
.sk-balloon.popped .boum{opacity:0; transform:scale(2.4); transition:opacity .06s, transform .06s}
.sk-balloon.reform .boum{animation:reform .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes reform{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
.boum.hopping{animation:hop .8s cubic-bezier(.3,1.4,.5,1) 3}

/* ---------- Subjects ---------- */
.subjects{display:flex; gap:8px; overflow-x:auto; padding:2px 2px 10px; margin-bottom:12px; scrollbar-width:none; scroll-snap-type:x proximity}
.subjects::-webkit-scrollbar{display:none}
.subj{flex:none; display:grid; grid-template-columns:auto auto; grid-template-rows:auto auto; column-gap:8px; align-items:center; padding:7px 12px 7px 8px; border-radius:14px; border:2px solid var(--line); background:var(--panel); box-shadow:0 3px 0 var(--line); cursor:pointer; scroll-snap-align:start; text-align:left; transition:transform .06s}
.subj:active{transform:translateY(2px)}
.subj-ico{grid-row:1 / 3; width:36px; height:36px; display:block}
.subj-ico svg{width:100%; height:100%; display:block}
.subj-t{font-weight:900; font-size:14px; line-height:1.15; white-space:nowrap}
.subj-p{font-size:12px; color:var(--muted); font-weight:800; font-variant-numeric:tabular-nums}
.subj.on{background:var(--uc); border-color:var(--uc); box-shadow:0 3px 0 var(--uce); color:#fff}
.subj.on .subj-p{color:rgba(255,255,255,.85)}
.stat.gelst{color:var(--go)}
.stat.gelst svg{width:26px; height:26px}
.tab.tshop svg{color:#2BB24C}
.boostchip{display:inline-flex; margin-left:6px; padding:2px 8px; border-radius:99px; background:linear-gradient(135deg,#FFB020,#FF5A1F); color:#fff; font-size:12px; font-weight:900; vertical-align:middle}

/* ---------- Chest nodes & chest screen ---------- */
.chest{position:relative; background:none; border:none; padding:0; cursor:pointer; display:grid; place-items:center; border-radius:16px}
.chest .kit{display:block; overflow:visible}
.chest.locked .kit{filter:grayscale(1) opacity(.5)}
.chest.opened .kit{filter:saturate(.3) opacity(.75)}
.chest.ready .kit{animation:kitBob 1.3s ease-in-out infinite; filter:drop-shadow(0 0 14px rgba(255,194,46,.75))}
@keyframes kitBob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-7px) rotate(-5deg)}50%{transform:translateY(0)}75%{transform:translateY(-4px) rotate(5deg)}}
.row.chestrow{height:92px}
.chestrow .start-tip{bottom:calc(100% + 4px); color:var(--gold-edge)}
.chest-hero{width:240px; height:230px}
.kitwrap{position:relative; display:grid; place-items:center}
.kitwrap .kit{position:relative}
.kitwrap.drop{animation:kitDrop .42s cubic-bezier(.55,0,.9,.5) both}
@keyframes kitDrop{0%{transform:translateY(-110vh)}82%{transform:translateY(0) scale(1.2,.8)}100%{transform:none}}
.kitwrap.shake{animation:kshake .38s}
@keyframes kshake{0%,100%{transform:none}20%{transform:rotate(-8deg) scale(1.04)}40%{transform:rotate(7deg) scale(1.06)}60%{transform:rotate(-5deg) scale(1.03)}80%{transform:rotate(3deg)}}
.kitwrap.opened .kit{animation:kitPop .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes kitPop{0%{transform:scale(1.35,.7)}100%{transform:none}}
.kitglow{position:absolute; left:50%; top:30%; width:260px; height:260px; margin:-130px 0 0 -130px; border-radius:50%; background:radial-gradient(circle,rgba(255,236,150,.95),rgba(255,194,46,.35) 40%,transparent 70%); animation:glowIn .5s ease-out both; pointer-events:none}
@keyframes glowIn{from{transform:scale(.2); opacity:0}}
.rays.fast{animation:raySpin 2.5s linear infinite}
.gain{display:grid; justify-items:center; transform:scale(0)}
.gain.in{animation:titleIn .45s cubic-bezier(.3,1.8,.5,1) forwards}
.gain-n{display:flex; align-items:center; gap:8px}
.gain-n svg{width:52px; height:52px}
.gain-n b{font-family:var(--display); font-size:64px; line-height:1; color:var(--go); font-variant-numeric:tabular-nums}
.gain-t{font-weight:900; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-size:13px}
.gain.landed .gain-n{animation:bump .4s}
.chtotal{color:var(--muted); font-weight:800; opacity:0}
.chtotal.in{animation:fadeUp .4s forwards}
.gelrow{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; transform:scale(0)}
.gelrow.in{animation:titleIn .45s cubic-bezier(.3,1.8,.5,1) forwards}
.gelchip{display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:99px; background:var(--go-soft); color:var(--go-edge); font-weight:900; font-size:15px}
.gelchip svg{width:20px; height:20px}
.gelchip.gbonus{background:var(--gold-soft); color:var(--gold-edge)}
.gelfly{position:fixed; z-index:96; width:28px; height:28px; pointer-events:none}
.gelfly svg{width:100%; height:100%}
.toast{position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); z-index:97; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:14px; font-weight:900; box-shadow:0 6px 18px var(--shadow); white-space:nowrap; animation:toastIn .3s cubic-bezier(.3,1.6,.5,1)}
.toast svg{width:22px; height:22px}
.toast.out{animation:toastOut .35s forwards}
@keyframes toastIn{from{transform:translate(-50%,20px) scale(.8); opacity:0}}
@keyframes toastOut{to{transform:translate(-50%,20px); opacity:0}}

/* ---------- Pharmacie ---------- */
.wallet{display:flex; align-items:baseline; gap:8px; margin-bottom:14px}
.wallet-n{display:flex; align-items:center; gap:6px}
.wallet-n svg{width:40px; height:40px}

.wallet > span{color:var(--muted); font-weight:800}
.shop{display:grid; gap:12px}
.shop-card{display:grid; grid-template-columns:56px 1fr auto; gap:12px; align-items:center; padding:14px; border:2px solid var(--line); border-radius:18px; background:var(--panel)}

:root{--u7:#FF6F91; --u7e:#D94A6E; --u8:#12B5CB; --u8e:#0A8FA1; --u9:#4C5BD4; --u9e:#3240AD; --u10:#C548C9; --u10e:#9E2FA2}
/* ---------- Slides & fill-in ---------- */

.slide-h b{font-family:var(--display); font-size:21px; line-height:1.15; font-weight:800}
.slide-h span{font-weight:900; font-size:13px; opacity:.85; white-space:nowrap; font-variant-numeric:tabular-nums}
.slide-b{padding:4px 16px 8px; display:grid}
.slide-b p{padding:11px 0; border-bottom:2px dashed var(--line); font-weight:600; font-size:16.5px; line-height:1.55}

.dots{display:flex; gap:6px; align-items:center}
.dots i{width:9px; height:9px; border-radius:99px; background:var(--line); transition:width .2s}
.dots i.on{width:24px; background:var(--c0,var(--u1))}
.trou-q{line-height:1.75}
.blank{display:inline-block; min-width:96px; padding:0 10px; margin:0 3px; border-bottom:3px solid var(--line-2); color:var(--u4); text-align:center; line-height:1.35; border-radius:8px 8px 0 0; transition:background .2s, border-color .2s}
.blank.filled{background:color-mix(in srgb,var(--u4) 12%,transparent); border-color:var(--u4)}
.blank.good{color:var(--ok-ink); border-color:var(--ok); background:var(--ok-soft)}
.blank.bad{color:var(--ko-ink); border-color:var(--ko); background:var(--ko-soft)}
.chips{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.enter .chips .opt{animation:optIn .42s cubic-bezier(.3,1.4,.5,1) both}
.enter .chips .opt:nth-child(2){animation-delay:.05s} .enter .chips .opt:nth-child(3){animation-delay:.1s} .enter .chips .opt:nth-child(4){animation-delay:.15s}

/* ---------- Chest rarities ---------- */
.chestscreen{--tbg:#56637D; --tbg2:#1C2233; background:radial-gradient(circle at 50% 36%, var(--tbg) 0%, var(--tbg2) 72%); color:#fff}
.chestscreen.t1{--tbg:#1E6FE0; --tbg2:#0A1F4D}
.chestscreen.t2{--tbg:#7A3AF0; --tbg2:#1E0B45}
.chestscreen.t3{--tbg:#FF9F1A; --tbg2:#4A1D00}
.chestscreen .foot{border-top-color:rgba(255,255,255,.15)}
.chestscreen .end-title{color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.25)}
.chestscreen .lead,.chestscreen .chtotal,.chestscreen .taphint{color:rgba(255,255,255,.9)}
.chestscreen .gain-n b{color:#fff}
.chestscreen .gain-t{color:rgba(255,255,255,.8)}
.chestscreen .btn[disabled]{--c:rgba(255,255,255,.18); --ce:rgba(0,0,0,.25); --t:rgba(255,255,255,.6)}
.tierpill{display:inline-flex; padding:6px 16px; border-radius:99px; background:rgba(255,255,255,.16); border:2px solid rgba(255,255,255,.4); color:#fff; font-weight:900; letter-spacing:.08em; text-transform:uppercase; font-size:14px}
.tierpill.slam{animation:numPop .5s cubic-bezier(.3,1.8,.5,1)}
.chest-hero{width:280px; height:260px}
.kitwrap{background:none; border:none; padding:0; color:inherit; border-radius:24px}
.kitwrap.tappable{cursor:pointer}
.kitwrap.tap{animation:tapSquash .3s cubic-bezier(.3,1.6,.5,1)}
@keyframes tapSquash{0%{transform:scale(1)}30%{transform:scale(1.16,.84)}60%{transform:scale(.94,1.08)}100%{transform:none}}
.kitwrap.morph{animation:morph .55s cubic-bezier(.3,1.7,.5,1)}
@keyframes morph{0%{transform:scale(.55) rotate(-12deg); filter:brightness(2.4)}100%{transform:none; filter:none}}
.kit{overflow:visible}
.kit .shine{animation:shineX 2s ease-in-out infinite}
@keyframes shineX{0%{transform:translateX(0)}55%,100%{transform:translateX(150px)}}
.kit .tw{transform-box:fill-box; transform-origin:center; animation:twinkle 1.4s ease-in-out infinite}
@keyframes twinkle{0%,100%{transform:scale(.4); opacity:.4}50%{transform:scale(1.15); opacity:1}}
.kitglow{background:radial-gradient(circle, rgba(255,255,255,.95), color-mix(in srgb, var(--gc,#FFC22E) 55%, transparent) 40%, transparent 70%)}
.chmid{display:grid; gap:8px; justify-items:center}
.chmid.gone{display:none}
.pips{display:flex; gap:10px; justify-content:center}
.pips i{width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.55); transition:background .2s, transform .2s}
.pips i.on{background:#fff; box-shadow:0 0 12px rgba(255,255,255,.85); transform:scale(1.15)}

.upbanner{position:fixed; left:50%; top:22%; z-index:96; transform:translate(-50%,-50%); font-family:var(--display); font-weight:800; font-size:clamp(40px,12vw,68px); color:#fff; -webkit-text-stroke:5px var(--uc); paint-order:stroke fill; text-shadow:0 5px 0 var(--uc), 0 0 34px var(--ug); pointer-events:none; white-space:nowrap; animation:cpIn .45s cubic-bezier(.2,1.7,.4,1) both}
.upbanner.out{animation:cpOut .35s ease-in forwards}
.odds{display:grid; padding-block:4px}
.odds > div{display:grid; grid-template-columns:14px 1fr auto; column-gap:10px; align-items:center; padding:9px 0; border-bottom:2px solid var(--line)}

.partsep span{font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--c0)}
.partsep b{font-family:var(--display); font-size:20px; line-height:1.15; text-wrap:balance}
.guide li.gpart{display:block; border-bottom:none; padding:16px 0 2px; font-size:12px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
/* ---------- Mobile app shell ---------- */
:root{--appw:480px; --frame:#E6EAF1}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --frame:#06080D } }
:root[data-theme="dark"]{ --frame:#06080D }
html,body{overscroll-behavior:none; -webkit-text-size-adjust:100%}
body{-webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.slide-b,.memo,.qtext,.verdict p,.credits p{-webkit-user-select:text; user-select:text}
button,[data-act]{touch-action:manipulation}
.shell{max-width:var(--appw); margin:0 auto; background:var(--bg); min-height:100vh; min-height:100dvh; position:relative}
.side{display:none !important}

@media (min-width:560px){

  .shell{box-shadow:0 0 0 1px var(--line), 0 30px 80px rgba(20,24,34,.16)}

}
@media (hover:none){
  .btn:hover{filter:none}
  .stat:hover,.lesson-btn:hover{background:none}
}
.scr-in{animation:scrIn .3s cubic-bezier(.2,1,.3,1)}
@keyframes scrIn{from{transform:translateX(34px); opacity:.35}}
.pg-in{animation:pgIn .26s ease-out}
@keyframes pgIn{from{transform:translateY(10px); opacity:.3}}
.footl{display:flex; align-items:center; gap:10px}

  for(var i=0;i<PATHS[ui].length;i++){ var it=PATHS[ui][i]; if(it.kind==='chest' && chestState(it)==='ready') return it; if(it.kind==='lesson' && it.g===cur) return it; }
  return null;
}
function nodeIdAfter(g){
  var o=ORDER[g], p=PATHS[o.ui];
  for(var i=0;i<p.length;i++){ if(p[i].kind==='lesson' && p[i].g===g){ var nx=p[i+1]; if(nx && nx.kind==='part') nx=p[i+2]; if(!nx) return null; return nx.kind==='chest' ? 'chest-'+nx.id : 'node-'+nx.g; } }
  return null;
}

var R = {screen:null, tab:'learn', pop:null, modal:null, lesson:null, after:null, chest:null, q:[], timers:[], justDone:null, goalFrom:null, bump:null};

function later(ms, fn){ R.timers.push(setTimeout(fn, ms)); }
function clearTimers(){ R.timers.forEach(clearTimeout); R.timers=[]; }
function go(screen){
  clearTimers();
  document.querySelectorAll('.crash-layer,.combo-pop,.judge,.gelfly,.upbanner').forEach(function(e){ e.remove(); });
  R.screen=screen; R.modal=null; render();

}
function render(){
  tickLives();

  else if(R.screen==='onboard2') h=vOnboard2();
  else if(R.screen==='lesson') h=vLesson();
  else if(R.screen==='end') h=vEnd();
  else if(R.screen==='chest') h=vChest();
  else if(R.screen==='streak') h=vStreak();

}

/* ================= Lesson engine ================= */
/* Combo tiers drive the whole feel: green (0-2), orange "en feu" (3-4), electric blue (5+). */
function tierOf(c){ return c>=5 ? 2 : (c>=3 ? 1 : 0); }
var TIER_COL=['#3DBA4E','#FF7A1F','#1E9BFF'];
var JUDGE=['BIEN','SUPER','EXCELLENT','PARFAIT','INCROYABLE','LÉGENDAIRE'];
function startLesson(idx, practice){
  var o = ORDER[idx];
  var steps;
  if(practice){
    var pool=[]; ORDER.forEach(function(x){ if(S.done[x.l.id]) x.l.questions.forEach(function(q){ pool.push({kind:'q', q:q, ui:x.ui}); }); });
    if(!pool.length) o.l.questions.forEach(function(q){ pool.push({kind:'q', q:q, ui:o.ui}); });
    steps = shuffle(pool).slice(0,4);
  } else {
    var qs=o.l.questions;
    steps = (o.l.slides||[]).map(function(_,k){ return {kind:'slide', k:k}; }).concat([{kind:'intro'}, {kind:'q', q:qs[0]}, {kind:'q', q:qs[1]}, {kind:'pairs'}]).concat(qs.slice(2).map(function(q){ return {kind:'q', q:q}; }));
  }
  R.lesson = {idx:idx, o:o, practice:!!practice, steps:steps, base:steps.length, i:0, ok:0, answered:0, correct:0, mistakes:0, t0:Date.now(), phase:'idle', sel:null, order:null, pairs:null, replay:!!S.done[o.l.id], combo:0, maxCombo:0, prevPct:0};
  prepStep();
  steps.forEach(function(st2){ if(st2.q && st2.q.type==='pointe') V3.prefetch(st2.q.model); });
  R.pop=null; SFX.whoosh(); go('lesson');
}
function prepStep(){
  var L=R.lesson, s=L.steps[L.i];
  L.phase = (s.kind==='intro' || s.kind==='slide') ? 'ready' : 'idle'; L.sel=null; L.order=null; L.pairs=null;
  L.enter=true; L.justChecked=false; L.comboLost=0;
  if(s.kind==='q' && (s.q.type==='qcm' || s.q.type==='trou')) L.order = shuffle(s.q.choices.map(function(_,i){return i;}));
  if(s.kind==='pairs'){
    var P=L.o.l.paires.map(function(p,i){ return {i:i, a:p[0], b:p[1]}; });
    L.pairs={left:shuffle(P), right:shuffle(P), selL:null, selR:null, matched:{}, bad:null, flash:null};
  }
}
function pct(L){ return Math.min(100, (L.ok/L.base)*100); }
function vLesson(){
  var L=R.lesson, s=L.steps[L.i], ui = s.ui!=null ? s.ui : L.o.ui;

    '<div class="lhead"><button class="xbtn" data-act="quit" aria-label="Quitter la leçon">'+I.x+'</button>'+

      '<span class="combo t'+t+(L.bumpCombo?' bump':'')+'"'+(L.combo<2?' hidden':'')+' aria-label="Combo '+L.combo+'">'+BOLT+'×'+L.combo+'</span>'+

function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }

function vQuestion(L, s){

    return '<button class="'+cls(ci===q.answer,i)+'" data-act="sel" data-v="'+i+'"'+(checked?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(q.choices[ci])+'</span></button>';

function vPairs(L){

function vLessonFoot(L, s){

/* Judgement words, rhythm-game style */
function judgePos(){ var b=document.getElementById('lbar'), r=b && b.getBoundingClientRect(); return r ? {x:r.left+r.width/2, y:r.bottom+40} : {x:innerWidth/2, y:96}; }
function judge(c, pos){

}
function judgeMiss(pos){

function barFx(c){

function heartHit(){

  lp.classList.add('hit');
  var m=document.createElement('span'); m.className='minus'; m.textContent='−1'; lp.appendChild(m);
  var c=center(lp); if(c) fxSparks(c.x,c.y,10,['#FF4760','#FF9DB0'],{speed:3.5,life:500});
  later(110, SFX.crack);
}
function doCheck(forceWrong){
  var L=R.lesson, s=L.steps[L.i], q=s.q;
  if(s.kind!=='q' || (L.sel==null && !forceWrong)) return;
  var right = forceWrong ? false : (q.type==='pointe' ? isTarget(q,L.sel) : q.type==='vf' ? (L.sel===0)===q.answer : L.order[L.sel]===q.answer);
  L.answered++; L.justChecked=true;
  if(q.id){ if(right){ if(S.wrong[q.id]) delete S.wrong[q.id]; } else { S.wrong[q.id]=(S.wrong[q.id]||0)+1; } save(); }
  if(right){
    L.correct++; L.ok++; L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.bumpCombo=true;
    L.phase='good'; L.head=pick(PRAISE);

      var p=center(document.querySelector('.opt.good')||document.querySelector('.v3mount,.schemabox'));
      if(p){ fxSparks(p.x,p.y,18,goodColors(),{speed:6,life:650,star:true}); fxRing(p.x,p.y,TIER_COL[tierOf(c)],Math.min(170,Math.max(p.w,p.h)*.7),{w:6,life:450}); }

function doContinue(){
  var L=R.lesson, s=L.steps[L.i];
  if(s.kind==='intro' || s.kind==='slide'){ L.ok++; }
  if(!L.practice && S.lives<=0 && L.phase==='bad'){ R.modal={type:'nolives-lesson'}; render(); return; }
  L.i++;
  if(L.i>=L.steps.length){ finishLesson(); return; }
  prepStep(); render();
}
function onPair(side, i){
  var L=R.lesson, P=L.pairs; if(P.matched[i] || L.phase==='good') return;
  P.bad=null;
  if(side==='L') P.selL=(P.selL===i?null:i); else P.selR=(P.selR===i?null:i);
  if(P.selL!=null && P.selR!=null){
    if(P.selL===P.selR){
      var mi=P.selL;
      P.matched[mi]=true; P.flash=mi; P.selL=P.selR=null;
      L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo); L.bumpCombo=true;
      L.ok+=1/P.left.length;
      var c=L.combo, done=Object.keys(P.matched).length===P.left.length;
      SFX.good(c); buzz(12);
      after(function(){
        var a=center(document.querySelector('[data-side="L"][data-v="'+mi+'"]')), b=center(document.querySelector('[data-side="R"][data-v="'+mi+'"]'));
        if(a && b){
          fxBoltBetween(a,b,{life:380,w:3.5,color:TIER_COL[tierOf(c)]});
          fxSparks(a.x,a.y,8,goodColors(),{speed:3.5,life:450}); fxSparks(b.x,b.y,8,goodColors(),{speed:3.5,life:450});
          judge(c,{x:(a.x+b.x)/2, y:Math.min(a.y,b.y)-18});
        }
        barFx(c);
        if(isMilestone(c)) later(220, function(){ comboBurst(c); });
      });
      setTimeout(function(){ if(R.lesson===L && R.screen==='lesson' && P===L.pairs && P.flash===mi){ P.flash=null; render(); } }, 460);

    } else {
      P.bad=['L'+P.selL,'R'+P.selR]; P.selL=P.selR=null;
      L.combo=0; SFX.miss(); buzz(40);
      after(function(){ var bt=center(document.querySelector('.ptile.bad')); judgeMiss(bt?{x:innerWidth/2, y:bt.y-30}:null); });
    }

  render();
}
function finishLesson(){
  var L=R.lesson, t=today(), boost=boostActive();
  var before=xpToday();
  R.goalFrom=Math.min(1, before/S.goal);
  var xp = ((L.practice || L.replay) ? 5 : 10 + (L.mistakes===0 ? 5 : 0)) * (boost ? 2 : 1);
  S.xp+=xp; S.xpByDay[t]=before+xp;
  var gel=gelForXp(xp), goalBonus=(before<S.goal && before+xp>=S.goal) ? GOAL_BONUS : 0;
  S.gel+=gel+goalBonus;
  var wasDone=!!S.done[L.o.l.id];
  if(!L.practice) S.done[L.o.l.id]=true;
  R.justDone = (!L.practice && !wasDone) ? L.idx : null;
  var streakUp=false, relaunch=false, gotDefib=false;
  if(S.lastDay!==t){
    var gap = S.lastDay ? daysBetween(S.lastDay,t) : 99;
    relaunch = S.streak===0 && S.lostStreak>0;
    S.streak = (gap===1 && S.streak>0) ? S.streak+1 : 1;
    S.lastDay=t; if(S.days.indexOf(t)<0) S.days.push(t);
    if(S.streak>S.best) S.best=S.streak;
    if(S.streak%7===0 && S.defib<2){ S.defib++; gotDefib=true; }
    if(relaunch) S.lostStreak=0;
    streakUp=true;
  }
  var heartBack=false;
  if(L.practice && S.lives<MAXL){ S.lives++; if(S.lives>=MAXL) S.livesTs=now(); heartBack=true; }

function confetti(){
  if(RM) return;
  var c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  var ctx=c.getContext('2d'), W=c.width=innerWidth, H=c.height=innerHeight;
  var cols=['#14B89C','#8A63F2','#FF8A34','#2F8CFF','#F2549B','#FFC22E','#FF4760'];
  var P=[]; for(var i=0;i<130;i++) P.push({x:W/2+(Math.random()-.5)*80, y:H*0.35, vx:(Math.random()-.5)*15, vy:-Math.random()*15-4, r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.4, c:cols[i%cols.length], s:Math.random()<.5});
  var t0=performance.now();
  (function f(t){
    var dt=Math.min(32,t-(f.l||t))/16; f.l=t; ctx.clearRect(0,0,W,H);
    P.forEach(function(p){ p.vy+=0.45*dt; p.vx*=0.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=p.va*dt;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
      if(p.s){ ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); } else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,6.3); ctx.fill(); }
      ctx.restore(); });
    if(t-t0<2800) requestAnimationFrame(f); else c.remove();
  })(t0);
}

function uniqueParts(model){
  var seen={}, out=[];
  (PARTS[model]||[]).forEach(function(p){ if(!seen[p[1]]){ seen[p[1]]=1; out.push(p); } });
  return out;
}
function lessonModel(l){
  var q=(l.questions||[]).filter(function(x){ return x.type==='pointe'; })[0];
  return q ? q.model : null;
}
function vLabo(){
  var keys=Object.keys(MODELS).filter(function(k){ return !MODELS[k].hidden; });
  var cards=keys.map(function(k){
    var m=MODELS[k], tag = m.type==='svg' ? 'Schéma' : (m.type==='mol' ? 'Molécule 3D' : '3D');
    return '<div class="lab-card" style="--uc:'+uc(m.ui)+'"><button class="lab-open" data-act="labo-open" data-v="'+k+'" aria-label="Explorer '+esc(m.titre)+'">'+
      '<span class="lab-ico">'+LABICO[k]+'</span><span class="lab-tag">'+tag+'</span><b>'+esc(m.titre)+'</b><span class="lab-desc">'+esc(m.desc)+'</span></button>'+
      '<button class="btn small lab-quiz" data-act="labo-quiz" data-v="'+k+'">Défi</button></div>';
  }).join('');
  return '<h1 class="h-page">Labo 3D</h1>'+
    '<div class="coach"><button class="poke" data-act="poke" aria-label="Boum">'+boum({size:80, mood:'wow'})+'</button><div class="bubble" id="coachb">Fais tourner, zoome, touche. Chaque défi te fait retrouver jusqu\'à 5 structures, sans perdre de cœur.</div></div>'+
    '<div class="lab-grid">'+cards+'</div>'+
    '<div class="section-t">Crédits</div>'+
    '<div class="card credits"><p>'+esc(CREDITS.mesh)+' Les reins, sous licence non commerciale, ont été retirés.</p><p>ADN : PDB 1BNA. Hémoglobine : PDB 2HHB (RCSB Protein Data Bank).</p><p>Moteur 3D : three.js (licence MIT). Chaque modèle ne se télécharge que quand tu l\'ouvres.</p></div>';
}
function vLaboModal(m){
  var md=MODELS[m.model], st3={sel:m.sel, good:[], bad:null, tip:!m.tipDone};
  m.tipDone=true;
  var chips=uniqueParts(m.model).map(function(p){ return '<button class="lchip'+(m.sel && partName(m.model,m.sel)===p[1]?' on':'')+'" data-act="labo-part" data-v="'+p[0]+'">'+esc(p[1])+'</button>'; }).join('');
  var hint = md.type==='svg' ? 'Touche une zone du schéma' : 'Touche une structure pour voir son nom';
  return '<div class="scrim full"><div class="labo" role="dialog" aria-modal="true" aria-label="'+esc(md.titre)+'" style="--c0:'+uc(md.ui)+'">'+
    '<div class="labo-h"><button class="xbtn" data-act="m-close" aria-label="Fermer">'+I.x+'</button><b>'+esc(md.titre)+'</b><button class="btn small" data-act="labo-quiz" data-v="'+m.model+'">Défi</button></div>'+
    viewerHTML(m.model,'explore',st3,'labo-'+m.model)+
    '<div class="labo-name">'+(m.sel ? '<b>'+esc(partName(m.model,m.sel))+'</b>' : '<span>'+hint+'</span>')+'</div>'+
    '<div class="labo-chips">'+chips+'</div>'+
    (function(){ var flat=md.type==='cell' && !V3.isOK('cellule'); return '<p class="labo-credit">'+esc(CREDITS[flat?'svg':md.type])+(md.size && !flat?' · '+esc(md.size):'')+'</p>'; })()+
  '</div></div>';
}
function isTarget(q,k){
  return q.target.indexOf(k)>-1 || q.target.some(function(t){ return partName(q.model,t)===partName(q.model,k); });
}
function pickPart(k, model, cands){
  if(R.modal && R.modal.type==='labo'){ R.modal.sel=k; SFX.pop(); render(); return; }
  if(R.screen==='lesson' && R.lesson){
    var L=R.lesson, s=L.steps[L.i];
    if(s && s.kind==='q' && s.q.type==='pointe' && L.phase!=='good' && L.phase!=='bad'){
      var c=(cands||[k]).filter(function(x){ return isTarget(s.q,x); })[0];
      L.sel=c||k; SFX.tap(3); buzz(8); render();
    }
  }
}
function startCustom(title, ui, steps, extra){
  var o={l:{id:'custom', titre:title, slides:[], cours:[], paires:[], questions:[]}, u:{titre:title}, ui:ui, li:1};
  R.lesson={idx:-1, o:o, practice:true, custom:extra||{}, steps:steps, base:steps.length, i:0, ok:0, answered:0, correct:0, mistakes:0, t0:Date.now(), phase:'idle', sel:null, order:null, pairs:null, replay:true, combo:0, maxCombo:0, prevPct:0};
  prepStep(); R.pop=null; R.modal=null; SFX.whoosh(); go('lesson');
}
function startLabQuiz(model){
  var md=MODELS[model], by={};
  (PARTS[model]||[]).forEach(function(p){ if((md.noquiz||[]).indexOf(p[0])<0) (by[p[1]]=by[p[1]]||[]).push(p[0]); });
  var names=shuffle(Object.keys(by)).slice(0,5);
  var steps=names.map(function(n){ return {kind:'q', ui:md.ui, q:{type:'pointe', model:model, target:by[n], q:'Trouve : '+n+'.', explication:'Retiens où se trouve cette structure : '+n+'.'}}; });
  V3.prefetch(model);
  startCustom(md.titre, md.ui, steps, {labo:model});
}
function wrongCount(){ return Object.keys(S.wrong||{}).filter(function(id){ return QBYID[id]; }).length; }
function startReview(){
  var ids=shuffle(Object.keys(S.wrong||{}).filter(function(id){ return QBYID[id]; })).slice(0,6);
  if(!ids.length) return;
  var steps=ids.map(function(id){ var e=QBYID[id]; return {kind:'q', q:e.q, ui:e.ui}; });
  steps.forEach(function(s){ if(s.q.type==='pointe') V3.prefetch(s.q.model); });
  startCustom('Mes erreurs', steps[0].ui, steps, {review:true});
}
function skipPointe(){
  var L=R.lesson; if(!L) return;
  L.ok++; L.i++;
  if(L.i>=L.steps.length){ finishLesson(); return; }
  prepStep(); render();
}
function slideBack(){
  var L=R.lesson; if(!L || L.i<=0) return;
  var p=L.steps[L.i-1]; if(p.kind!=='slide' && p.kind!=='intro') return;
  L.i--; L.ok=Math.max(0,L.ok-1); prepStep(); SFX.pop(); render();
}
function bindSwipe(){
  if(R.screen!=='lesson' || !R.lesson || R.modal) return;
  var L=R.lesson, s=L.steps[L.i]; if(!s || (s.kind!=='slide' && s.kind!=='intro')) return;
  var el=document.querySelector('#app .screen .body'); if(!el) return;
  var x0=null, y0=0, t0=0;
  el.addEventListener('touchstart', function(e){ var t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(x0===null) return; var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Date.now()-t0>700 || Math.abs(dx)<60 || Math.abs(dy)>Math.abs(dx)*0.7) return;
    if(dx<0){ SFX.pop(); doContinue(); } else slideBack();
  }, {passive:true});
}

/* ================= Events ================= */
V3.onPick(function(k, model, cands){ pickPart(k, model, cands); });
document.addEventListener('pointerdown', function(){ ac(); }, true);
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]');
  if(!t){ if(R.pop!=null){ R.pop=null; render(); } return; }
  var a=t.getAttribute('data-act'), v=t.getAttribute('data-v');
  if(a==='scrim'){ if(e.target===t && R.modal && R.modal.type!=='nolives-lesson'){ R.modal=null; render(); } return; }
  ac();
  switch(a){
    case 'noop': break;
    case 'labo-open': R.modal={type:'labo', model:v, sel:null}; SFX.whoosh(); render(); break;
    case 'labo-part': if(R.modal && R.modal.type==='labo'){ R.modal.sel=v; SFX.pop(); render(); requestAnimationFrame(function(){ V3.focus(v); }); } break;
    case 'labo-quiz': startLabQuiz(v); break;
    case 'svgpart': pickPart(v); break;
    case 'v3reset': V3.reset(); SFX.pop(); break;
    case 'v3retry': V3.retry(v); render(); break;
    case 'v3skip': skipPointe(); break;
    case 'review': startReview(); break;
    case 'slide-back': slideBack(); break;
    case 'logo': splash(true); break;
    case 'poke': poke(t); break;
    case 'ob-next':
      var ob=center(document.getElementById('obboum'));
      SFX.zap(true); buzz(40);
      if(ob){ fxBolts(ob.x,ob.y,10,150,{inner:40,life:450}); fxRing(ob.x,ob.y,'#FF4760',140,{w:10}); fxSparks(ob.x,ob.y,24,['#FF4760','#FFC22E','#FF9DB0'],{speed:6,life:700,star:true}); }
      setTimeout(function(){ go('onboard2'); }, 320); break;
    case 'ob-goal': S.goal=+v; save(); SFX.tap(+t.getAttribute('data-i')); render(); break;
    case 'ob-done': S.onboarded=true; save(); startLesson(0); break;
    case 'tab': SFX.pop(); R.tab=v; R.pop=null; go('home'); break;
    case 'subj': S.subject=+v; save(); R.pop=null; SFX.tap(+v); render(); requestAnimationFrame(scrollToCurrent); break;
    case 'node': var idx=+v; R.pop = (R.pop===idx ? null : idx); SFX.pop(); render(); break;
    case 'chest':
      var it=findChest(v);
      if(it && chestState(it)==='ready'){ openChest(v); }
      else { R.pop = (R.pop===v ? null : v); SFX.pop(); render(); }
      break;
    case 'chest-done': R.tab = (R.chest && R.chest.demo) ? 'profile' : 'learn'; go('home'); break;
    case 'kit-tap': kitTap(); break;
    case 'd-chest': openChest(null, +v); break;
    case 'buy': buy(v, false); break;
    case 'buy-modal': buy(v, true); break;
    case 'start':
      if(S.lives<=0){ R.pop=null; R.modal={type:'nolives'}; render(); break; }
      startLesson(+v); break;
    case 'quit': R.modal={type:'quit'}; render(); break;
    case 'quit-yes': R.lesson=null; go('home'); break;
    case 'm-close': R.modal=null; render(); break;
    case 'sel':
      var L=R.lesson; if(L.phase==='good'||L.phase==='bad') break;
      L.sel=+v; SFX.tap(+v); render(); break;
    case 'check': doCheck(false); break;
    case 'skip': doCheck(true); break;
    case 'continue': doContinue(); break;
    case 'pair': onPair(t.getAttribute('data-side'), +v); break;
    case 'end-next':
      if(R.after && R.after.demo){ R.tab='profile'; go('home'); }
      else if(R.after && R.after.streakUp){ R._counted=false; go('streak'); }
      else go('home');
      break;
    case 'home': go('home'); break;
    case 'relaunch': if(S.lives<=0){ S.lives=MAXL; save(); } startLesson(anyCur()); break;
    case 'practice': R.modal=null; startLesson(anyCur(), true); break;
    case 'm-streak': R.modal={type:'streak'}; render(); break;
    case 'm-lives': R.modal={type:'lives'}; render(); break;
    case 'm-guide': R.modal={type:'guide', ui:+v}; render(); break;
    case 'sound': S.sound=!S.sound; save(); render(); if(S.sound) SFX.good(3); break;
    case 'goal': S.goal=+v; save(); render(); break;
    case 'd-next': S.dayOffset+=1; save(); onOpen(); break;
    case 'd-skip': S.dayOffset+=2; save(); onOpen(); break;
    case 'd-empty': S.lives=0; S.livesTs=now(); save(); render(); break;
    case 'd-gel': S.gel+=200; save(); R.bump={gel:true}; render(); SFX.coin(5); later(1200,function(){ R.bump=null; }); break;
    case 'd-unlock': ORDER.forEach(function(o){ S.done[o.l.id]=true; }); save(); render(); break;
    case 'd-skit': R.after={xp:15, gel:8, goalBonus:0, acc:100, secs:74, maxCombo:6, practice:false, streakUp:false, demo:true, entrance:v}; go('end'); break;
    case 'd-reset': R.modal={type:'reset'}; render(); break;
    case 'd-reset-yes': S=fresh(); save(); R.tab='learn'; go('onboard1'); splash(false); break;
  }
});
document.addEventListener('keydown', function(e){
  if(R.modal){ if(e.key==='Escape' && R.modal.type!=='nolives-lesson'){ R.modal=null; render(); } return; }
  if(R.screen!=='lesson') { if(e.key==='Enter'){ var p=document.getElementById('primary'); if(p && !p.disabled){ e.preventDefault(); p.click(); } } return; }
  var L=R.lesson, s=L.steps[L.i];
  if(s.kind==='q' && L.phase!=='good' && L.phase!=='bad'){
    var n=parseInt(e.key,10), max = s.q.type==='pointe' ? 0 : (s.q.type==='vf'?2:s.q.choices.length);
    if(n>=1 && n<=max){ ac(); L.sel=n-1; SFX.tap(n-1); render(); return; }
  }
  if(e.key==='Enter'){ var b=document.getElementById('primary'); if(b && !b.disabled){ e.preventDefault(); ac(); b.click(); } }
});

function onOpen(){
  tickLives();
  R._defibFx=false;
  if(!S.onboarded){ go('onboard1'); return; }
  var ev=checkStreak();
  if(ev && ev.type==='arrest'){ SFX.flat(); go('arrest'); return; }
  if(ev && ev.type==='defib'){ R.defibUsed=ev.used; go('defib'); return; }
  go('home');
}
try{ if(document.fonts) document.fonts.load('700 44px Caveat'); }catch(e){}
setInterval(function(){ var before=S.lives; tickLives(); if(S.lives!==before && R.screen==='home' && !R.modal) render(); }, 30000);
onOpen();
splash(false);
})();
</script>
