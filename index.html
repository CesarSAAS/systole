.wstage .boum{position:relative}
.wtry{position:absolute; top:10px; right:12px; font-size:11px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; padding:4px 10px; border-radius:99px; background:var(--soft); color:var(--muted)}
.winfo{flex:none; display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:12px; row-gap:3px; align-items:center; align-content:center; padding:10px 16px 12px; border-top:2px solid var(--line); min-height:108px}
.wi-h{grid-column:1; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.wname{grid-column:1; font-family:var(--display); font-size:20px; line-height:1.15}
.wdesc{grid-column:1; font-size:14px; color:var(--muted); font-weight:700; line-height:1.35}
.wbtn{grid-column:2; grid-row:1 / 4; display:grid; justify-items:center; gap:4px}
.wbtn .btn{width:auto; min-width:104px}
.wbtn .btn svg{width:22px; height:22px}
.wlack{font-size:12px; font-weight:800; color:var(--muted); white-space:nowrap}

: "Quelle technique compte et trie des milliers de cellules par seconde ?", "choices": ["La cytométrie en flux", "La microscopie électronique", "La centrifugation", "Le caryotype"], "answer": 0, "explication": "Les cellules défilent une par une devant un laser. C'est utilisé tous les jours en hématologie."}]}, {"id": "cellule-3", "titre": "La membrane plasmique", "niveau": "pont", "objectif": "Décrire la bicouche lipidique et savoir ce qui la traverse.", "sources": {"sorbonne": "UE2 BioCell · Membranes", "saclay": "Biologie · Membranes cellulaires, membrane plasmique"}, "questions": [{"type": "qcm", "q": "De quoi est principalement faite la membrane plasmique ?", "choices": ["Une bicouche de phospholipides avec des protéines", "Une paroi de cellulose", "Une double couche de protéines", "De l'ADN et des glucides"], "answer": 0, "explication": "C'est le modèle de la mosaïque fluide : têtes hydrophiles vers l'eau, queues hydrophobes au centre, protéines insérées dedans."}, {"type": "vf", "q": "Les petites molécules non chargées comme le dioxygène traversent librement la bicouche lipidique.", "answer": true, "explication": "C'est la diffusion simple. Les ions et les grosses molécules polaires ont besoin de protéines de transport."}, {"type": "qcm", "q": "La pompe Na⁺/K⁺ :", "choices": ["Consomme de l'ATP pour transporter des ions contre leur gradient", "Laisse passer l'eau librement", "Fonctionne sans énergie", "Transporte le glucose par diffusion simple"], "answer": 0, "explication": "Elle fait sortir 3 Na⁺ et entrer 2 K⁺ à chaque cycle, en utilisant un ATP."}, {"type": "trou", "q": "Le passage d'une molécule contre son gradient de concentration s'appelle le transport ___.", "choices": ["actif", "passif", "simple", "facilité"], "answer": 0, "explication": "Actif, car il consomme de l'énergie, le plus souvent de l'ATP."}], "cours": ["La membrane est une bicouche de phospholipides, avec des protéines insérées dedans.", "La tête d'un phospholipide aime l'eau, sa queue la fuit.", "O₂ et CO₂ passent seuls. Les ions et le glucose passent par des protéines de transport."], "paires": [["Tête", "Hydrophile"], ["Queue", "Hydrophobe"], ["Canal ionique", "Laisse passer les ions"], ["O₂", "Diffusion simple"]], "slides": [{"t": "Une bicouche fluide", "p": ["La membrane est faite de **phospholipides** : une tête **hydrophile** et deux queues **hydrophobes**.", "Dans l'eau, ils s'assemblent spontanément en **bicouche** : têtes vers l'extérieur, queues au centre.", "Des **protéines** y sont insérées, et du **cholestérol** règle sa fluidité. C'est le modèle de la **mosaïque fluide**."]}, {"t": "Qui passe, et comment ?", "p": ["Les petites molécules non chargées (O₂, CO₂) traversent par **diffusion simple**, du plus concentré vers le moins concentré.", "Les ions et les grosses molécules polaires (glucose) passent par des **canaux** ou des **transporteurs** : c'est la **diffusion facilitée**.", "Pour aller **contre** le gradient, il faut de l'énergie : c'est le **transport actif**, comme la **pompe Na⁺/K⁺** qui consomme de l'ATP."]}]}, {"id": "cellule-protmb", "titre": "Les protéines de la membrane", "niveau": "pont", "objectif": "Connaître les protéines membranaires et leurs rôles.", "sources": {"sorbonne": "UE2 BioCell · Membranes", "saclay": "Biologie · Membranes cellulaires, membrane plasmique"}, "slides": [{"t": "Deux façons d'être dans la membrane", "p": ["Les **protéines intrinsèques** (ou intégrales) traversent la bicouche, souvent grâce à des hélices α hydrophobes.", "Les **protéines extrinsèques** (ou périphériques) sont simplement posées sur une face de la membrane.", "Les protéines représentent environ **la moitié de la masse** de la membrane plasmique."]}, {"t": "Des rôles variés", "p": ["**Transport** : canaux et transporteurs laissent passer ions et molécules.", "**Réception** : les **récepteurs** captent des signaux, comme les hormones. **Adhérence** : d'autres protéines accrochent la cellule à ses voisines.", "Côté extérieur, des sucres attachés aux protéines et aux lipides forment le **glycocalyx**. Il sert de « carte d'identité » : les **groupes sanguins** A, B et O en dépendent."]}], "cours": ["Les protéines intrinsèques traversent la membrane, les extrinsèques sont posées dessus.", "Elles transportent, reçoivent des signaux et accrochent les cellules entre elles.", "Le glycocalyx, fait de sucres, sert de carte d'identité (groupes sanguins)."], "paires": [["Intrinsèque", "Traverse la membrane"], ["Extrinsèque", "Posée sur une face"], ["Récepteur", "Capte un signal"], ["Glycocalyx", "Sucres de surface"]], "questions": [{"type": "qcm", "q": "Une protéine qui traverse toute l'épaisseur de la membrane est dite :", "choices": ["Intrinsèque", "Extrinsèque", "Cytosolique", "Nucléaire"], "answer": 0, "explication": "Elle a des régions hydrophobes qui baignent dans le cœur de la bicouche."}, {"type": "trou", "q": "Le manteau de sucres à la surface externe de la cellule s'appelle le ___.", "choices": ["glycocalyx", "cytosquelette", "nucléoïde", "glycogène"], "answer": 0, "explication": "Il intervient dans la reconnaissance entre cellules."}, {"type": "vf", "q": "Les groupes sanguins A, B et O dépendent de sucres situés à la surface des globules rouges.", "answer": true, "explication": "Ils diffèrent par le dernier sucre de la chaîne. C'est pour ça qu'une transfusion doit être compatible."}, {"type": "qcm", "q": "Quel est le rôle d'un récepteur membranaire ?", "choices": ["Capter un signal venu de l'extérieur", "Fabriquer de l'ATP", "Stocker l'ADN", "Digérer les déchets"], "answer": 0, "explication": "Il transmet ensuite le message à l'intérieur de la cellule."}]}, {"id": "cellule-transports", "titre": "Les transports membranaires", "niveau": "pont", "objectif": "Distinguer canaux, transporteurs et pompes.", "sources": {"sorbonne": "UE2 BioCell · Membranes", "saclay": "Biologie · Membranes cellulaires, membrane plasmique"}, "slides": [{"t": "Canaux et transporteurs", "p": ["Un **canal** forme un pore : les ions passent très vite, dans le sens de leur gradient. Les **aquaporines** sont des canaux à eau.", "Un **transporteur** fixe la molécule, change de forme et la relâche de l'autre côté. C'est plus lent.", "Exemple : **GLUT** fait entrer le glucose par **diffusion facilitée**, sans dépenser d'énergie."]}, {"t": "Les transports actifs", "p": ["Le **transport actif primaire** utilise directement l'ATP. Exemple : la **pompe Na⁺/K⁺**, qui fait sortir 3 Na⁺ et entrer 2 K⁺.", "Le **transport actif secondaire** utilise le gradient créé par une pompe. Exemple : le **SGLT** fait entrer glucose et Na⁺ ensemble dans les cellules de l'intestin.", "**Uniport** : une seule molécule. **Symport** : deux dans le même sens. **Antiport** : deux en sens opposés."]}], "cours": ["Un canal laisse passer vite, dans le sens du gradient. Un transporteur change de forme.", "Actif primaire : utilise l'ATP (pompe Na⁺/K⁺). Actif secondaire : utilise un gradient (SGLT).", "Uniport, symport (même sens), antiport (sens opposés)."], "paires": [["Aquaporine", "Canal à eau"], ["GLUT", "Diffusion facilitée du glucose"], ["Symport", "Deux dans le même sens"], ["Antiport", "Deux en sens opposés"]], "questions": [{"type": "qcm", "q": "Le SGLT fait entrer du glucose avec du Na⁺ dans les cellules de l'intestin. C'est :", "choices": ["Un transport actif secondaire", "Une diffusion simple", "Un transport actif primaire", "Une endocytose"], "answer": 0, "explication": "Il utilise le gradient de Na⁺ créé par la pompe Na⁺/K⁺, sans consommer lui-même d'ATP."}, {"type": "trou", "q": "Un transporteur qui déplace deux molécules en sens opposés est un ___.", "choices": ["antiport", "symport", "uniport", "canal"], "answer": 0, "explication": "La pompe Na⁺/K⁺ en est un exemple : le Na⁺ sort, le K⁺ entre."}, {"type": "vf", "q": "Les aquaporines sont des canaux qui laissent passer l'eau.", "answer": true, "explication": "Leur découverte a valu le prix Nobel de chimie 2003 à Peter Agre."}, {"type": "qcm", "q": "Qu'est-ce qui distingue un canal d'un transporteur ?", "choices": ["Le canal forme un pore et laisse passer très vite", "Le canal consomme toujours de l'ATP", "Le canal ne transporte que du glucose", "Il n'y a aucune différence"], "answer": 0, "explication": "Un transporteur doit changer de forme pour chaque molécule, ce qui le rend plus lent."}]}, {"id": "cellule-endo", "titre": "Endocytose et exocytose", "niveau": "pont", "objectif": "Comprendre comment la cellule fait entrer et sortir de gros éléments.", "sources": {"sorbonne": "UE2 BioCell · Systèmes endomembranaires", "saclay": "Biologie · Système endomembranaire de la cellule"}, "slides": [{"t": "Faire entrer : l'endocytose", "p": ["La membrane se creuse, entoure l'élément et forme une **vésicule** à l'intérieur de la cellule.", "**Phagocytose** : la cellule avale de grosses particules, comme une bactérie. C'est la spécialité des **macrophages**.", "**Endocytose par récepteur** : la cellule capte une molécule précise grâce à des récepteurs regroupés dans des puits recouverts de **clathrine**. Exemple : le **cholestérol LDL**."]}, {"t": "Faire sortir : l'exocytose", "p": ["Une vésicule fusionne avec la membrane et libère son contenu à l'extérieur.", "L'exocytose **constitutive** est permanente, par exemple pour renouveler la membrane. L'exocytose **régulée** attend un signal.", "Exemples d'exocytose régulée : les **neurotransmetteurs** au niveau des synapses, l'**insuline** après un repas."]}], "cours": ["Endocytose : la membrane se creuse et forme une vésicule qui entre.", "Phagocytose : grosses particules (macrophages). Endocytose par récepteur : molécules précises (LDL, clathrine).", "Exocytose : une vésicule fusionne avec la membrane. Elle peut être régulée (neurotransmetteurs, insuline)."], "paires": [["Phagocytose", "Avaler une bactérie"], ["Clathrine", "Tapisse les puits d'endocytose"], ["LDL", "Cholestérol capté par récepteur"], ["Exocytose régulée", "Attend un signal"]], "questions": [{"type": "qcm", "q": "Un macrophage qui avale une bactérie réalise :", "choices": ["Une phagocytose", "Une exocytose", "Une mitose", "Une diffusion simple"], "answer": 0, "explication": "Phago- : manger. La bactérie est ensuite digérée par les lysosomes."}, {"type": "trou", "q": "Les puits d'endocytose par récepteur sont tapissés d'une protéine appelée ___.", "choices": ["clathrine", "kératine", "actine", "insuline"], "answer": 0, "explication": "Elle forme un réseau en forme de cage autour de la vésicule."}, {"type": "vf", "q": "La libération des neurotransmetteurs dans une synapse est une exocytose.", "answer": true, "explication": "Les vésicules fusionnent avec la membrane quand le message nerveux arrive."}, {"type": "qcm", "q": "Comment les cellules captent-elles le cholestérol LDL du sang ?", "choices": ["Par endocytose, grâce à des récepteurs", "Par diffusion simple", "Par la pompe Na⁺/K⁺", "Par phagocytose"], "answer": 0, "explication": "Un défaut de ces récepteurs cause l'hypercholestérolémie familiale."}]}, {"id": "cellule-4", "titre": "Les organites", "niveau": "pont", "objectif": "Associer chaque organite à son rôle.", "sources": {"sorbonne": "UE2 BioCell · Systèmes endomembranaires", "saclay": "Biologie · Système endomembranaire, Mitochondries, Peroxysomes"}, "questions": [{"type": "qcm", "q": "Quel organite produit l'essentiel de l'ATP de la cellule ?", "choices": ["La mitochondrie", "L'appareil de Golgi", "Le lysosome", "Le réticulum endoplasmique lisse"], "answer": 0, "explication": "La mitochondrie est le siège de la respiration cellulaire. Elle possède même son propre ADN."}, {"type": "qcm", "q": "Quel trajet suit une protéine destinée à être sécrétée hors de la cellule ?", "choices": ["RE rugueux → appareil de Golgi → vésicule → membrane plasmique", "Appareil de Golgi → RE rugueux → noyau → membrane", "Noyau → lysosome → Golgi → membrane", "Mitochondrie → RE → membrane"], "answer": 0, "explication": "Elle est fabriquée par les ribosomes du RE rugueux, modifiée dans le Golgi, puis libérée par exocytose."}, {"type": "vf", "q": "L'ADN mitochondrial est transmis par la mère.", "answer": true, "explication": "Les mitochondries du spermatozoïde sont éliminées après la fécondation : on hérite de celles de l'ovocyte."}, {"type": "trou", "q": "La libération d'une protéine hors de la cellule par fusion d'une vésicule s'appelle l'___.", "choices": ["exocytose", "endocytose", "apoptose", "osmose"], "answer": 0, "explication": "Exo- : vers l'extérieur. L'endocytose fait l'inverse : elle fait entrer des éléments."}, {"type": "pointe", "model": "cellule", "target": ["golgi"], "q": "Touche l'appareil de Golgi.", "explication": "C'est la pile de saccules aplatis et courbés, entourée de petites vésicules."}], "cours": ["La mitochondrie produit l'ATP, l'énergie de la cellule.", "Le RE rugueux fabrique les protéines, l'appareil de Golgi les trie et les emballe.", "Le lysosome digère les déchets de la cellule."], "paires": [["Mitochondrie", "Produit l'ATP"], ["Lysosome", "Digère les déchets"], ["Appareil de Golgi", "Trie et emballe"], ["Ribosome", "Fabrique les protéines"]], "slides": [{"t": "La chaîne de production", "p": ["Les **ribosomes** fabriquent les protéines. Ceux fixés sur le **réticulum endoplasmique rugueux** fabriquent les protéines destinées à la membrane ou à l'exportation.", "L'**appareil de Golgi** modifie ces protéines (ajout de sucres), les trie et les emballe dans des **vésicules**.", "Les vésicules fusionnent avec la membrane : c'est l'**exocytose**."]}, {"t": "Énergie et recyclage", "p": ["La **mitochondrie**, avec sa double membrane, produit l'essentiel de l'**ATP**. Elle a son propre ADN, hérité de la mère.", "Le **lysosome** contient des enzymes qui digèrent les déchets, à pH acide (environ 5).", "Le **peroxysome** détruit des molécules toxiques comme le peroxyde d'hydrogène (H₂O₂) et dégrade certains acides gras."]}]}, {"id": "cellule-re", "titre": "Le réticulum endoplasmique", "niveau": "fac", "objectif": "Distinguer le RE rugueux et le RE lisse.", "sources": {"sorbonne": "UE2 BioCell · Systèmes endomembranaires", "saclay": "Biologie · Système endomembranaire de la cellule"}, "slides": [{"t": "Le RE rugueux", "p": ["C'est un réseau de sacs aplatis, en continuité avec l'**enveloppe du noyau**, couvert de **ribosomes**.", "Une protéine destinée à sortir commence par un **peptide signal**. Il est reconnu par la **SRP**, qui amène le ribosome sur le RE.", "La protéine entre dans le RE pendant sa fabrication. Elle s'y replie et reçoit ses premiers sucres (**N-glycosylation**)."]}, {"t": "Le RE lisse", "p": ["Il n'a pas de ribosomes. Il fabrique des **lipides** : phospholipides des membranes, hormones stéroïdes.", "Dans le foie, il **détoxifie** des médicaments et des toxiques.", "Il **stocke le calcium**. Dans le muscle, il s'appelle le **réticulum sarcoplasmique** et libère le Ca²⁺ qui déclenche la contraction."]}], "cours": ["Le RE rugueux porte des ribosomes et fabrique les protéines destinées à sortir.", "Le peptide signal et la SRP guident le ribosome vers le RE.", "Le RE lisse fabrique des lipides, détoxifie et stocke le calcium (réticulum sarcoplasmique du muscle)."], "paires": [["Peptide signal", "Adresse vers le RE"], ["SRP", "Amène le ribosome au RE"], ["RE lisse", "Lipides et détoxification"], ["Réticulum sarcoplasmique", "Réserve de calcium du muscle"]], "questions": [{"type": "qcm", "q": "Quel organite fabrique les hormones stéroïdes ?", "choices": ["Le RE lisse", "Le RE rugueux", "Le lysosome", "Le noyau"], "answer": 0, "explication": "Il est très développé dans les cellules des glandes surrénales et des gonades."}, {"type": "trou", "q": "La séquence qui dirige une protéine vers le réticulum s'appelle le peptide ___.", "choices": ["signal", "actif", "nucléaire", "final"], "answer": 0, "explication": "Il est reconnu par la SRP, puis généralement coupé une fois la protéine entrée."}, {"type": "vf", "q": "Dans le muscle, le réticulum libère du calcium qui déclenche la contraction.", "answer": true, "explication": "Il porte alors le nom de réticulum sarcoplasmique."}, {"type": "qcm", "q": "Le RE rugueux est en continuité avec :", "choices": ["L'enveloppe nucléaire", "La membrane plasmique", "La mitochondrie", "Le cytosquelette"], "answer": 0, "explication": "La membrane externe du noyau porte d'ailleurs elle aussi des ribosomes."}, {"type": "pointe", "model": "cellule", "target": ["rer"], "q": "Touche le réticulum endoplasmique rugueux.", "explication": "Ce sont les feuillets qui entourent le noyau, couverts de petits points : les ribosomes."}]}, {"id": "cellule-golgi", "titre": "Le Golgi et le tri des protéines", "niveau": "fac", "objectif": "Suivre une protéine du Golgi jusqu'à sa destination.", "sources": {"sorbonne": "UE2 BioCell · Systèmes endomembranaires", "saclay": "Biologie · Système endomembranaire de la cellule"}, "slides": [{"t": "Une usine orientée", "p": ["L'appareil de Golgi est un empilement de **saccules**. Il a une face d'entrée (**cis**), tournée vers le RE, et une face de sortie (**trans**).", "Les protéines arrivent du RE dans des **vésicules**, traversent le Golgi et y sont modifiées, surtout par l'ajout de **sucres** (glycosylation).", "Les cellules qui sécrètent beaucoup, comme celles du pancréas, ont un Golgi très développé."]}, {"t": "Le centre de tri", "p": ["À la sortie, chaque protéine est envoyée vers sa destination selon une « étiquette ».", "Les enzymes destinées aux **lysosomes** reçoivent une étiquette **mannose-6-phosphate**.", "Les autres partent vers la **membrane plasmique** ou vers des **vésicules de sécrétion**. Un défaut d'étiquetage provoque des maladies graves, comme la **mucolipidose de type II**."]}], "cours": ["Le Golgi a une face cis (entrée, côté RE) et une face trans (sortie).", "Il modifie les protéines, surtout en leur ajoutant des sucres.", "Il les trie : le mannose-6-phosphate envoie les enzymes vers les lysosomes."], "paires": [["Face cis", "Entrée du Golgi"], ["Face trans", "Sortie du Golgi"], ["Mannose-6-phosphate", "Étiquette vers le lysosome"], ["Glycosylation", "Ajout de sucres"]], "questions": [{"type": "qcm", "q": "Par quelle face les protéines entrent-elles dans le Golgi ?", "choices": ["La face cis", "La face trans", "Par le noyau", "Par la mitochondrie"], "answer": 0, "explication": "La face cis est tournée vers le réticulum, la face trans vers la membrane plasmique."}, {"type": "trou", "q": "L'étiquette qui envoie une enzyme vers le lysosome est le mannose-6-___.", "choices": ["phosphate", "sulfate", "glucose", "sodium"], "answer": 0, "explication": "Elle est reconnue par un récepteur qui emballe l'enzyme dans la bonne vésicule."}, {"type": "vf", "q": "Le Golgi ajoute des sucres aux protéines.", "answer": true, "explication": "C'est la glycosylation, commencée dans le RE et poursuivie dans le Golgi."}, {"type": "qcm", "q": "Quelle cellule aura un Golgi particulièrement développé ?", "choices": ["Une cellule du pancréas qui sécrète des enzymes", "Un globule rouge", "Une cellule qui ne sécrète rien", "Une bactérie"], "answer": 0, "explication": "Plus une cellule exporte de protéines, plus son Golgi est grand."}]}, {"id": "cellule-lyso", "titre": "Lysosomes et peroxysomes", "niveau": "pont", "objectif": "Comprendre le recyclage et la détoxification dans la cellule.", "sources": {"sorbonne": "UE2 BioCell · Systèmes endomembranaires", "saclay": "Biologie · Peroxysomes, Système endomembranaire"}, "slides": [{"t": "Le lysosome, estomac de la cellule", "p": ["Il contient une cinquantaine d'**hydrolases acides**, des enzymes qui ne fonctionnent bien qu'à **pH 5** environ.", "Il digère ce qui entre par endocytose, et les organites usés : c'est l'**autophagie**, dont l'étude a valu le prix Nobel 2016 à Yoshinori Ohsumi.", "Si une enzyme manque, la molécule qu'elle devait dégrader s'accumule : ce sont les **maladies de surcharge**, comme la maladie de Gaucher."]}, {"t": "Le peroxysome", "p": ["C'est une petite vésicule qui contient des enzymes d'**oxydation**.", "Il dégrade les **acides gras à très longue chaîne** et produit au passage du peroxyde d'hydrogène (H₂O₂).", "Il contient aussi la **catalase**, qui détruit ce H₂O₂ toxique en eau et en oxygène. Il est très abondant dans le foie et le rein."]}], "cours": ["Le lysosome digère grâce à des hydrolases acides, à pH d'environ 5.", "L'autophagie recycle les organites usés. Un déficit enzymatique donne une maladie de surcharge.", "Le peroxysome oxyde les acides gras à très longue chaîne, et sa catalase détruit le H₂O₂."], "paires": [["Hydrolase acide", "Enzyme du lysosome"], ["Autophagie", "Recyclage des organites"], ["Catalase", "Détruit le H₂O₂"], ["Maladie de surcharge", "Enzyme lysosomale manquante"]], "questions": [{"type": "qcm", "q": "À quel pH fonctionnent les enzymes du lysosome ?", "choices": ["Environ 5", "Environ 7,4", "Environ 9", "Environ 1"], "answer": 0, "explication": "Si un lysosome se rompt, ses enzymes sont peu actives dans le cytoplasme, à pH 7,2 : c'est une sécurité."}, {"type": "trou", "q": "L'enzyme du peroxysome qui détruit le peroxyde d'hydrogène est la ___.", "choices": ["catalase", "pepsine", "amylase", "caspase"], "answer": 0, "explication": "C'est elle qui fait mousser l'eau oxygénée sur une plaie."}, {"type": "vf", "q": "L'autophagie permet à la cellule de recycler ses propres organites.", "answer": true, "explication": "Auto-phagie : se manger soi-même. Elle augmente pendant le jeûne."}, {"type": "qcm", "q": "Qu'est-ce qu'une maladie de surcharge lysosomale ?", "choices": ["L'accumulation d'une molécule que le lysosome ne sait plus dégrader", "Un excès de lysosomes", "Une infection du lysosome", "Une maladie due au sucre"], "answer": 0, "explication": "Il en existe des dizaines, comme les maladies de Gaucher ou de Tay-Sachs."}]}, {"id": "cellule-mito", "titre": "La mitochondrie", "niveau": "pont", "objectif": "Décrire la mitochondrie et son histoire.", "sources": {"sorbonne": "UE1 Biochimie · Mitochondrie et chaîne respiratoire", "saclay": "Biologie · Mitochondries"}, "slides": [{"t": "La centrale électrique", "p": ["La mitochondrie a **deux membranes**. La membrane interne forme des replis, les **crêtes**, qui portent la chaîne respiratoire.", "L'intérieur s'appelle la **matrice** : c'est là que tourne le **cycle de Krebs**.", "Dans une cellule du muscle cardiaque, les mitochondries occupent environ un tiers du volume."]}, {"t": "Une ancienne bactérie", "p": ["Selon la **théorie endosymbiotique**, la mitochondrie descend d'une **bactérie** avalée par une cellule ancestrale, il y a plus d'un milliard d'années.", "Les preuves : elle a son propre **ADN circulaire**, ses propres **ribosomes**, et elle se divise seule.", "Son ADN est transmis par la **mère**. Ses mutations causent des **maladies mitochondriales**, qui touchent surtout les muscles et le cerveau."]}], "cours": ["La mitochondrie a deux membranes. Les crêtes portent la chaîne respiratoire, la matrice abrite le cycle de Krebs.", "Elle descend d'une bactérie ancienne (endosymbiose) : ADN circulaire, ribosomes propres.", "Son ADN vient de la mère. Ses mutations touchent surtout les muscles et le cerveau."], "paires": [["Crêtes", "Replis de la membrane interne"], ["Matrice", "Lieu du cycle de Krebs"], ["Endosymbiose", "Ancienne bactérie"], ["ADN mitochondrial", "Transmis par la mère"]], "questions": [{"type": "qcm", "q": "Comment s'appellent les replis de la membrane interne de la mitochondrie ?", "choices": ["Les crêtes", "Les villosités", "Les citernes", "Les pores"], "answer": 0, "explication": "Ils augmentent la surface disponible pour la chaîne respiratoire."}, {"type": "trou", "q": "La théorie selon laquelle la mitochondrie descend d'une bactérie s'appelle la théorie ___.", "choices": ["endosymbiotique", "cellulaire", "chromosomique", "de la gravitation"], "answer": 0, "explication": "Le chloroplaste des plantes aurait une origine semblable."}, {"type": "vf", "q": "L'ADN mitochondrial est circulaire, comme celui des bactéries.", "answer": true, "explication": "C'est l'un des arguments en faveur de l'origine bactérienne des mitochondries."}, {"type": "qcm", "q": "Quels organes souffrent le plus des maladies mitochondriales ?", "choices": ["Ceux qui consomment beaucoup d'énergie, comme les muscles et le cerveau", "La peau et les cheveux", "Les os", "Aucun, elles ne donnent pas de symptômes"], "answer": 0, "explication": "Ce sont les tissus qui dépendent le plus de la production d'ATP."}, {"type": "pointe", "model": "cellule", "target": ["mito"], "q": "Touche une mitochondrie.", "explication": "Ce sont les petits bâtonnets arrondis, orangés, répartis dans le cytoplasme."}]}, {"id": "cellule-5", "titre": "Le cytosquelette", "niveau": "fac", "objectif": "Connaître les trois familles de filaments et leurs rôles.", "sources": {"sorbonne": "UE2 BioCell · Cytosquelette", "saclay": "Biologie · Cytosquelette"}, "questions": [{"type": "qcm", "q": "Quels sont les trois types de filaments du cytosquelette ?", "choices": ["Microfilaments d'actine, filaments intermédiaires, microtubules", "Collagène, élastine, kératine", "ADN, ARN, protéines", "Cils, flagelles, microvillosités"], "answer": 0, "explication": "Ce sont les trois familles classiques. Cils et flagelles sont construits à partir de microtubules."}, {"type": "vf", "q": "Le fuseau qui sépare les chromosomes pendant la mitose est fait de microtubules.", "answer": true, "explication": "Les microtubules du fuseau s'accrochent aux chromosomes et les tirent vers les deux pôles de la cellule."}, {"type": "qcm", "q": "Quel est le filament le plus épais du cytosquelette ?", "choices": ["Le microtubule", "Le microfilament d'actine", "Le filament intermédiaire", "Ils ont tous la même taille"], "answer": 0, "explication": "Environ 25 nm, contre 10 nm pour les filaments intermédiaires et 7 nm pour l'actine."}, {"type": "trou", "q": "Les microtubules sont faits d'une protéine appelée ___.", "choices": ["tubuline", "actine", "kératine", "collagène"], "answer": 0, "explication": "Des dimères de tubuline s'assemblent en tubes creux."}, {"type": "pointe", "model": "cellule", "target": ["centro"], "q": "Touche le centrosome.", "explication": "Ce sont les deux petits cylindres perpendiculaires (les centrioles). Les microtubules partent de là."}], "cours": ["Le cytosquelette est le squelette interne de la cellule.", "Il compte 3 familles : microfilaments d'actine, filaments intermédiaires, microtubules.", "Les microtubules forment le fuseau de division, les cils et les flagelles."], "paires": [["Actine", "Microfilaments"], ["Tubuline", "Microtubules"], ["Kératine", "Filaments intermédiaires"], ["Fuseau", "Sépare les chromosomes"]], "slides": [{"t": "Trois familles de filaments", "p": ["Les **microfilaments d'actine** (environ 7 nm) donnent sa forme à la cellule et permettent les mouvements, avec la **myosine** dans le muscle.", "Les **filaments intermédiaires** (environ 10 nm) sont les plus solides : ils résistent aux tractions. La **kératine** en fait partie.", "Les **microtubules** (environ 25 nm), faits de **tubuline**, servent de rails pour transporter les vésicules."]}, {"t": "Le cytosquelette en action", "p": ["Pendant la division, les microtubules forment le **fuseau mitotique** qui sépare les chromosomes.", "Les **cils** et les **flagelles** sont construits à partir de microtubules. Le flagelle du spermatozoïde en est un exemple.", "Des **moteurs moléculaires** (kinésine, dynéine) se déplacent sur les microtubules en consommant de l'ATP."]}]}, {"id": "cellule-cils", "titre": "Cils, flagelles et moteurs", "niveau": "fac", "objectif": "Comprendre comment la cellule bouge et transporte.", "sources": {"sorbonne": "UE2 BioCell · Cytosquelette", "saclay": "Biologie · Cytosquelette"}, "slides": [{"t": "L'axonème", "p": ["Les cils et les flagelles ont un squelette de microtubules appelé **axonème**, organisé en **9 doublets autour de 2 microtubules centraux** : c'est le « 9 + 2 ».", "Des bras de **dynéine** font glisser les doublets les uns sur les autres : le cil se courbe et bat.", "Les cils des **bronches** font remonter le mucus, ceux des **trompes** font avancer l'ovocyte, et le **spermatozoïde** nage grâce à son flagelle."]}, {"t": "Les moteurs moléculaires", "p": ["La **kinésine** marche sur les microtubules vers l'extrémité **+**, en général vers la périphérie de la cellule.", "La **dynéine** va vers l'extrémité **−**, vers le centre.", "Dans la **dyskinésie ciliaire primitive**, la dynéine des cils est anormale : infections respiratoires à répétition et infertilité masculine."]}], "cours": ["Cils et flagelles ont un axonème « 9 + 2 » de microtubules.", "La dynéine fait glisser les doublets : le cil bat.", "Kinésine vers le +, dynéine vers le −. Un défaut de dynéine donne la dyskinésie ciliaire primitive."], "paires": [["Axonème", "Squelette du cil"], ["9 + 2", "Organisation des microtubules"], ["Kinésine", "Vers l'extrémité +"], ["Dynéine", "Vers l'extrémité −"]], "questions": [{"type": "qcm", "q": "Comment sont organisés les microtubules d'un cil ?", "choices": ["9 doublets autour de 2 microtubules centraux", "2 doublets autour de 9 microtubules centraux", "Un seul gros microtubule", "Des filaments d'actine en spirale"], "answer": 0, "explication": "C'est la structure « 9 + 2 » de l'axonème."}, {"type": "trou", "q": "Le moteur moléculaire qui se déplace vers l'extrémité + des microtubules est la ___.", "choices": ["kinésine", "dynéine", "myosine", "tubuline"], "answer": 0, "explication": "Elle transporte par exemple des vésicules du corps du neurone vers le bout de l'axone."}, {"type": "vf", "q": "Les cils des bronches aident à évacuer le mucus.", "answer": true, "explication": "C'est l'escalator mucociliaire. Le tabac l'abîme, d'où la toux du fumeur."}, {"type": "qcm", "q": "Un défaut de la dynéine des cils peut provoquer :", "choices": ["Des infections respiratoires à répétition et une infertilité", "Une anémie", "Un diabète", "Une myopie"], "answer": 0, "explication": "Les cils ne battent plus : le mucus stagne et les spermatozoïdes nagent mal."}]}, {"id": "cellule-6", "titre": "Noyau et chromosomes", "niveau": "pont", "objectif": "Décrire le noyau et lire un caryotype humain.", "sources": {"sorbonne": "UE2 BioCell · Noyau", "saclay": "Biologie · Structure des chromosomes, Caryotype humain"}, "questions": [{"type": "qcm", "q": "Combien de chromosomes contient une cellule humaine non reproductrice ?", "choices": ["46", "23", "44", "92"], "answer": 0, "explication": "23 paires : 22 paires d'autosomes et 1 paire de chromosomes sexuels (XX ou XY)."}, {"type": "vf", "q": "Le nucléole est l'endroit du noyau où sont fabriqués les ARN des ribosomes.", "answer": true, "explication": "Le nucléole produit les ARN ribosomiques et assemble les sous-unités des ribosomes."}, {"type": "vf", "q": "Les globules rouges humains matures ont un noyau.", "answer": false, "explication": "Ils le perdent pendant leur maturation, ce qui laisse plus de place à l'hémoglobine."}, {"type": "qcm", "q": "Combien de chromosomes a une personne atteinte de trisomie 21 ?", "choices": ["47", "46", "45", "69"], "answer": 0, "explication": "Un chromosome 21 en trop : 46 + 1 = 47."}, {"type": "pointe", "model": "cellule", "target": ["nucleole"], "q": "Touche le nucléole.", "explication": "C'est la boule sombre à l'intérieur du noyau : c'est là que sont fabriqués les ARN des ribosomes."}], "cours": ["Le noyau contient l'ADN, protégé par une double membrane percée de pores.", "Le nucléole fabrique les ARN des ribosomes.", "Une cellule humaine a 46 chromosomes : 23 paires, dont une paire de chromosomes sexuels."], "paires": [["46", "Chromosomes humains"], ["XY", "Caryotype masculin"], ["Pore nucléaire", "Échanges avec le cytoplasme"], ["Nucléole", "Fabrique les ARNr"]], "slides": [{"t": "Le noyau", "p": ["Il est entouré d'une **enveloppe nucléaire** double, percée de **pores** qui laissent passer ARN et protéines.", "À l'intérieur, l'ADN associé à des protéines forme la **chromatine**. Le **nucléole** fabrique les ARN ribosomiques.", "Les globules rouges humains matures n'ont **pas de noyau**."]}, {"t": "Le caryotype", "p": ["Une cellule humaine a **46 chromosomes**, soit **23 paires**.", "**22 paires d'autosomes** et **1 paire de chromosomes sexuels** : XX chez la femme, XY chez l'homme.", "Un caryotype classe les chromosomes par taille. Une **trisomie 21** se voit par 3 chromosomes 21 au lieu de 2."]}]}, {"id": "cellule-chromo", "titre": "Le chromosome en détail", "niveau": "pont", "objectif": "Décrire les parties d'un chromosome.", "sources": {"sorbonne": "UE2 BioCell · Noyau", "saclay": "Biologie · Structure des chromosomes, Caryotype humain"}, "slides": [{"t": "L'anatomie d'un chromosome", "p": ["Avant la division, chaque chromosome est formé de **2 chromatides sœurs** identiques, reliées au niveau du **centromère**.", "Le centromère sépare un **bras court (p)** et un **bras long (q)**.", "Au bout des bras se trouvent les **télomères**, des séquences répétées qui protègent les extrémités."]}, {"t": "Les télomères et l'âge", "p": ["À chaque division, les télomères **raccourcissent** un peu.", "Quand ils deviennent trop courts, la cellule arrête de se diviser : c'est une horloge du **vieillissement** cellulaire.", "La **télomérase** peut les rallonger. Elle est active dans les cellules souches et dans la plupart des **cellules cancéreuses**."]}], "cours": ["Un chromosome répliqué a 2 chromatides sœurs reliées par le centromère.", "Bras court p, bras long q, et des télomères aux extrémités.", "Les télomères raccourcissent à chaque division. La télomérase les rallonge (cellules souches, cancers)."], "paires": [["Centromère", "Relie les chromatides"], ["Bras p", "Bras court"], ["Télomère", "Protège l'extrémité"], ["Télomérase", "Rallonge les télomères"]], "questions": [{"type": "qcm", "q": "Comment s'appelle le bras court d'un chromosome ?", "choices": ["Le bras p", "Le bras q", "Le télomère", "Le centromère"], "answer": 0, "explication": "p comme « petit ». Une anomalie notée 5p touche le bras court du chromosome 5."}, {"type": "trou", "q": "Les extrémités protectrices des chromosomes s'appellent les ___.", "choices": ["télomères", "centromères", "chromatides", "nucléosomes"], "answer": 0, "explication": "Elles raccourcissent un peu à chaque division."}, {"type": "vf", "q": "La plupart des cellules cancéreuses ont une télomérase active.", "answer": true, "explication": "Elles peuvent ainsi se diviser sans limite, ce qui en fait une cible de recherche."}, {"type": "qcm", "q": "Deux chromatides sœurs sont :", "choices": ["Deux copies identiques d'un chromosome, issues de la réplication", "Les deux chromosomes d'une paire, venus du père et de la mère", "Deux chromosomes de paires différentes", "Les deux bras d'un chromosome"], "answer": 0, "explication": "Les deux chromosomes d'une même paire, eux, s'appellent des chromosomes homologues."}, {"type": "pointe", "model": "chromosome", "target": ["centro"], "q": "Touche le centromère.", "explication": "C'est l'étranglement qui relie les deux chromatides sœurs et sépare les bras p et q."}]}, {"id": "cellule-7", "titre": "Cycle cellulaire et mitose", "niveau": "lycee", "objectif": "Placer la réplication dans le cycle et connaître le résultat d'une mitose.", "sources": {"sorbonne": "UE2 BioCell · Cycle cellulaire, Mitose", "saclay": "Biologie · Cycle cellulaire, Division cellulaire"}, "questions": [{"type": "qcm", "q": "Pendant quelle phase du cycle cellulaire l'ADN est-il répliqué ?", "choices": ["Phase S", "Phase G1", "Phase G2", "Mitose"], "answer": 0, "explication": "S comme synthèse. G1, S et G2 forment l'interphase, qui précède la mitose."}, {"type": "qcm", "q": "À l'issue d'une mitose, on obtient :", "choices": ["2 cellules génétiquement identiques à la cellule mère", "4 cellules à 23 chromosomes", "2 cellules à 23 chromosomes", "4 cellules identiques"], "answer": 0, "explication": "La mitose sert à la croissance et au renouvellement : chaque cellule fille garde 46 chromosomes."}, {"type": "trou", "q": "Pendant la ___, les chromosomes s'alignent au milieu de la cellule.", "choices": ["métaphase", "prophase", "anaphase", "télophase"], "answer": 0, "explication": "Ils forment la plaque équatoriale, un moment idéal pour les observer."}, {"type": "vf", "q": "La plupart des neurones adultes se divisent en permanence.", "answer": false, "explication": "Ils sont en phase G0 : ils ne se divisent plus."}], "cours": ["Le cycle cellulaire : G1, S, G2 (l'interphase), puis la mitose.", "L'ADN est copié pendant la phase S.", "La mitose donne 2 cellules identiques à la cellule mère."], "paires": [["Phase S", "Réplication de l'ADN"], ["Mitose", "Division de la cellule"], ["Interphase", "G1 + S + G2"], ["Anaphase", "Séparation des chromatides"]], "slides": [{"t": "Le cycle cellulaire", "p": ["Il comprend l'**interphase** (G1, S, G2) puis la **mitose** (phase M).", "En **G1**, la cellule grandit. En **S**, elle **réplique son ADN**. En **G2**, elle se prépare à se diviser.", "Des **points de contrôle** vérifient que tout va bien avant chaque étape. Les cellules qui ne se divisent plus sont en **G0**, comme la plupart des neurones."]}, {"t": "Les étapes de la mitose", "p": ["**Prophase** : les chromosomes se condensent. **Métaphase** : ils s'alignent au milieu de la cellule.", "**Anaphase** : les chromatides sœurs se séparent vers chaque pôle. **Télophase** : deux noyaux se reforment.", "La **cytocinèse** coupe ensuite le cytoplasme en deux. Pour retenir l'ordre : **P-M-A-T**."]}]}, {"id": "cellule-controle", "titre": "Le contrôle du cycle", "niveau": "fac", "objectif": "Comprendre les freins et les accélérateurs de la division.", "sources": {"sorbonne": "UE2 BioCell · Cycle cellulaire", "saclay": "Biologie · Cycle cellulaire, Différenciation et prolifération"}, "slides": [{"t": "Cyclines et CDK", "p": ["Le cycle est piloté par des **CDK** (kinases dépendantes des cyclines). Elles ne sont actives qu'associées à une **cycline**.", "La quantité de chaque cycline monte et descend au cours du cycle : c'est ce qui fait passer la cellule d'une phase à l'autre.", "Ce mécanisme a valu le prix Nobel 2001 à Hartwell, Hunt et Nurse."]}, {"t": "Les points de contrôle", "p": ["Aux **points de contrôle** (G1/S, G2/M, métaphase), la cellule vérifie que tout va bien : ADN intact, chromosomes bien accrochés au fuseau.", "La protéine **p53**, surnommée « **gardienne du génome** », bloque le cycle si l'ADN est abîmé, le temps de le réparer, ou déclenche l'apoptose.", "Le gène de p53 est muté dans **environ la moitié des cancers**."]}], "cours": ["Les CDK, activées par les cyclines, font avancer le cycle.", "Aux points de contrôle, la cellule vérifie l'ADN et les chromosomes.", "p53, gardienne du génome, stoppe le cycle ou déclenche l'apoptose. Elle est mutée dans environ la moitié des cancers."], "paires": [["Cycline", "Active une CDK"], ["CDK", "Fait avancer le cycle"], ["p53", "Gardienne du génome"], ["Point de contrôle", "Vérification avant de continuer"]], "questions": [{"type": "qcm", "q": "Quel est le surnom de la protéine p53 ?", "choices": ["La gardienne du génome", "Le chef d'orchestre du cœur", "La pompe à sodium", "L'usine à ATP"], "answer": 0, "explication": "Elle surveille l'ADN et empêche une cellule abîmée de se diviser."}, {"type": "trou", "q": "Une CDK n'est active que lorsqu'elle est associée à une ___.", "choices": ["cycline", "histone", "caspase", "vésicule"], "answer": 0, "explication": "CDK signifie kinase dépendante des cyclines."}, {"type": "vf", "q": "Le gène de p53 est muté dans environ la moitié des cancers.", "answer": true, "explication": "Sans ce frein, les cellules à l'ADN abîmé continuent à se diviser."}, {"type": "qcm", "q": "Que fait une cellule dont l'ADN est abîmé au point de contrôle G1/S ?", "choices": ["Elle s'arrête pour réparer, ou meurt par apoptose si c'est trop grave", "Elle accélère sa division", "Elle double ses chromosomes", "Rien de particulier"], "answer": 0, "explication": "C'est le rôle des points de contrôle, notamment grâce à p53."}]}, {"id": "cellule-8", "titre": "La méiose", "niveau": "lycee", "objectif": "Expliquer le rôle de la méiose et le brassage génétique.", "sources": {"sorbonne": "UE2 BioCell · Méiose", "saclay": "Biologie · Méiose"}, "questions": [{"type": "qcm", "q": "À quoi sert la méiose ?", "choices": ["À produire des gamètes avec moitié moins de chromosomes", "À réparer les tissus abîmés", "À faire grandir l'organisme", "À doubler le nombre de chromosomes"], "answer": 0, "explication": "Les gamètes ont 23 chromosomes. La fécondation rétablit les 46."}, {"type": "vf", "q": "Deux gamètes d'une même personne sont presque toujours génétiquement différents.", "answer": true, "explication": "Le brassage entre chromosomes (plus de 8 millions de combinaisons) et le crossing-over rendent chaque gamète unique."}, {"type": "qcm", "q": "Quelle division de la méiose sépare les chromosomes homologues ?", "choices": ["La 1re division", "La 2e division", "Les deux", "Aucune"], "answer": 0, "explication": "La 1re division est réductionnelle : on passe de 2n à n."}, {"type": "trou", "q": "L'échange de morceaux entre chromosomes homologues s'appelle le ___.", "choices": ["crossing-over", "caryotype", "clonage", "codon"], "answer": 0, "explication": "Il se produit en prophase de 1re division et crée de nouvelles combinaisons d'allèles."}], "cours": ["La méiose produit les gamètes : spermatozoïdes et ovules.", "Elle divise par deux le nombre de chromosomes : de 46 à 23.", "Le brassage génétique rend chaque gamète unique."], "paires": [["Gamète", "23 chromosomes"], ["Fécondation", "Rétablit les 46"], ["Crossing-over", "Échange entre chromosomes"], ["Méiose", "2 divisions à la suite"]], "slides": [{"t": "Deux divisions à la suite", "p": ["La méiose part d'une cellule à **2n = 46** chromosomes et donne **4 cellules à n = 23**.", "La **1re division** sépare les chromosomes **homologues** : c'est elle qui divise le nombre par deux.", "La **2e division** sépare les **chromatides sœurs**, comme une mitose."]}, {"t": "Le brassage génétique", "p": ["**Brassage interchromosomique** : chaque paire se sépare au hasard, ce qui donne 2²³, soit plus de 8 millions de combinaisons.", "**Brassage intrachromosomique** : les homologues échangent des morceaux, c'est le **crossing-over**.", "Une erreur de séparation (**non-disjonction**) peut donner un gamète avec un chromosome en trop, à l'origine d'une trisomie."]}]}, {"id": "cellule-erreurs", "titre": "Les anomalies chromosomiques", "niveau": "pont", "objectif": "Relier une erreur de méiose à une maladie.", "sources": {"sorbonne": "UE2 BioCell · Méiose", "saclay": "Biologie · Caryotype humain, Hérédité"}, "slides": [{"t": "La non-disjonction", "p": ["Si une paire de chromosomes ne se sépare pas pendant la méiose, un gamète reçoit un chromosome **en trop** et un autre **en moins**.", "Après la fécondation, on obtient une **trisomie** (47 chromosomes) ou une **monosomie** (45).", "Le risque augmente avec l'**âge de la mère**, car les ovocytes restent bloqués en méiose pendant des années."]}, {"t": "Les plus connues", "p": ["**Trisomie 21** (syndrome de Down) : la plus fréquente, environ 1 naissance sur 700 en l'absence de dépistage.", "**Trisomies 13 et 18** : beaucoup plus graves.", "Sur les chromosomes sexuels : syndrome de **Turner** (45,X chez une fille) et syndrome de **Klinefelter** (47,XXY chez un garçon)."]}], "cours": ["Une non-disjonction donne un gamète avec un chromosome en trop ou en moins.", "Trisomie = 47 chromosomes, monosomie = 45. Le risque augmente avec l'âge maternel.", "Trisomies 21, 13 et 18. Turner (45,X) et Klinefelter (47,XXY)."], "paires": [["Trisomie 21", "Syndrome de Down"], ["Turner", "45,X"], ["Klinefelter", "47,XXY"], ["Non-disjonction", "Paire qui ne se sépare pas"]], "questions": [{"type": "qcm", "q": "Quel est le caryotype du syndrome de Turner ?", "choices": ["45,X", "47,XXY", "47,XX,+21", "46,XY"], "answer": 0, "explication": "Il touche des filles qui n'ont qu'un seul chromosome X."}, {"type": "trou", "q": "Une paire de chromosomes qui ne se sépare pas pendant la méiose, c'est une non-___.", "choices": ["disjonction", "réplication", "mutation", "fécondation"], "answer": 0, "explication": "C'est la cause principale des trisomies."}, {"type": "vf", "q": "Le risque de trisomie 21 augmente avec l'âge de la mère.", "answer": true, "explication": "Les ovocytes restent bloqués en méiose pendant des années, ce qui favorise les erreurs de séparation."}, {"type": "qcm", "q": "Un garçon au caryotype 47,XXY a :", "choices": ["Un syndrome de Klinefelter", "Un syndrome de Turner", "Une trisomie 21", "Un caryotype normal"], "answer": 0, "explication": "Il a un chromosome X en trop."}]}, {"id": "cellule-signal", "titre": "La signalisation cellulaire", "niveau": "pont", "objectif": "Comprendre comment un signal passe de l'extérieur à l'intérieur de la cellule.", "sources": {"sorbonne": "UE2 BioCell · Interactions cellulaires", "saclay": "Biologie · Signalisation cellulaire"}, "slides": [{"t": "Du signal au récepteur", "p": ["Une cellule reçoit des signaux : **hormones**, **neurotransmetteurs**, facteurs de croissance. On les appelle des **ligands**.", "Les ligands **hydrophiles** (adrénaline, insuline) ne traversent pas la membrane : ils se fixent sur un **récepteur membranaire**.", "Les ligands **lipophiles** (hormones stéroïdes comme le cortisol) traversent la membrane et agissent sur un **récepteur intracellulaire**, souvent jusque dans le noyau."]}, {"t": "Relais et amplification", "p": ["Un récepteur membranaire activé déclenche une cascade à l'intérieur, souvent via un **second messager** comme l'**AMPc** ou le **calcium**.", "Chaque étape active plusieurs molécules : le signal est **amplifié**. Une seule molécule d'adrénaline peut faire libérer des millions de molécules de glucose.", "La distance compte aussi : **endocrine** (par le sang), **paracrine** (aux cellules voisines), **autocrine** (sur la cellule elle-même)."]}], "cours": ["Les ligands hydrophiles se fixent sur un récepteur membranaire, les lipophiles sur un récepteur intracellulaire.", "Un second messager (AMPc, calcium) relaie et amplifie le signal.", "Endocrine : par le sang. Paracrine : aux cellules voisines. Autocrine : sur elle-même."], "paires": [["Ligand", "Molécule signal"], ["AMPc", "Second messager"], ["Endocrine", "Signal par le sang"], ["Paracrine", "Signal aux voisines"]], "questions": [{"type": "qcm", "q": "Où se trouve le récepteur du cortisol, une hormone stéroïde ?", "choices": ["À l'intérieur de la cellule", "Sur la membrane plasmique", "Dans le sang", "Sur une autre cellule"], "answer": 0, "explication": "Le cortisol est lipophile : il traverse la membrane."}, {"type": "trou", "q": "L'AMPc est un second ___.", "choices": ["messager", "ligand", "récepteur", "ribosome"], "answer": 0, "explication": "Le premier messager est l'hormone. Le second relaie le signal à l'intérieur."}, {"type": "vf", "q": "Dans une cascade de signalisation, le signal est amplifié.", "answer": true, "explication": "Chaque molécule activée en active plusieurs à l'étape suivante."}, {"type": "qcm", "q": "Une cellule qui agit sur ses voisines immédiates fait une communication :", "choices": ["Paracrine", "Endocrine", "Autocrine", "Hormonale à distance"], "answer": 0, "explication": "Endocrine : à distance, par le sang. Autocrine : sur elle-même."}]}, {"id": "cellule-jonctions", "titre": "Jonctions et adhérence", "niveau": "pont", "objectif": "Connaître les jonctions qui relient les cellules.", "sources": {"sorbonne": "UE2 BioCell · Interactions cellulaires", "saclay": "Biologie · Communications intercellulaires : contacts membranaires"}, "slides": [{"t": "Serrer et accrocher", "p": ["Les **jonctions serrées** scellent l'espace entre deux cellules : rien ne passe entre elles. Elles rendent l'épithélium de l'intestin étanche.", "Les **jonctions adhérentes** et les **desmosomes** accrochent solidement les cellules entre elles, grâce à des protéines appelées **cadhérines**. La peau en est pleine.", "Les **hémidesmosomes** accrochent la cellule à la lame basale, grâce aux **intégrines**."]}, {"t": "Communiquer directement", "p": ["Les **jonctions communicantes** (ou jonctions gap) forment de petits tunnels entre deux cellules voisines.", "Des ions et de petites molécules passent directement d'une cellule à l'autre.", "Dans le cœur, elles propagent l'influx électrique de cellule en cellule : tout le muscle se contracte ensemble."]}], "cours": ["Jonctions serrées : étanchéité (intestin).", "Jonctions adhérentes et desmosomes : accrochage par les cadhérines (peau). Hémidesmosomes : accrochage à la lame basale par les intégrines.", "Jonctions communicantes : tunnels entre cellules, qui propagent l'influx dans le cœur."], "paires": [["Jonction serrée", "Rend étanche"], ["Desmosome", "Accroche solidement"], ["Jonction communicante", "Tunnel entre cellules"], ["Cadhérine", "Protéine d'adhérence"]], "questions": [{"type": "qcm", "q": "Quelle jonction permet le passage direct d'ions entre deux cellules du cœur ?", "choices": ["La jonction communicante", "La jonction serrée", "Le desmosome", "L'hémidesmosome"], "answer": 0, "explication": "Elle synchronise la contraction des cellules du muscle cardiaque."}, {"type": "trou", "q": "Les hémidesmosomes accrochent la cellule à la lame basale grâce aux ___.", "choices": ["intégrines", "cadhérines", "histones", "cyclines"], "answer": 0, "explication": "Les cadhérines, elles, relient les cellules entre elles."}, {"type": "vf", "q": "Les jonctions serrées empêchent les molécules de passer entre deux cellules.", "answer": true, "explication": "C'est ce qui rend étanches des épithéliums comme celui de l'intestin."}, {"type": "qcm", "q": "Quel tissu est riche en desmosomes, pour résister aux frottements ?", "choices": ["L'épiderme de la peau", "Le sang", "Le liquide cérébrospinal", "La bile"], "answer": 0, "explication": "Certaines maladies auto-immunes détruisent les desmosomes et font apparaître des bulles sur la peau."}]}, {"id": "cellule-mec", "titre": "La matrice extracellulaire", "niveau": "pont", "objectif": "Connaître les composants de la matrice et leurs rôles.", "sources": {"sorbonne": "UE2 BioCell · Interactions cellulaires", "saclay": "Biologie · Matrice extracellulaire"}, "slides": [{"t": "Ce qu'il y a entre les cellules", "p": ["La **matrice extracellulaire** est un réseau de molécules fabriqué par les cellules, surtout par les **fibroblastes**.", "Les **fibres de collagène** résistent à la traction. Le collagène est la protéine la plus abondante du corps.", "Les **fibres élastiques** (élastine) permettent de s'étirer puis de revenir : poumons, artères, peau."]}, {"t": "Un gel, et des maladies", "p": ["Entre les fibres, un gel de **protéoglycanes** retient beaucoup d'eau : c'est lui qui rend le cartilage résistant à la compression.", "La fabrication du collagène a besoin de **vitamine C**. Sans elle, c'est le **scorbut** : gencives qui saignent, plaies qui cicatrisent mal.", "Des anomalies génétiques du collagène donnent des maladies comme l'**ostéogenèse imparfaite**, la « maladie des os de verre »."]}], "cours": ["La matrice est fabriquée surtout par les fibroblastes.", "Collagène : résiste à la traction. Élastine : élasticité. Protéoglycanes : gel qui retient l'eau.", "Sans vitamine C, le collagène est mal formé : c'est le scorbut."], "paires": [["Collagène", "Résiste à la traction"], ["Élastine", "Permet de s'étirer"], ["Fibroblaste", "Fabrique la matrice"], ["Scorbut", "Manque de vitamine C"]], "questions": [{"type": "qcm", "q": "Quelle est la protéine la plus abondante du corps humain ?", "choices": ["Le collagène", "L'hémoglobine", "L'insuline", "La myosine"], "answer": 0, "explication": "Elle représente environ un quart à un tiers des protéines du corps."}, {"type": "trou", "q": "Le scorbut est dû à un manque de vitamine ___.", "choices": ["C", "D", "B9", "K"], "answer": 0, "explication": "La vitamine C est nécessaire pour fabriquer un collagène solide."}, {"type": "vf", "q": "Les fibres élastiques permettent aux artères de s'étirer à chaque battement du cœur.", "answer": true, "explication": "Elles reprennent ensuite leur forme, ce qui aide le sang à continuer d'avancer."}, {"type": "qcm", "q": "Quelle cellule fabrique l'essentiel de la matrice du tissu conjonctif ?", "choices": ["Le fibroblaste", "Le neurone", "Le globule rouge", "L'ovocyte"], "answer": 0, "explication": "Fibro- : fibre. Il fabrique le collagène et l'élastine."}]}, {"id": "cellule-souches", "titre": "Cellules souches et différenciation", "niveau": "pont", "objectif": "Distinguer les types de cellules souches.", "sources": {"sorbonne": "UE2 BioCell · Destins : sénescence, différenciation", "saclay": "Biologie · Cellules souches pluripotentes"}, "slides": [{"t": "Des cellules à tout faire", "p": ["Une **cellule souche** peut se renouveler et donner des cellules spécialisées.", "**Totipotente** : peut tout former, même le placenta (le zygote). **Pluripotente** : peut former toutes les cellules du corps (bouton embryonnaire). **Multipotente** : seulement quelques types.", "Exemple de cellule multipotente : les **cellules souches de la moelle osseuse**, qui fabriquent toutes les cellules du sang."]}, {"t": "Reprogrammer une cellule", "p": ["En 2006, **Shinya Yamanaka** a transformé des cellules de peau en cellules pluripotentes : les **iPS**. Il a reçu le prix Nobel en 2012.", "On peut ainsi fabriquer des neurones ou des cellules cardiaques à partir de la peau d'un patient, pour étudier sa maladie.", "La **greffe de moelle osseuse** utilise déjà des cellules souches pour traiter certaines leucémies."]}], "cours": ["Une cellule souche se renouvelle et se différencie.", "Totipotente : tout, placenta compris. Pluripotente : tout le corps. Multipotente : quelques types.", "Les iPS sont des cellules adultes reprogrammées en cellules pluripotentes (Yamanaka)."], "paires": [["Totipotente", "Tout, placenta compris"], ["Pluripotente", "Toutes les cellules du corps"], ["Multipotente", "Quelques types"], ["iPS", "Cellule reprogrammée"]], "questions": [{"type": "qcm", "q": "Le zygote est une cellule :", "choices": ["Totipotente", "Multipotente", "Unipotente", "Différenciée"], "answer": 0, "explication": "Il peut donner tout l'organisme et ses annexes, placenta compris."}, {"type": "trou", "q": "Les cellules adultes reprogrammées en cellules pluripotentes s'appellent les cellules ___.", "choices": ["iPS", "CDK", "LDL", "SRP"], "answer": 0, "explication": "Induced Pluripotent Stem cells, obtenues par Shinya Yamanaka en 2006."}, {"type": "vf", "q": "Les cellules souches de la moelle osseuse fabriquent les cellules du sang.", "answer": true, "explication": "Ce sont les cellules souches hématopoïétiques, qui sont multipotentes."}, {"type": "qcm", "q": "Les cellules du bouton embryonnaire sont :", "choices": ["Pluripotentes", "Totipotentes", "Unipotentes", "Toutes différenciées"], "answer": 0, "explication": "Elles peuvent former toutes les cellules du corps, mais pas le placenta."}]}, {"id": "cellule-senescence", "titre": "La sénescence", "niveau": "fac", "objectif": "Comprendre pourquoi les cellules vieillissent.", "sources": {"sorbonne": "UE2 BioCell · Destins : sénescence, différenciation", "saclay": "Biologie · Différenciation et prolifération"}, "slides": [{"t": "La limite de Hayflick", "p": ["En culture, une cellule humaine normale ne se divise qu'environ **50 fois**, puis s'arrête : c'est la **limite de Hayflick**.", "La cause principale est le **raccourcissement des télomères** à chaque division.", "La cellule entre alors en **sénescence** : elle reste vivante, mais ne se divise plus jamais."]}, {"t": "Une cellule sénescente", "p": ["Elle change de forme et sécrète des molécules **inflammatoires**.", "Les cellules sénescentes s'accumulent avec l'**âge** et participeraient au vieillissement des tissus.", "La sénescence est aussi une **protection contre le cancer** : une cellule abîmée arrête de se diviser au lieu de proliférer."]}], "cours": ["Une cellule normale se divise environ 50 fois : c'est la limite de Hayflick.", "Le raccourcissement des télomères déclenche la sénescence.", "La cellule sénescente ne se divise plus, sécrète des molécules inflammatoires, et protège contre le cancer."], "paires": [["Hayflick", "Limite d'environ 50 divisions"], ["Sénescence", "Arrêt définitif des divisions"], ["Télomères", "Raccourcissent à chaque division"], ["Protection", "Freine le cancer"]], "questions": [{"type": "qcm", "q": "Combien de fois environ une cellule humaine normale peut-elle se diviser en culture ?", "choices": ["50", "5", "5 000", "Sans limite"], "answer": 0, "explication": "C'est la limite de Hayflick, décrite dans les années 1960."}, {"type": "trou", "q": "Une cellule vivante qui ne se divise plus jamais est dite ___.", "choices": ["sénescente", "apoptotique", "nécrosée", "totipotente"], "answer": 0, "explication": "Contrairement à l'apoptose, la cellule ne meurt pas."}, {"type": "vf", "q": "La sénescence peut protéger contre le cancer.", "answer": true, "explication": "Une cellule abîmée qui cesse de se diviser ne peut plus donner de tumeur."}, {"type": "qcm", "q": "Quelle est la principale cause de la limite de Hayflick ?", "choices": ["Le raccourcissement des télomères", "Le manque de glucose", "La perte du noyau", "L'excès de mitochondries"], "answer": 0, "explication": "Quand les télomères sont trop courts, la cellule arrête son cycle."}, {"type": "pointe", "model": "chromosome", "target": ["telo"], "q": "Touche les télomères, qui raccourcissent à chaque division.", "explication": "Ce sont les extrémités des chromatides. Trop courts, ils déclenchent la sénescence."}]}, {"id": "cellule-9", "titre": "L'apoptose", "niveau": "fac", "objectif": "Différencier mort programmée et mort accidentelle.", "sources": {"sorbonne": "UE2 BioCell · Destins : apoptose", "saclay": "Biologie · Processus de mort cellulaire"}, "questions": [{"type": "qcm", "q": "L'apoptose, c'est :", "choices": ["Une mort cellulaire programmée et contrôlée, sans inflammation", "Une mort accidentelle où la cellule éclate", "La division d'une cellule en deux", "La transformation d'une cellule en cellule cancéreuse"], "answer": 0, "explication": "La mort accidentelle s'appelle la nécrose : la cellule éclate et provoque une inflammation."}, {"type": "vf", "q": "Chez l'embryon, l'apoptose participe à la séparation des doigts.", "answer": true, "explication": "Les cellules entre les futurs doigts meurent par apoptose. C'est un exemple classique de mort utile."}, {"type": "trou", "q": "Les enzymes qui exécutent l'apoptose s'appellent les ___.", "choices": ["caspases", "kinases", "lipases", "polymérases"], "answer": 0, "explication": "Les caspases découpent des protéines clés : la cellule se démonte proprement."}, {"type": "vf", "q": "Un défaut d'apoptose peut favoriser l'apparition d'un cancer.", "answer": true, "explication": "Les cellules qui auraient dû mourir continuent à se diviser."}], "cours": ["L'apoptose est une mort programmée : la cellule se démonte proprement.", "La nécrose est une mort accidentelle : la cellule éclate et provoque une inflammation.", "L'apoptose sculpte l'embryon et élimine les cellules abîmées."], "paires": [["Apoptose", "Mort programmée"], ["Nécrose", "Mort accidentelle"], ["Inflammation", "Suite de la nécrose"], ["Doigts de l'embryon", "Séparés par apoptose"]], "slides": [{"t": "Mourir proprement", "p": ["L'**apoptose** est une mort **programmée** : la cellule rétrécit, son ADN est découpé, puis elle se fragmente en **corps apoptotiques**.", "Ces fragments sont mangés par des **macrophages**, sans déclencher d'**inflammation**.", "Elle est exécutée par des enzymes appelées **caspases**."]}, {"t": "À quoi ça sert ?", "p": ["Chez l'embryon, elle **sculpte les organes** : elle sépare les doigts, par exemple.", "Chez l'adulte, elle élimine les cellules **abîmées** ou infectées.", "Quand elle ne marche plus, des cellules anormales survivent : c'est une étape vers le **cancer**. À l'inverse, la **nécrose** est une mort accidentelle, avec inflammation."]}]}, {"id": "cellule-cancer", "titre": "Quand la cellule devient cancéreuse", "niveau": "pont", "objectif": "Comprendre les grandes étapes de la cancérisation.", "sources": {"sorbonne": "UE2 BioCell · Cycle cellulaire, Destins", "saclay": "Biologie · Différenciation et prolifération, Signalisation cellulaire"}, "slides": [{"t": "Accélérateur bloqué, freins cassés", "p": ["Un cancer naît de **mutations accumulées** dans une cellule, souvent sur des années.", "Les **oncogènes** sont des gènes qui accélèrent la division : une mutation les rend **trop actifs**.", "Les **gènes suppresseurs de tumeur** sont des freins, comme celui de **p53** : une mutation les **désactive**."]}, {"t": "De la tumeur aux métastases", "p": ["La cellule se divise sans contrôle, échappe à l'**apoptose** et n'a plus de limite de divisions (télomérase active).", "La tumeur attire des **vaisseaux** pour se nourrir : c'est l'**angiogenèse**.", "Certaines cellules migrent par le sang ou la lymphe et forment des **métastases** ailleurs. C'est ce qui rend un cancer grave."]}], "cours": ["Un cancer vient de mutations accumulées dans une cellule.", "Oncogène : accélérateur trop actif. Gène suppresseur de tumeur (p53) : frein désactivé.", "La tumeur échappe à l'apoptose, attire des vaisseaux (angiogenèse) et peut donner des métastases."], "paires": [["Oncogène", "Accélérateur trop actif"], ["Suppresseur de tumeur", "Frein désactivé"], ["Angiogenèse", "Formation de vaisseaux"], ["Métastase", "Tumeur à distance"]], "questions": [{"type": "qcm", "q": "Un gène qui favorise la division et devient trop actif après une mutation est :", "choices": ["Un oncogène", "Un gène suppresseur de tumeur", "Un télomère", "Un gène mitochondrial"], "answer": 0, "explication": "Il agit comme un accélérateur bloqué."}, {"type": "trou", "q": "La formation de nouveaux vaisseaux pour nourrir une tumeur s'appelle l'___.", "choices": ["angiogenèse", "apoptose", "autophagie", "anaphase"], "answer": 0, "explication": "Certains médicaments anticancéreux la bloquent."}, {"type": "vf", "q": "Un cancer résulte le plus souvent d'une seule mutation.", "answer": false, "explication": "Il faut en général l'accumulation de plusieurs mutations, souvent sur des années."}, {"type": "qcm", "q": "Qu'est-ce qu'une métastase ?", "choices": ["Une tumeur secondaire formée à distance de la tumeur d'origine", "Une tumeur bénigne", "Une cellule qui meurt par apoptose", "Un type de globule blanc"], "answer": 0, "explication": "Les cellules cancéreuses voyagent par le sang ou la lymphe."}]}], "parties": [{"titre": "Le vivant et ses outils", "debut": "cellule-echelles"}, {"titre": "La membrane", "debut": "cellule-3"}, {"titre": "Les organites", "debut": "cellule-4"}, {"titre": "Noyau, chromosomes et division", "debut": "cellule-6"}, {"titre": "Communication et destin", "debut": "cellule-signal"}]}, {"id": "adn", "titre": "ADN et gènes", "matiere": "Biologie moléculaire", "lycee": "SVT 1re : réplication, mutations, expression des gènes", "lecons": [{"id": "adn-1", "titre": "La molécule d'ADN", "niveau": "lycee", "objectif": "Décrire la double hélice et l'appariement des bases.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · ADN, génome et chromosomes"}, "questions": [{"type": "qcm", "q": "Dans l'ADN, l'adénine (A) s'apparie toujours avec :", "choices": ["La thymine (T)", "La cytosine (C)", "La guanine (G)", "L'uracile (U)"], "answer": 0, "explication": "A avec T (2 liaisons hydrogène), G avec C (3 liaisons hydrogène)."}, {"type": "vf", "q": "Les deux brins de l'ADN sont antiparallèles.", "answer": true, "explication": "Un brin va de 5' vers 3', l'autre de 3' vers 5'."}, {"type": "trou", "q": "Dans l'ADN, le sucre s'appelle le ___.", "choices": ["désoxyribose", "ribose", "glucose", "fructose"], "answer": 0, "explication": "Désoxy- : il lui manque un atome d'oxygène par rapport au ribose de l'ARN."}, {"type": "qcm", "q": "Un brin d'ADN a pour séquence 5'-ATGC-3'. Quelle est la séquence du brin complémentaire, lue de 5' vers 3' ?", "choices": ["5'-GCAT-3'", "5'-TACG-3'", "5'-ATGC-3'", "5'-CGTA-3'"], "answer": 0, "explication": "Le complémentaire est 3'-TACG-5', soit 5'-GCAT-3' une fois relu dans le bon sens."}, {"type": "pointe", "model": "adn", "target": ["squelette"], "q": "Touche le squelette sucre-phosphate de l'ADN.", "explication": "C'est la partie extérieure de l'hélice, où alternent sucres et phosphates (le phosphore est en orange). Les bases sont à l'intérieur, comme les barreaux d'une échelle."}], "cours": ["L'ADN est une double hélice faite de nucléotides.", "Les bases s'apparient deux à deux : A avec T, G avec C.", "Les deux brins sont antiparallèles : l'un va de 5' vers 3', l'autre de 3' vers 5'."], "paires": [["A", "T"], ["G", "C"], ["Désoxyribose", "Sucre de l'ADN"], ["Double hélice", "Forme de l'ADN"]], "slides": [{"t": "Les nucléotides", "p": ["L'ADN est une chaîne de **nucléotides**. Chacun contient un **sucre** (le désoxyribose), un **phosphate** et une **base azotée**.", "Il existe 4 bases : **A** (adénine), **T** (thymine), **G** (guanine) et **C** (cytosine).", "A et G sont des **purines** (deux cycles). T et C sont des **pyrimidines** (un seul cycle)."]}, {"t": "La double hélice", "p": ["Deux brins s'enroulent en **double hélice**, décrite par Watson et Crick en 1953 grâce aux images de Rosalind Franklin.", "Les bases s'apparient : **A–T** par 2 liaisons hydrogène, **G–C** par 3.", "Les brins sont **antiparallèles** : l'un va de 5' vers 3', l'autre de 3' vers 5'."]}]}, {"id": "adn-2", "titre": "Génome et chromatine", "niveau": "pont", "objectif": "Comprendre comment 2 mètres d'ADN tiennent dans un noyau.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · ADN, génome et chromosomes"}, "questions": [{"type": "qcm", "q": "Autour de quelles protéines l'ADN s'enroule-t-il pour former les nucléosomes ?", "choices": ["Les histones", "Les kératines", "Les enzymes de restriction", "Les ribosomes"], "answer": 0, "explication": "L'ADN s'enroule autour des histones comme un fil sur des bobines, puis se compacte encore."}, {"type": "vf", "q": "Chez l'être humain, la majorité de l'ADN code des protéines.", "answer": false, "explication": "Environ 1 à 2 % seulement du génome code des protéines. Le reste a d'autres rôles, notamment de régulation."}, {"type": "trou", "q": "L'ADN enroulé autour d'un groupe de 8 histones forme un ___.", "choices": ["nucléosome", "ribosome", "centromère", "nucléole"], "answer": 0, "explication": "C'est l'unité de base de la chromatine."}, {"type": "qcm", "q": "Combien de gènes codant des protéines compte à peu près le génome humain ?", "choices": ["20 000", "2 000", "200 000", "2 millions"], "answer": 0, "explication": "Environ 20 000, bien moins que ce qu'on imaginait avant le séquençage du génome en 2003."}], "cours": ["Chaque cellule contient environ 2 mètres d'ADN.", "Il s'enroule autour de protéines, les histones, pour former la chromatine.", "Seuls 1 à 2 % du génome codent des protéines."], "paires": [["Histone", "Bobine de l'ADN"], ["Nucléosome", "ADN + histones"], ["Chromatine", "ADN compacté"], ["Gène", "Séquence qui code"]], "slides": [{"t": "Compacter 2 mètres d'ADN", "p": ["Chaque cellule contient environ **2 mètres** d'ADN, dans un noyau de quelques micromètres.", "L'ADN s'enroule autour de 8 **histones** pour former un **nucléosome** : on parle de « collier de perles ».", "Ce collier se replie encore pour former la **chromatine**, puis les **chromosomes** visibles pendant la division."]}, {"t": "Ouverte ou fermée", "p": ["L'**euchromatine** est peu condensée : ses gènes sont accessibles et peuvent être lus.", "L'**hétérochromatine** est très condensée : ses gènes sont en général éteints.", "Le génome humain compte environ **3 milliards** de paires de bases et **20 000** gènes codant des protéines."]}]}, {"id": "adn-3", "titre": "La réplication", "niveau": "lycee", "objectif": "Expliquer la copie semi-conservative de l'ADN.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · Réplication"}, "questions": [{"type": "qcm", "q": "La réplication de l'ADN est dite semi-conservative car :", "choices": ["Chaque nouvelle molécule garde un brin ancien et un brin nouveau", "La moitié de l'ADN est perdue", "Seul un chromosome sur deux est copié", "Elle n'a lieu qu'une fois sur deux"], "answer": 0, "explication": "Chaque brin sert de modèle. Ça a été démontré par l'expérience de Meselson et Stahl en 1958."}, {"type": "qcm", "q": "Quelle enzyme fabrique le nouveau brin d'ADN ?", "choices": ["L'ADN polymérase", "L'ARN polymérase", "L'hélicase", "La ligase"], "answer": 0, "explication": "L'hélicase ouvre la double hélice, l'ADN polymérase synthétise, la ligase relie les fragments."}, {"type": "trou", "q": "Les petits morceaux d'ADN synthétisés sur le brin tardif s'appellent les fragments d'___.", "choices": ["Okazaki", "Watson", "Mendel", "Franklin"], "answer": 0, "explication": "Ils sont ensuite reliés entre eux par la ligase."}, {"type": "vf", "q": "L'ADN polymérase synthétise le nouveau brin dans le sens 5' → 3'.", "answer": true, "explication": "Elle ajoute toujours les nucléotides à l'extrémité 3' du brin en cours."}], "cours": ["Avant chaque division, la cellule copie son ADN : c'est la réplication.", "Chaque brin sert de modèle : la copie est semi-conservative.", "L'hélicase ouvre la double hélice, l'ADN polymérase fabrique le nouveau brin."], "paires": [["Hélicase", "Ouvre la double hélice"], ["ADN polymérase", "Synthétise le brin"], ["Ligase", "Relie les fragments"], ["Semi-conservative", "1 brin ancien + 1 neuf"]], "slides": [{"t": "Ouvrir et copier", "p": ["L'**hélicase** sépare les deux brins, ce qui forme une **fourche de réplication**.", "L'**ADN polymérase** ajoute des nucléotides complémentaires, toujours dans le sens **5' → 3'**.", "Elle a besoin d'une **amorce** d'ARN pour démarrer, posée par la **primase**."]}, {"t": "Un brin continu, un brin en morceaux", "p": ["Sur le **brin précoce**, la synthèse est continue.", "Sur le **brin tardif**, elle se fait par morceaux, les **fragments d'Okazaki**, que la **ligase** relie ensuite.", "L'ADN polymérase **relit** son travail : il reste environ une erreur pour un milliard de nucléotides copiés."]}]}, {"id": "adn-4", "titre": "Mutations et réparation", "niveau": "pont", "objectif": "Classer les mutations et savoir que la cellule les répare.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · Réparation"}, "questions": [{"type": "qcm", "q": "Une mutation qui change un codon en un autre codon codant le même acide aminé est dite :", "choices": ["Silencieuse", "Non-sens", "Décalante", "Létale"], "answer": 0, "explication": "Grâce à la redondance du code génétique, la protéine reste la même."}, {"type": "vf", "q": "Les UV du soleil peuvent abîmer l'ADN des cellules de la peau.", "answer": true, "explication": "Les UV créent des lésions (dimères de thymine) que des systèmes de réparation corrigent. Quand ils échouent, le risque de cancer augmente."}, {"type": "qcm", "q": "Une délétion d'une seule base dans un gène entraîne en général :", "choices": ["Un décalage du cadre de lecture", "Aucun changement", "Le changement d'un seul acide aminé", "La duplication du gène"], "answer": 0, "explication": "Tous les codons suivants sont lus de travers : la protéine est le plus souvent non fonctionnelle."}, {"type": "vf", "q": "Une mutation dans une cellule de la peau se transmet aux enfants.", "answer": false, "explication": "Seules les mutations des cellules germinales, celles qui donnent les gamètes, sont transmissibles."}], "cours": ["Une mutation est un changement dans la séquence de l'ADN.", "Elle peut être silencieuse, changer un acide aminé ou créer un codon stop.", "Les UV et le tabac abîment l'ADN. La cellule répare la plupart des lésions."], "paires": [["Silencieuse", "Même acide aminé"], ["Non-sens", "Codon stop trop tôt"], ["Faux-sens", "Autre acide aminé"], ["UV", "Dimères de thymine"]], "slides": [{"t": "Les types de mutations", "p": ["Une **substitution** remplace une base par une autre. Elle peut être **silencieuse** (même acide aminé), **faux-sens** (autre acide aminé) ou **non-sens** (codon stop).", "Une **insertion** ou une **délétion** d'une base décale le cadre de lecture : toute la suite de la protéine change.", "Exemple : la **drépanocytose** vient d'une seule substitution dans le gène de l'hémoglobine."]}, {"t": "Causes et réparation", "p": ["Les mutations viennent d'**erreurs de réplication** ou d'**agents mutagènes** : UV, tabac, rayonnements.", "La cellule possède plusieurs **systèmes de réparation** qui corrigent la plupart des lésions.", "Une mutation dans un **gamète** peut être transmise aux enfants. Dans une autre cellule du corps, elle ne l'est pas."]}]}, {"id": "adn-5", "titre": "La transcription", "niveau": "lycee", "objectif": "Passer de l'ADN à l'ARN messager.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · Transcription"}, "questions": [{"type": "qcm", "q": "Lors de la transcription, un gène est copié en :", "choices": ["ARN messager", "Protéine", "ADN", "Acide aminé"], "answer": 0, "explication": "L'ARN polymérase copie un brin d'ADN en ARN messager, qui sort ensuite du noyau."}, {"type": "qcm", "q": "Dans l'ARN, quelle base remplace la thymine ?", "choices": ["L'uracile (U)", "L'adénine (A)", "La cytosine (C)", "La guanine (G)"], "answer": 0, "explication": "L'ARN contient A, U, G, C. Son sucre est le ribose, et non le désoxyribose."}, {"type": "trou", "q": "L'étape qui retire les introns de l'ARN s'appelle l'___.", "choices": ["épissage", "épistasie", "exocytose", "élongation"], "answer": 0, "explication": "Un même gène peut donner plusieurs protéines selon les exons gardés : c'est l'épissage alternatif."}, {"type": "qcm", "q": "L'ARN polymérase commence la transcription au niveau :", "choices": ["Du promoteur", "Du codon stop", "Du centromère", "Du ribosome"], "answer": 0, "explication": "Le promoteur est une séquence en amont du gène qui sert de point de départ."}], "cours": ["La transcription copie un gène en ARN messager.", "Elle se fait dans le noyau, grâce à l'ARN polymérase.", "L'ARN contient de l'uracile (U) à la place de la thymine (T)."], "paires": [["ARN polymérase", "Fabrique l'ARN"], ["Uracile", "Remplace la thymine"], ["Ribose", "Sucre de l'ARN"], ["Noyau", "Lieu de transcription"]], "slides": [{"t": "Du gène à l'ARN", "p": ["L'**ARN polymérase** se fixe sur le **promoteur**, au début du gène.", "Elle lit le **brin matrice** et fabrique un **ARN messager** complémentaire, de 5' vers 3'.", "L'ARN a la même séquence que le **brin codant**, avec des **U** à la place des **T**."]}, {"t": "La maturation", "p": ["Chez les eucaryotes, l'ARN prémessager contient des **introns** (non codants) et des **exons** (codants).", "L'**épissage** retire les introns et raccorde les exons.", "On ajoute aussi une **coiffe** en 5' et une **queue poly-A** en 3', puis l'ARNm sort du noyau par les pores."]}]}, {"id": "adn-6", "titre": "Code génétique et traduction", "niveau": "lycee", "objectif": "Lire un ARN messager codon par codon.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · Traduction"}, "questions": [{"type": "qcm", "q": "Un codon est formé de :", "choices": ["3 nucléotides", "2 nucléotides", "4 nucléotides", "1 acide aminé"], "answer": 0, "explication": "4 bases prises 3 par 3 donnent 64 codons : 61 codent des acides aminés, 3 sont des codons stop."}, {"type": "vf", "q": "Plusieurs codons différents peuvent coder le même acide aminé.", "answer": true, "explication": "On dit que le code génétique est redondant : 61 codons pour 20 acides aminés."}, {"type": "trou", "q": "La traduction commence au codon ___.", "choices": ["AUG", "UAA", "UGA", "GGG"], "answer": 0, "explication": "AUG code la méthionine : c'est le codon d'initiation."}, {"type": "vf", "q": "Des bactéries peuvent fabriquer de l'insuline humaine.", "answer": true, "explication": "Grâce à l'universalité du code génétique, on leur insère le gène humain. C'est utilisé depuis les années 1980."}], "cours": ["L'ARN messager se lit par groupes de 3 nucléotides : les codons.", "Chaque codon correspond à un acide aminé, ou à un signal stop.", "Les ribosomes assemblent les acides aminés : c'est la traduction."], "paires": [["Codon", "3 nucléotides"], ["AUG", "Codon de départ"], ["Ribosome", "Lieu de traduction"], ["ARN de transfert", "Apporte l'acide aminé"]], "slides": [{"t": "Lire le code", "p": ["Le **ribosome** lit l'ARNm codon par codon, à partir du codon **AUG** (méthionine).", "Chaque **ARN de transfert** porte un acide aminé et un **anticodon** complémentaire du codon.", "La lecture s'arrête à un **codon stop** : UAA, UAG ou UGA."]}, {"t": "Un code universel", "p": ["Le code est **redondant** : 61 codons pour 20 acides aminés.", "Il est **universel** : le même codon donne le même acide aminé chez presque tous les êtres vivants.", "C'est ce qui permet de faire fabriquer de l'**insuline humaine** par des bactéries."]}]}, {"id": "adn-7", "titre": "Allumer et éteindre les gènes", "niveau": "fac", "objectif": "Comprendre pourquoi des cellules au même ADN sont différentes.", "sources": {"sorbonne": "UE1 Biochimie · Biologie moléculaire", "saclay": "Biochimie · Régulation de l'expression des gènes"}, "questions": [{"type": "qcm", "q": "Toutes tes cellules ont le même ADN. Pourquoi un neurone et une cellule du foie sont-ils si différents ?", "choices": ["Ils n'expriment pas les mêmes gènes", "Ils n'ont pas les mêmes chromosomes", "Le neurone a perdu une partie de son ADN", "Ils n'utilisent pas le même code génétique"], "answer": 0, "explication": "Chaque type cellulaire active
