et héberge le **microbiote**, des milliards de bactéries utiles."]}]}]}, {"id": "embryo", "titre": "Du gamète à l'embryon", "matiere": "Embryologie", "lycee": "SVT : reproduction, méiose et fécondation (1re et Tle)", "lecons": [{"id": "embryo-1", "titre": "La spermatogenèse", "niveau": "pont", "objectif": "Suivre la fabrication des spermatozoïdes.", "sources": {"sorbonne": "UE2 Histo · Spermatogenèse", "saclay": "Biologie · Gamétogenèse"}, "slides": [{"t": "Une production continue", "p": ["La **spermatogenèse** a lieu dans les **tubes séminifères** des testicules, de la puberté jusqu'à la fin de la vie.", "Les **spermatogonies** se multiplient par mitose, puis deviennent des **spermatocytes**, qui font la méiose.", "On obtient des **spermatides**, qui se transforment en **spermatozoïdes**. Le tout dure environ **74 jours**."]}, {"t": "Les cellules qui aident", "p": ["Les **cellules de Sertoli** entourent et nourrissent les cellules germinales.", "Les **cellules de Leydig**, entre les tubes, fabriquent la **testostérone**.", "Un homme produit des dizaines de millions de spermatozoïdes par jour. Il faut une température d'environ 34 °C, d'où la position des testicules hors de l'abdomen."]}], "cours": ["La spermatogenèse a lieu dans les tubes séminifères, de la puberté à la fin de la vie.", "Spermatogonie, spermatocyte (méiose), spermatide, spermatozoïde : environ 74 jours.", "Les cellules de Sertoli nourrissent, les cellules de Leydig fabriquent la testostérone."], "paires": [["Sertoli", "Nourrit les cellules germinales"], ["Leydig", "Fabrique la testostérone"], ["Tube séminifère", "Lieu de production"], ["Spermatide", "Juste avant le spermatozoïde"]], "questions": [{"type": "qcm", "q": "Quelles cellules fabriquent la testostérone ?", "choices": ["Les cellules de Leydig", "Les cellules de Sertoli", "Les spermatogonies", "Les spermatides"], "answer": 0, "explication": "Elles sont situées entre les tubes séminifères."}, {"type": "trou", "q": "La spermatogenèse se déroule dans les tubes ___.", "choices": ["séminifères", "rénaux", "digestifs", "neuraux"], "answer": 0, "explication": "Chaque testicule en contient des centaines, très longs et enroulés."}, {"type": "vf", "q": "La spermatogenèse s'arrête vers 50 ans.", "answer": false, "explication": "Elle continue toute la vie à partir de la puberté, même si elle diminue avec l'âge."}, {"type": "qcm", "q": "Combien de temps dure environ la spermatogenèse ?", "choices": ["74 jours", "24 heures", "1 an", "7 jours"], "answer": 0, "explication": "Environ deux mois et demi, d'une spermatogonie à un spermatozoïde."}]}, {"id": "embryo-2", "titre": "L'ovogenèse et le cycle", "niveau": "pont", "objectif": "Comprendre l'ovogenèse et le cycle ovarien.", "sources": {"sorbonne": "UE2 Histo · Ovogenèse et folliculogenèse", "saclay": "Biologie · Gamétogenèse"}, "slides": [{"t": "Un stock fixé avant la naissance", "p": ["Contrairement aux spermatozoïdes, les **ovocytes** sont tous formés **avant la naissance**.", "Ils restent bloqués en **prophase de 1re division** de méiose, parfois pendant plus de 40 ans.", "Le stock diminue avec l'âge et s'épuise à la **ménopause**."]}, {"t": "Le cycle ovarien", "p": ["À chaque cycle (environ **28 jours**), un **follicule** mûrit dans l'ovaire sous l'effet de la **FSH**.", "Un pic de **LH** déclenche l'**ovulation**, vers le **14e jour**. L'ovocyte est alors bloqué en **métaphase de 2e division**.", "La 2e division ne se termine que s'il y a **fécondation**. Le follicule vide devient le **corps jaune**, qui produit la **progestérone**."]}], "cours": ["Tous les ovocytes sont formés avant la naissance, bloqués en prophase I.", "Chaque cycle, un follicule mûrit (FSH) et un pic de LH déclenche l'ovulation vers J14.", "La méiose ne se termine qu'à la fécondation. Le corps jaune produit la progestérone."], "paires": [["FSH", "Fait mûrir le follicule"], ["LH", "Déclenche l'ovulation"], ["Corps jaune", "Produit la progestérone"], ["Ménopause", "Fin du stock d'ovocytes"]], "questions": [{"type": "vf", "q": "Une femme fabrique de nouveaux ovocytes tout au long de sa vie.", "answer": false, "explication": "Le stock est constitué avant la naissance et ne fait que diminuer."}, {"type": "trou", "q": "L'ovulation est déclenchée par un pic de ___.", "choices": ["LH", "FSH", "insuline", "testostérone"], "answer": 0, "explication": "C'est ce pic que détectent les tests d'ovulation vendus en pharmacie."}, {"type": "qcm", "q": "À l'ovulation, l'ovocyte est bloqué en :", "choices": ["Métaphase de 2e division", "Prophase de 1re division", "Anaphase de mitose", "Interphase"], "answer": 0, "explication": "La méiose ne reprendra et ne se terminera qu'en cas de fécondation."}, {"type": "qcm", "q": "Après l'ovulation, le follicule vide devient :", "choices": ["Le corps jaune", "Le placenta", "L'endomètre", "Un nouvel ovocyte"], "answer": 0, "explication": "Il sécrète la progestérone, qui prépare l'utérus à une éventuelle grossesse."}]}, {"id": "embryo-3", "titre": "La fécondation", "niveau": "lycee", "objectif": "Décrire la rencontre des gamètes et ses conséquences.", "sources": {"sorbonne": "UE2 Histo · Fécondation", "saclay": "Biologie · Fécondation et segmentation"}, "slides": [{"t": "La rencontre", "p": ["La fécondation a lieu dans la **trompe utérine**, en général dans les 24 heures qui suivent l'ovulation.", "Le spermatozoïde traverse la **zone pellucide** grâce aux enzymes de son **acrosome** : c'est la **réaction acrosomique**.", "Dès qu'un spermatozoïde est entré, la zone pellucide se modifie pour **bloquer les autres** : ça évite la polyspermie."]}, {"t": "Le zygote", "p": ["L'ovocyte termine sa **2e division de méiose**.", "Les deux noyaux (**pronucléus**) mâle et femelle se rapprochent et mettent en commun leurs chromosomes.", "On obtient un **zygote** à **2n = 46** chromosomes. Le **sexe** dépend du spermatozoïde, qui apporte un X ou un Y."]}], "cours": ["La fécondation a lieu dans la trompe utérine, peu après l'ovulation.", "La réaction acrosomique permet de traverser la zone pellucide, qui se ferme ensuite aux autres spermatozoïdes.", "Le zygote a 46 chromosomes. Le spermatozoïde détermine le sexe (X ou Y)."], "paires": [["Acrosome", "Enzymes pour entrer"], ["Zone pellucide", "Enveloppe de l'ovocyte"], ["Zygote", "Cellule-œuf à 2n"], ["Trompe utérine", "Lieu de la fécondation"]], "questions": [{"type": "qcm", "q": "Où a lieu la fécondation, en général ?", "choices": ["Dans la trompe utérine", "Dans l'utérus", "Dans l'ovaire", "Dans le col de l'utérus"], "answer": 0, "explication": "L'embryon descend ensuite vers l'utérus pendant quelques jours."}, {"type": "trou", "q": "Les enzymes qui permettent au spermatozoïde de traverser la zone pellucide sont contenues dans l'___.", "choices": ["acrosome", "flagelle", "noyau", "ribosome"], "answer": 0, "explication": "L'acrosome est une grosse vésicule à l'avant de la tête du spermatozoïde."}, {"type": "vf", "q": "C'est l'ovocyte qui détermine le sexe de l'enfant.", "answer": false, "explication": "L'ovocyte apporte toujours un X. Le spermatozoïde apporte un X (fille) ou un Y (garçon)."}, {"type": "qcm", "q": "Pourquoi un seul spermatozoïde féconde-t-il l'ovocyte ?", "choices": ["La zone pellucide se modifie juste après son entrée", "Les autres meurent tous avant d'arriver", "L'ovocyte n'a qu'un seul récepteur", "Le premier détruit les autres"], "answer": 0, "explication": "C'est le blocage de la polyspermie. Un embryon issu de deux spermatozoïdes ne serait pas viable."}]}, {"id": "embryo-4", "titre": "La première semaine", "niveau": "pont", "objectif": "Suivre l'embryon de la fécondation à l'utérus.", "sources": {"sorbonne": "UE2 Histo · 1re et 2e semaines du développement", "saclay": "Biologie · Fécondation et segmentation"}, "slides": [{"t": "La segmentation", "p": ["Le zygote se divise par mitoses sans grandir : 2, 4, 8 cellules, appelées **blastomères**.", "Vers le **4e jour**, il forme une boule pleine, la **morula** (« petite mûre »).", "Pendant ce temps, il descend la trompe vers l'utérus, toujours entouré de la zone pellucide."]}, {"t": "Le blastocyste", "p": ["Vers le **5e jour**, une cavité apparaît : c'est le **blastocyste**.", "Sa couche externe, le **trophoblaste**, formera une partie du **placenta**. L'amas interne, le **bouton embryonnaire**, formera l'embryon.", "Il sort de la zone pellucide (**éclosion**), puis commence à s'**implanter** dans la paroi de l'utérus vers le **6e-7e jour**."]}], "cours": ["Le zygote se segmente en blastomères, puis forme la morula vers J4.", "Vers J5, le blastocyste a un trophoblaste (futur placenta) et un bouton embryonnaire (futur embryon).", "Il éclot de la zone pellucide et s'implante vers J6-J7."], "paires": [["Morula", "Boule pleine, J4"], ["Blastocyste", "Boule creuse, J5"], ["Trophoblaste", "Futur placenta"], ["Bouton embryonnaire", "Futur embryon"]], "questions": [{"type": "trou", "q": "Vers le 4e jour, l'embryon est une boule pleine appelée ___.", "choices": ["morula", "blastocyste", "gastrula", "neurula"], "answer": 0, "explication": "Son nom vient du latin morum, la mûre, à cause de son aspect."}, {"type": "qcm", "q": "Quelle partie du blastocyste formera l'embryon ?", "choices": ["Le bouton embryonnaire", "Le trophoblaste", "La zone pellucide", "La cavité"], "answer": 0, "explication": "Le trophoblaste, lui, participe au placenta."}, {"type": "vf", "q": "Pendant la segmentation, l'embryon grossit beaucoup.", "answer": false, "explication": "Les cellules se divisent sans que l'ensemble grandisse : elles sont de plus en plus petites."}, {"type": "qcm", "q": "Quand l'embryon commence-t-il à s'implanter dans l'utérus ?", "choices": ["Vers le 6e-7e jour", "Le jour de la fécondation", "Au 3e mois", "Au 14e jour"], "answer": 0, "explication": "C'est à partir de l'implantation qu'il produit l'hormone hCG, détectée par les tests de grossesse."}]}, {"id": "embryo-5", "titre": "La deuxième semaine", "niveau": "fac", "objectif": "Comprendre l'implantation et le disque à deux feuillets.", "sources": {"sorbonne": "UE2 Histo · 1re et 2e semaines du développement", "saclay": "Biologie · Implantation, gastrulation"}, "slides": [{"t": "L'implantation", "p": ["Le trophoblaste envahit la muqueuse de l'utérus, l'**endomètre**.", "Il produit l'**hCG**, une hormone qui maintient le corps jaune. C'est elle que détectent les **tests de grossesse**.", "Une implantation hors de l'utérus, le plus souvent dans la trompe, s'appelle une **grossesse extra-utérine** : c'est une urgence."]}, {"t": "La semaine des deux", "p": ["Le bouton embryonnaire forme un **disque à deux feuillets** : l'**épiblaste** et l'**hypoblaste**.", "Deux cavités apparaissent : la **cavité amniotique** et la **vésicule vitelline**.", "Pour retenir : la 2e semaine est la « **semaine des deux** » (2 feuillets, 2 cavités)."]}], "cours": ["Le trophoblaste s'implante dans l'endomètre et produit l'hCG, l'hormone des tests de grossesse.", "Le disque embryonnaire a 2 feuillets : épiblaste et hypoblaste.", "Deux cavités : amniotique et vésicule vitelline. C'est la semaine des deux."], "paires": [["hCG", "Hormone du test de grossesse"], ["Endomètre", "Muqueuse de l'utérus"], ["Épiblaste", "Feuillet du haut"], ["Hypoblaste", "Feuillet du bas"]], "questions": [{"type": "trou", "q": "L'hormone détectée par un test de grossesse est l'___.", "choices": ["hCG", "insuline", "FSH", "adrénaline"], "answer": 0, "explication": "Elle est produite par le trophoblaste dès l'implantation."}, {"type": "qcm", "q": "À la fin de la 2e semaine, le disque embryonnaire compte :", "choices": ["2 feuillets", "3 feuillets", "1 feuillet", "4 feuillets"], "answer": 0, "explication": "Épiblaste et hypoblaste. Le 3e feuillet apparaît pendant la 3e semaine."}, {"type": "vf", "q": "Une grossesse extra-utérine se développe en dehors de l'utérus.", "answer": true, "explication": "Le plus souvent dans la trompe. Elle peut provoquer une hémorragie grave."}, {"type": "qcm", "q": "Quelles sont les deux cavités qui apparaissent pendant la 2e semaine ?", "choices": ["La cavité amniotique et la vésicule vitelline", "Les deux ventricules", "L'estomac et l'intestin", "Les deux poumons"], "answer": 0, "explication": "La cavité amniotique contiendra le liquide dans lequel baigne le fœtus."}]}, {"id": "embryo-6", "titre": "La gastrulation", "niveau": "fac", "objectif": "Connaître les 3 feuillets et ce qu'ils deviennent.", "sources": {"sorbonne": "UE2 BioDev · Gastrulation, 3e semaine", "saclay": "Biologie · Implantation, gastrulation, neurulation"}, "slides": [{"t": "Trois feuillets", "p": ["Pendant la **3e semaine**, une gouttière apparaît sur l'épiblaste : la **ligne primitive**.", "Des cellules migrent à travers cette ligne : c'est la **gastrulation**.", "L'embryon devient **tridermique** : **ectoderme** (dehors), **mésoderme** (milieu) et **endoderme** (dedans)."]}, {"t": "Qui devient quoi ?", "p": ["**Ectoderme** : la **peau** (épiderme) et tout le **système nerveux**.", "**Mésoderme** : **muscles**, **os**, **cœur**, **vaisseaux**, **sang**, **reins**.", "**Endoderme** : le revêtement du **tube digestif**, les **poumons**, le **foie** et le **pancréas**."]}], "cours": ["La gastrulation a lieu pendant la 3e semaine, à partir de la ligne primitive.", "Elle donne 3 feuillets : ectoderme, mésoderme, endoderme.", "Ecto : peau et nerfs. Méso : muscles, os, cœur, sang. Endo : tube digestif, poumons, foie."], "paires": [["Ectoderme", "Peau et système nerveux"], ["Mésoderme", "Muscles, os, cœur"], ["Endoderme", "Tube digestif, poumons"], ["Ligne primitive", "Départ de la gastrulation"]], "questions": [{"type": "qcm", "q": "De quel feuillet vient le système nerveux ?", "choices": ["L'ectoderme", "Le mésoderme", "L'endoderme", "Le trophoblaste"], "answer": 0, "explication": "C'est le même feuillet que la peau."}, {"type": "trou", "q": "Le cœur et les vaisseaux viennent du ___.", "choices": ["mésoderme", "ectoderme", "endoderme", "hypoblaste"], "answer": 0, "explication": "Le cœur commence d'ailleurs à battre vers le 22e jour."}, {"type": "vf", "q": "Les poumons viennent de l'endoderme.", "answer": true, "explication": "Ils naissent d'un bourgeon du tube digestif primitif."}, {"type": "qcm", "q": "Pendant quelle semaine a lieu la gastrulation ?", "choices": ["La 3e", "La 1re", "La 2e", "La 8e"], "answer": 0, "explication": "C'est aussi une période où l'embryon est très sensible aux toxiques."}]}, {"id": "embryo-7", "titre": "La neurulation", "niveau": "fac", "objectif": "Comprendre la formation du tube neural.", "sources": {"sorbonne": "UE2 BioDev · Neurulation, crêtes neurales", "saclay": "Biologie · Implantation, gastrulation, neurulation"}, "slides": [{"t": "Du plancher au tube", "p": ["Pendant les **3e et 4e semaines**, l'ectoderme situé au-dessus de la **chorde** s'épaissit en **plaque neurale**.", "Ses bords se soulèvent, forment une **gouttière**, puis se referment en **tube neural**.", "Le tube neural donnera l'**encéphale** (en haut) et la **moelle spinale**."]}, {"t": "Quand ça se ferme mal", "p": ["Un défaut de fermeture donne une **anomalie du tube neural** : le **spina bifida** en bas, l'**anencéphalie** en haut.", "Un apport suffisant en **acide folique** (vitamine B9) avant et au début de la grossesse **réduit fortement** ce risque.", "Des cellules du bord de la gouttière, les **crêtes neurales**, migrent et forment de nombreux tissus : ganglions nerveux, cellules pigmentaires de la peau…"]}], "cours": ["La plaque neurale se creuse en gouttière puis se ferme en tube neural (semaines 3-4).", "Le tube neural donne l'encéphale et la moelle spinale.", "L'acide folique réduit le risque de spina bifida. Les crêtes neurales migrent dans tout le corps."], "paires": [["Tube neural", "Futur système nerveux central"], ["Spina bifida", "Défaut de fermeture en bas"], ["Acide folique", "Vitamine B9 protectrice"], ["Crêtes neurales", "Cellules qui migrent"]], "questions": [{"type": "trou", "q": "La vitamine donnée avant la grossesse pour prévenir le spina bifida est l'acide ___.", "choices": ["folique", "ascorbique", "lactique", "citrique"], "answer": 0, "explication": "C'est la vitamine B9. On la conseille dès le projet de grossesse."}, {"type": "qcm", "q": "Le tube neural donnera :", "choices": ["L'encéphale et la moelle spinale", "Le cœur", "Le tube digestif", "Les reins"], "answer": 0, "explication": "C'est l'ébauche de tout le système nerveux central."}, {"type": "vf", "q": "Les cellules des crêtes neurales restent toutes dans le tube neural.", "answer": false, "explication": "Au contraire, elles migrent dans tout l'embryon et forment beaucoup de tissus différents."}, {"type": "qcm", "q": "Le spina bifida est une anomalie de fermeture :", "choices": ["De la partie basse du tube neural", "Du cœur", "Du palais", "De la trompe utérine"], "answer": 0, "explication": "La moelle et ses enveloppes peuvent alors être exposées dans le bas du dos."}]}, {"id": "embryo-8", "titre": "Le placenta", "niveau": "pont", "objectif": "Comprendre le rôle du placenta et du cordon.", "sources": {"sorbonne": "UE2 BioDev · Vasculogenèse et délimitation", "saclay": "Biologie · Implantation, gastrulation"}, "slides": [{"t": "L'organe d'échange", "p": ["Il se forme à partir du **trophoblaste** et de la muqueuse de l'utérus.", "Le sang de la mère et celui du fœtus **ne se mélangent pas** : ils échangent à travers une fine barrière.", "Il apporte **O₂ et nutriments**, évacue **CO₂ et déchets**, et fabrique des **hormones**."]}, {"t": "Une barrière imparfaite", "p": ["Le **cordon ombilical** relie le fœtus au placenta : il contient 2 artères et 1 veine.", "Certaines substances traversent le placenta : **alcool**, composés du **tabac**, certains **médicaments** et virus. D'où la règle : zéro alcool pendant la grossesse.", "Des **anticorps** de la mère (les IgG) passent aussi et protègent le bébé pendant ses premiers mois."]}], "cours": ["Le placenta vient du trophoblaste. Les sangs de la mère et du fœtus ne se mélangent pas.", "Il assure les échanges (O₂, nutriments, déchets) et fabrique des hormones.", "Le cordon a 2 artères et 1 veine. Alcool, tabac et certains médicaments traversent."], "paires": [["Cordon ombilical", "2 artères et 1 veine"], ["Placenta", "Organe d'échange"], ["IgG", "Anticorps qui traversent"], ["Alcool", "Toxique qui traverse"]], "questions": [{"type": "vf", "q": "Le sang de la mère et celui du fœtus se mélangent dans le placenta.", "answer": false, "explication": "Ils sont séparés par une fine barrière, à travers laquelle se font les échanges."}, {"type": "qcm", "q": "Combien de vaisseaux contient le cordon ombilical ?", "choices": ["3 : 2 artères et 1 veine", "2 : 1 artère et 1 veine", "1 artère", "4 : 2 artères et 2 veines"], "answer": 0, "explication": "La veine ombilicale apporte au fœtus le sang riche en oxygène."}, {"type": "trou", "q": "Les anticorps de la mère qui traversent le placenta sont des ___.", "choices": ["IgG", "IgA", "IgM", "IgE"], "answer": 0, "explication": "Ils protègent le nouveau-né pendant ses premiers mois."}, {"type": "qcm", "q": "Pourquoi recommande-t-on zéro alcool pendant la grossesse ?", "choices": ["L'alcool traverse le placenta et est toxique pour le fœtus", "L'alcool bouche le cordon", "L'alcool arrête le placenta", "Ce n'est qu'une précaution sans fondement"], "answer": 0, "explication": "L'alcool peut provoquer des malformations et des troubles du développement du cerveau."}]}]}, {"id": "biophy", "titre": "L'eau, les ions et les ondes", "matiere": "Biophysique", "lycee": "Physique-chimie : solutions, ondes, radioactivité", "lecons": [{"id": "biophy-1", "titre": "Moles et osmoles", "niveau": "pont", "objectif": "Passer des moles aux osmoles.", "sources": {"sorbonne": "UE3 Biophysique · Solutions", "saclay": "Biophysique · États de la matière"}, "slides": [{"t": "Molarité et molalité", "p": ["La **molarité** est le nombre de moles de soluté par **litre de solution** (mol/L).", "La **molalité** est le nombre de moles par **kilogramme de solvant** (mol/kg). Pour l'eau, les deux sont proches.", "Une **mole**, c'est 6,02 × 10²³ entités : le nombre d'Avogadro."]}, {"t": "L'osmolarité", "p": ["L'**osmolarité** compte **toutes les particules** dissoutes, pas seulement les molécules.", "Le glucose ne se dissocie pas : 1 mol donne **1 osmole**. NaCl donne Na⁺ + Cl⁻ : 1 mol donne **2 osmoles**.", "L'osmolarité du plasma est d'environ **300 mOsm/L**. Le **sérum physiologique** (NaCl à 9 g/L) a la même : il est **isotonique**."]}], "cours": ["La molarité compte les moles par litre de solution.", "L'osmolarité compte toutes les particules : NaCl donne 2 osmoles par mole.", "Le plasma est à environ 300 mOsm/L, comme le sérum physiologique (NaCl 9 g/L)."], "paires": [["Molarité", "mol par litre de solution"], ["Osmolarité", "Particules par litre"], ["NaCl 9 g/L", "Sérum physiologique"], ["300 mOsm/L", "Plasma"]], "questions": [{"type": "qcm", "q": "Une solution de CaCl₂ à 1 mmol/L a une osmolarité d'environ :", "choices": ["3 mOsm/L", "1 mOsm/L", "2 mOsm/L", "6 mOsm/L"], "answer": 0, "explication": "CaCl₂ donne Ca²⁺ + 2 Cl⁻, soit 3 particules."}, {"type": "trou", "q": "Le sérum physiologique contient du NaCl à ___.", "choices": ["9 g/L", "90 g/L", "0,9 g/L", "1 g/L"], "answer": 0, "explication": "On dit aussi NaCl à 0,9 %. Il est isotonique au plasma."}, {"type": "vf", "q": "1 mole de glucose dissoute donne 2 osmoles.", "answer": false, "explication": "Le glucose ne se dissocie pas : 1 mole donne 1 osmole."}, {"type": "qcm", "q": "L'osmolarité du plasma est d'environ :", "choices": ["300 mOsm/L", "30 mOsm/L", "3 000 mOsm/L", "7,4 mOsm/L"], "answer": 0, "explication": "Elle est surtout due au sodium et à ses anions."}]}, {"id": "biophy-2", "titre": "Les compartiments liquidiens", "niveau": "pont", "objectif": "Savoir où se trouve l'eau du corps.", "sources": {"sorbonne": "UE3 Biophysique · Compartiments liquidiens de l'organisme", "saclay": "Biophysique · Milieu intérieur"}, "slides": [{"t": "60 % d'eau", "p": ["L'eau représente environ **60 % du poids** d'un adulte : un peu moins chez la femme et la personne âgée, plus chez le nourrisson.", "Les **2/3** sont **dans les cellules** (secteur intracellulaire), **1/3** en dehors (secteur extracellulaire).", "Le secteur extracellulaire se divise en **liquide interstitiel**, entre les cellules (3/4), et **plasma** (1/4)."]}, {"t": "Des compositions différentes", "p": ["Dehors, le cation principal est le **sodium** (Na⁺, environ 140 mmol/L).", "Dedans, c'est le **potassium** (K⁺, environ 150 mmol/L).", "Cette différence est entretenue par la **pompe Na⁺/K⁺**. Elle est à la base de l'excitabilité des neurones et du cœur."]}], "cours": ["L'eau fait environ 60 % du poids d'un adulte.", "2/3 dans les cellules, 1/3 dehors (dont 1/4 de plasma).", "Na⁺ domine dehors, K⁺ domine dedans, grâce à la pompe Na⁺/K⁺."], "paires": [["Intracellulaire", "2/3 de l'eau"], ["Extracellulaire", "1/3 de l'eau"], ["Na⁺", "Cation du dehors"], ["K⁺", "Cation du dedans"]], "questions": [{"type": "qcm", "q": "Un homme de 70 kg contient environ combien de litres d'eau ?", "choices": ["42 L", "7 L", "70 L", "20 L"], "answer": 0, "explication": "60 % de 70 kg = 42 kg, soit environ 42 litres."}, {"type": "trou", "q": "Le principal cation à l'intérieur des cellules est le ___.", "choices": ["potassium", "sodium", "calcium", "chlore"], "answer": 0, "explication": "Environ 150 mmol/L dedans, contre 4 à 5 mmol/L dans le plasma."}, {"type": "vf", "q": "La plus grande partie de l'eau du corps se trouve dans le plasma.", "answer": false, "explication": "Le plasma ne représente qu'environ 1/12 de l'eau totale. La majorité est dans les cellules."}, {"type": "qcm", "q": "La kaliémie normale (K⁺ dans le plasma) est d'environ :", "choices": ["4 mmol/L", "140 mmol/L", "40 mmol/L", "0,4 mmol/L"], "answer": 0, "explication": "Entre 3,5 et 5 mmol/L. De petits écarts peuvent déjà perturber le rythme du cœur."}]}, {"id": "biophy-3", "titre": "Diffusion et osmose", "niveau": "pont", "objectif": "Distinguer diffusion et osmose.", "sources": {"sorbonne": "UE3 Biophysique · Transports transmembranaires", "saclay": "Biophysique · Biophysique des membranes"}, "slides": [{"t": "La diffusion", "p": ["Les molécules dissoutes se déplacent spontanément des zones **concentrées** vers les zones **diluées**.", "La **loi de Fick** dit que le flux est proportionnel à la **différence de concentration** et à la **surface** d'échange.", "C'est ainsi que l'O₂ passe des alvéoles vers le sang."]}, {"t": "L'osmose", "p": ["Quand une membrane laisse passer l'**eau** mais pas le soluté, c'est **l'eau qui se déplace**, vers le compartiment le plus concentré.", "Un globule rouge dans l'eau pure **gonfle et éclate** (hémolyse). Dans une solution trop salée, il se **ratatine**.", "D'où l'intérêt des perfusions **isotoniques**."]}], "cours": ["Diffusion : le soluté va du plus concentré vers le moins concentré (loi de Fick).", "Osmose : l'eau va vers le compartiment le plus concentré.", "Un globule rouge éclate en milieu hypotonique et se ratatine en milieu hypertonique."], "paires": [["Diffusion", "Le soluté se déplace"], ["Osmose", "L'eau se déplace"], ["Hypotonique", "Le globule gonfle"], ["Hypertonique", "Le globule se ratatine"]], "questions": [{"type": "qcm", "q": "On place un globule rouge dans de l'eau pure. Il :", "choices": ["Gonfle et peut éclater", "Se ratatine", "Ne change pas", "Se divise"], "answer": 0, "explication": "L'eau entre par osmose vers l'intérieur, plus concentré."}, {"type": "trou", "q": "Pendant l'osmose, l'eau se déplace vers le compartiment le plus ___.", "choices": ["concentré", "dilué", "froid", "grand"], "answer": 0, "explication": "Elle « dilue » le côté le plus concentré."}, {"type": "vf", "q": "Selon la loi de Fick, plus la surface d'échange est grande, plus la diffusion est importante.", "answer": true, "explication": "C'est pour ça que les alvéoles et les villosités intestinales ont une surface immense."}, {"type": "qcm", "q": "Une perfusion très hypotonique en grande quantité risquerait de :", "choices": ["Faire gonfler les cellules", "Faire ratatiner les cellules", "N'avoir aucun effet", "Augmenter le pH"], "answer": 0, "explication": "L'eau entrerait dans les cellules. C'est dangereux notamment pour le cerveau (œdème cérébral)."}]}, {"id": "biophy-4", "titre": "Pressions osmotique et oncotique", "niveau": "fac", "objectif": "Comprendre les forces qui déplacent l'eau entre sang et tissus.", "sources": {"sorbonne": "UE3 Biophysique · Propriétés colligatives des solutions", "saclay": "Biophysique · Filtration, équilibre de Donnan"}, "slides": [{"t": "La pression osmotique", "p": ["C'est la pression qu'il faudrait appliquer pour **empêcher** l'osmose.", "**Loi de van 't Hoff** : π = R × T × osmolarité. Elle ne dépend que du **nombre de particules**, pas de leur nature.", "C'est une **propriété colligative**, comme l'abaissement du point de congélation."]}, {"t": "Les échanges dans les capillaires", "p": ["La paroi des capillaires laisse passer l'eau et les petites molécules, mais **pas les protéines**.", "Les protéines du plasma, surtout l'**albumine**, retiennent l'eau : c'est la **pression oncotique**.", "Si l'albumine baisse (dénutrition, maladie du foie), l'eau fuit dans les tissus : ce sont des **œdèmes**."]}], "cours": ["La pression osmotique dépend du nombre de particules (loi de van 't Hoff).", "L'albumine du plasma retient l'eau dans les vaisseaux : c'est la pression oncotique.", "Moins d'albumine, c'est plus d'œdèmes."], "paires": [["Albumine", "Retient l'eau dans le sang"], ["Œdème", "Eau dans les tissus"], ["van 't Hoff", "Loi de la pression osmotique"], ["Colligative", "Dépend du nombre de particules"]], "questions": [{"type": "trou", "q": "La protéine du plasma qui crée l'essentiel de la pression oncotique est l'___.", "choices": ["albumine", "hémoglobine", "insuline", "kératine"], "answer": 0, "explication": "Elle est fabriquée par le foie."}, {"type": "qcm", "q": "Une baisse importante de l'albumine dans le sang peut provoquer :", "choices": ["Des œdèmes", "Une hypertension", "Une fièvre", "Une hausse du pH"], "answer": 0, "explication": "L'eau n'est plus assez retenue dans les vaisseaux et passe dans les tissus."}, {"type": "vf", "q": "La pression osmotique dépend de la nature des particules dissoutes.", "answer": false, "explication": "Elle ne dépend que de leur nombre : c'est une propriété colligative."}, {"type": "qcm", "q": "Selon la loi de van 't Hoff, si l'osmolarité double, la pression osmotique :", "choices": ["Double", "Ne change pas", "Est divisée par deux", "Est multipliée par quatre"], "answer": 0, "explication": "π = R × T × osmolarité : la relation est proportionnelle."}]}, {"id": "biophy-5", "titre": "Le potentiel de repos", "niveau": "fac", "objectif": "Comprendre pourquoi l'intérieur de la cellule est négatif.", "sources": {"sorbonne": "UE3 Biophysique · Électrophysiologie cellulaire 1", "saclay": "Biophysique · Équilibre de Nernst"}, "slides": [{"t": "Une pile microscopique", "p": ["Au repos, l'intérieur d'une cellule est **négatif** par rapport à l'extérieur : environ **−70 mV** pour un neurone, **−90 mV** pour une cellule du cœur.", "C'est le **potentiel de repos**.", "Il vient surtout de la **fuite de K⁺** vers l'extérieur, par des canaux ouverts en permanence."]}, {"t": "L'équation de Nernst", "p": ["Le K⁺ sort selon son gradient de concentration, mais l'intérieur devient négatif et le retient.", "Quand les deux forces s'équilibrent, on atteint le **potentiel d'équilibre** de l'ion, donné par l'**équation de Nernst**.", "Pour le K⁺, il est d'environ **−90 mV**. Pour le Na⁺, d'environ **+60 mV**."]}], "cours": ["Au repos, l'intérieur de la cellule est négatif (environ −70 mV pour un neurone).", "Ce potentiel vient surtout de la fuite de K⁺ vers l'extérieur.", "L'équation de Nernst donne le potentiel d'équilibre d'un ion : environ −90 mV pour K⁺, +60 mV pour Na⁺."], "paires": [["−70 mV", "Repos d'un neurone"], ["K⁺", "Fuit vers l'extérieur"], ["Nernst", "Potentiel d'équilibre"], ["+60 mV", "Équilibre du Na⁺"]], "questions": [{"type": "qcm", "q": "Au repos, l'intérieur d'un neurone est :", "choices": ["Négatif, environ −70 mV", "Positif, environ +70 mV", "Neutre", "Négatif, environ −7 V"], "answer": 0, "explication": "La différence est petite en volts, mais énorme à l'échelle d'une membrane de quelques nanomètres."}, {"type": "trou", "q": "Le potentiel de repos est surtout dû à la fuite d'ions ___.", "choices": ["potassium", "sodium", "calcium", "chlorure"], "answer": 0, "explication": "Les canaux K⁺ de fuite sont ouverts en permanence."}, {"type": "vf", "q": "Une hausse importante du K⁺ dans le sang peut perturber le rythme cardiaque.", "answer": true, "explication": "Elle modifie le potentiel de repos des cellules du cœur. C'est pour ça qu'on surveille la kaliémie."}, {"type": "qcm", "q": "Quel est le potentiel d'équilibre approximatif du sodium ?", "choices": ["+60 mV", "−90 mV", "0 mV", "−70 mV"], "answer": 0, "explication": "Le Na⁺ est bien plus concentré dehors : il tend à entrer et à rendre l'intérieur positif."}]}, {"id": "biophy-6", "titre": "Le potentiel d'action", "niveau": "pont", "objectif": "Décrire le message nerveux.", "sources": {"sorbonne": "UE3 Biophysique · Électrophysiologie cellulaire 2", "saclay": "Biophysique · Potentiel d'action"}, "slides": [{"t": "Le déclenchement", "p": ["Si la membrane est assez dépolarisée pour atteindre le **seuil** (environ −55 mV), un **potentiel d'action** se déclenche.", "Des canaux Na⁺ s'ouvrent : le Na⁺ entre et l'intérieur devient positif (**dépolarisation**, jusqu'à environ +30 mV).", "Puis des canaux K⁺ s'ouvrent : le K⁺ sort et le potentiel redescend (**repolarisation**)."]}, {"t": "La propagation", "p": ["C'est la loi du **tout ou rien** : un potentiel d'action a toujours la même amplitude. L'intensité du message est codée par la **fréquence**.", "Juste après, la zone est **réfractaire** : le message ne peut pas repartir en arrière.", "La **myéline** isole l'axone : le potentiel d'action saute d'un nœud de Ranvier au suivant, jusqu'à environ **100 m/s**."]}], "cours": ["Au seuil, les canaux Na⁺ s'ouvrent : dépolarisation. Puis le K⁺ sort : repolarisation.", "Tout ou rien : l'intensité est codée par la fréquence des potentiels d'action.", "La myéline accélère la conduction, par sauts entre les nœuds de Ranvier."], "paires": [["Dépolarisation", "Entrée de Na⁺"], ["Repolarisation", "Sortie de K⁺"], ["Myéline", "Accélère la conduction"], ["Période réfractaire", "Empêche le retour"]], "questions": [{"type": "qcm", "q": "Comment un neurone code-t-il un stimulus plus intense ?", "choices": ["Par une fréquence plus élevée de potentiels d'action", "Par des potentiels d'action plus grands", "Par des potentiels d'action plus longs", "Il ne peut pas"], "answer": 0, "explication": "L'amplitude est toujours la même (tout ou rien) : seule la fréquence change."}, {"type": "trou", "q": "La phase où le Na⁺ entre dans la cellule s'appelle la ___.", "choices": ["dépolarisation", "repolarisation", "hyperpolarisation", "myélinisation"], "answer": 0, "explication": "L'intérieur devient brièvement positif."}, {"type": "vf", "q": "La sclérose en plaques abîme la myéline.", "answer": true, "explication": "La conduction des messages nerveux ralentit ou se bloque, d'où des troubles variés."}, {"type": "qcm", "q": "Pourquoi le potentiel d'action ne repart-il pas en arrière ?", "choices": ["La zone qu'il vient de quitter est réfractaire", "La myéline le bloque", "Le neurone meurt", "Le sodium est épuisé"], "answer": 0, "explication": "Les canaux Na⁺ qui viennent de s'ouvrir sont temporairement inactivés."}, {"type": "pointe", "model": "neurone", "target": ["ranvier"], "q": "Touche un nœud de Ranvier.", "explication": "Ce sont les petits espaces entre deux manchons de myéline : le potentiel d'action saute de l'un à l'autre."}]}, {"id": "biophy-7", "titre": "L'électrocardiogramme", "niveau": "pont", "objectif": "Lire les grandes ondes d'un ECG.", "sources": {"sorbonne": "UE3 Biophysique · ECG", "saclay": "Biophysique · Électrocinétique"}, "slides": [{"t": "Le chef d'orchestre", "p": ["Le battement démarre dans le **nœud sinusal**, dans l'atrium droit : c'est le pacemaker naturel.", "L'influx traverse les atriums, marque une pause dans le **nœud atrio-ventriculaire**, puis descend par le **faisceau de His** vers les ventricules.", "Un rythme normal, piloté par le nœud sinusal, s'appelle le **rythme sinusal**."]}, {"t": "Les ondes de l'ECG", "p": ["L'**onde P** : dépolarisation des atriums.", "Le **complexe QRS** : dépolarisation des ventricules. Il est grand parce que les ventricules ont beaucoup de muscle.", "L'**onde T** : repolarisation des ventricules. La fréquence cardiaque se mesure entre deux QRS."]}], "cours": ["Le nœud sinusal donne le rythme : c'est le rythme sinusal.", "L'influx passe par le nœud atrio-ventriculaire puis le faisceau de His.", "ECG : P = atriums, QRS = ventricules (dépolarisation), T = repolarisation des ventricules."], "paires": [["Onde P", "Dépolarisation des atriums"], ["QRS", "Dépolarisation des ventricules"], ["Onde T", "Repolarisation des ventricules"], ["Nœud sinusal", "Pacemaker naturel"]], "questions": [{"type": "qcm", "q": "Que représente le complexe QRS ?", "choices": ["La dépolarisation des ventricules", "La dépolarisation des atriums", "La repolarisation des atriums", "La fermeture des valves"], "answer": 0, "explication": "La repolarisation des atriums existe aussi, mais elle est cachée dans le QRS."}, {"type": "trou", "q": "Le pacemaker naturel du cœur est le nœud ___.", "choices": ["sinusal", "atrio-ventriculaire", "lymphatique", "de Ranvier"], "answer": 0, "explication": "Il est situé dans la paroi de l'atrium droit."}, {"type": "qcm", "q": "Sur un ECG, il y a 1 seconde entre deux QRS. La fréquence cardiaque est de :", "choices": ["60 battements par minute", "100 battements par minute", "1 battement par minute", "120 battements par minute"], "answer": 0, "explication": "1 battement par seconde × 60 secondes = 60 par minute."}, {"type": "vf", "q": "L'onde T correspond à la contraction des atriums.", "answer": false, "explication": "L'onde T correspond à la repolarisation des ventricules. Les atriums, c'est l'onde P."}, {"type": "pointe", "model": "ecg", "target": ["qrs"], "q": "Touche le complexe QRS.", "explication": "C'est le grand pic étroit : la dépolarisation des ventricules, qui ont beaucoup de muscle."}]}, {"id": "biophy-8", "titre": "Rayonnements et imagerie", "niveau": "pont", "objectif": "Relier la physique aux examens d'imagerie.", "sources": {"sorbonne": "UE3 Biophysique · Éléments de physique pour la biophysique", "saclay": "Biophysique · Rayonnements ionisants, optique"}, "slides": [{"t": "Rayonnements ionisants", "p": ["Les **rayons X** et **gamma** ont assez d'énergie pour arracher des électrons : ils sont **ionisants** et peuvent abîmer l'ADN.", "**Radioactivité** : un noyau instable se désintègre. La **demi-vie** est le temps au bout duquel la moitié des noyaux se sont désintégrés.", "On limite les doses : c'est la **radioprotection**. La dose efficace s'exprime en **sieverts** (Sv)."]}, {"t": "Les examens", "p": ["**Radiographie** et **scanner** : des rayons X traversent le corps, plus ou moins absorbés selon les tissus. L'os en absorbe beaucoup.", "**Échographie** : des **ultrasons** qui rebondissent sur les organes. Pas de rayonnement ionisant, idéal pendant la grossesse.", "**IRM** : un **champ magnétique** et des ondes radio font « résonner » les protons de l'eau. Pas de rayons X non plus."]}], "cours": ["Rayons X et gamma sont ionisants : on limite les doses, exprimées en sieverts.", "La demi-vie est le temps pour que la moitié des noyaux radioactifs se désintègrent.", "Radio et scanner : rayons X. Échographie : ultrasons. IRM : champ magnétique."], "paires": [["Échographie", "Ultrasons"], ["IRM", "Champ magnétique"], ["Scanner", "Rayons X"], ["Sievert", "Unité de dose"]], "questions": [{"type": "qcm", "q": "Quel examen utilise des ultrasons ?", "choices": ["L'échographie", "Le scanner", "La radiographie", "La scintigraphie"], "answer": 0, "explication": "C'est pour ça qu'on l'utilise pour suivre la grossesse : pas de rayonnement ionisant."}, {"type": "trou", "q": "Le temps au bout duquel la moitié des noyaux radioactifs se sont désintégrés s'appelle la ___.", "choices": ["demi-vie", "période réfractaire", "clairance", "latence"], "answer": 0, "explication": "Pour l'iode 131, elle est d'environ 8 jours."}, {"type": "vf", "q": "L'IRM utilise des rayons X.", "answer": false, "explication": "Elle utilise un champ magnétique puissant et des ondes radio."}, {"type": "qcm", "q": "Un produit radioactif a une demi-vie de 6 heures. Au bout de 12 heures, il en reste :", "choices": ["Un quart", "La moitié", "Rien", "Un huitième"], "answer": 0, "explication": "6 h : la moitié. 12 h : la moitié de la moitié, soit un quart."}]}]}, {"id": "physio", "titre": "Le corps en action", "matiere": "Physiologie", "lycee": "SVT : glycémie, système nerveux, effort (1re et Tle)", "lecons": [{"id": "physio-1", "titre": "L'homéostasie", "niveau": "lycee", "objectif": "Comprendre comment le corps garde ses constantes stables.", "sources": {"sorbonne": "UE3 Physiologie · Organisation du système cardiovasculaire", "saclay": "Biophysique · Milieu intérieur, thermorégulation"}, "slides": [{"t": "Le milieu intérieur", "p": ["Nos cellules baignent dans un **milieu intérieur**, le liquide extracellulaire, dont la composition doit rester stable.", "L'**homéostasie** est l'ensemble des mécanismes qui maintiennent ces **constantes** : température, glycémie, pH, pression artérielle…", "L'idée vient de **Claude Bernard**, un physiologiste français du XIXe siècle."]}, {"t": "La boucle de régulation", "p": ["Un **capteur** mesure la variable, un **centre** (souvent l'hypothalamus) la compare à une valeur de consigne, un **effecteur** la corrige.", "C'est un **rétrocontrôle négatif** : l'effet s'oppose à l'écart. Exemple : on transpire quand la température monte.", "Le **rétrocontrôle positif** amplifie au contraire le phénomène, comme les contractions de l'accouchement."]}], "cours": ["L'homéostasie maintient stables les constantes du milieu intérieur.", "Une régulation associe un capteur, un centre et un effecteur.", "Rétrocontrôle négatif : on corrige l'écart. Positif : on l'amplifie (accouchement)."], "paires": [["Capteur", "Mesure la variable"], ["Effecteur", "Corrige l'écart"], ["Rétrocontrôle négatif", "S'oppose à l'écart"], ["Claude Bernard", "Milieu intérieur"]], "questions": [{"type": "qcm", "q": "Quand la température du corps monte, on transpire. C'est un exemple de :", "choices": ["Rétrocontrôle négatif", "Rétrocontrôle positif", "Réflexe myotatique", "Mutation"], "answer": 0, "explication": "La sueur qui s'évapore refroidit le corps : l'effet s'oppose à l'écart."}, {"type": "trou", "q": "Le centre de nombreuses régulations (température, soif, faim) est l'___.", "choices": ["hypothalamus", "hippocampe", "estomac", "cervelet"], "answer": 0, "explication": "C'est une petite région à la base du cerveau, reliée à l'hypophyse."}, {"type": "vf", "q": "Les contractions de l'accouchement sont un exemple de rétrocontrôle positif.", "answer": true, "explication": "Les contractions entraînent la libération d'ocytocine, qui renforce les contractions, jusqu'à la naissance."}, {"type": "qcm", "q": "Quelle est la température centrale normale du corps ?", "choices": ["Environ 37 °C", "Environ 35 °C", "Environ 39 °C", "Environ 40 °C"], "answer": 0, "explication": "Elle varie un peu dans la journée, entre environ 36,5 et 37,5 °C."}]}, {"id": "physio-2", "titre": "Le cycle cardiaque", "niveau": "pont", "objectif": "Décrire la systole et la diastole.", "sources": {"sorbonne": "UE3 Physiologie · Introduction à la physiologie cardiovasculaire", "saclay": "Biophysique · Hémodynamique"}, "slides": [{"t": "La systole", "p": ["La **systole** est la phase de **contraction** des ventricules. C'est aussi le nom de cette app.", "Quand la pression monte, les valves **mitrale** et **tricuspide** se ferment : c'est le 1er bruit, « boum ».", "Puis les valves **aortique** et **pulmonaire** s'ouvrent et le sang est éjecté."]}, {"t": "La diastole", "p": ["La **diastole** est la phase de **relâchement** et de remplissage des ventricules.", "Les valves aortique et pulmonaire se ferment (2e bruit, « tac »), puis les valves mitrale et tricuspide s'ouvrent.", "Au repos, la diastole dure plus longtemps que la systole. C'est pendant la diastole que le muscle cardiaque lui-même est le mieux irrigué."]}], "cours": ["Systole : les ventricules se contractent et éjectent le sang.", "Diastole : ils se relâchent et se remplissent.", "1er bruit : fermeture mitrale et tricuspide. 2e bruit : fermeture aortique et pulmonaire."], "paires": [["Systole", "Contraction"], ["Diastole", "Remplissage"], ["1er bruit", "Fermeture mitrale et tricuspide"], ["2e bruit", "Fermeture aortique et pulmonaire"]], "questions": [{"type": "trou", "q": "La phase de contraction des ventricules s'appelle la ___.", "choices": ["systole", "diastole", "syncope", "dialyse"], "answer": 0, "explication": "C'est elle qui donne son nom à l'app."}, {"type": "qcm", "q": "Le 2e bruit du cœur correspond à la fermeture des valves :", "choices": ["Aortique et pulmonaire", "Mitrale et tricuspide", "Des veines caves", "Des atriums"], "answer": 0, "explication": "Il marque la fin de l'éjection et le début de la diastole."}, {"type": "vf", "q": "Au repos, la diastole dure plus longtemps que la systole.", "answer": true, "explication": "Environ 2/3 du cycle au repos. Quand le cœur accélère, c'est surtout la diastole qui raccourcit."}, {"type": "qcm", "q": "Pendant la systole, que font les valves aortique et pulmonaire ?", "choices": ["Elles s'ouvrent pour laisser sortir le sang", "Elles restent fermées", "Elles produisent le 1er bruit", "Elles se contractent"], "answer": 0, "explication": "Elles s'ouvrent dès que la pression dans les ventricules dépasse celle des artères."}, {"type": "pointe", "model": "coeur", "target": ["aorte"], "q": "Pendant la systole, le ventricule gauche éjecte le sang dans une grosse artère. Touche-la.", "explication": "C'est l'aorte : elle monte, forme une crosse, puis redescend dans le thorax."}]}, {"id": "physio-3", "titre": "Débit et pression artérielle", "niveau": "pont", "objectif": "Calculer un débit cardiaque et lire une tension.", "sources": {"sorbonne": "UE3 Physiologie · Adaptations de l'apport en O₂", "saclay": "Biophysique · Hémodynamique"}, "slides": [{"t": "Le débit cardiaque", "p": ["**Débit cardiaque = fréquence cardiaque × volume d'éjection systolique**.", "Au repos : environ 70 battements/min × 70 mL, soit environ **5 L/min**. Tout le sang fait donc le tour du corps en environ une minute.", "À l'effort, il peut être multiplié par 4 à 5 chez un sportif."]}, {"t": "La pression artérielle", "p": ["On la note en **mmHg**, par exemple **120/80 mmHg**. Les médecins disent souvent « 12/8 », en centimètres de mercure.", "Le premier chiffre est la pression **systolique** (maximale), le second la **diastolique** (minimale).", "On parle d'**hypertension** à partir de **140/90 mmHg** au cabinet. Elle abîme les vaisseaux sans donner de symptômes."]}], "cours": ["Débit cardiaque = fréquence × volume d'éjection, environ 5 L/min au repos.", "La pression artérielle s'écrit systolique/diastolique, par exemple 120/80 mmHg.", "Hypertension à partir de 140/90 mmHg : silencieuse mais dangereuse."], "paires": [["5 L/min", "Débit au repos"], ["120 mmHg", "Pression systolique"], ["80 mmHg", "Pression diastolique"], ["140/90", "Seuil d'hypertension"]], "questions": [{"type": "qcm", "q": "Fréquence 60/min, volume d'éjection 80 mL. Quel est le débit cardiaque ?", "choices": ["4,8 L/min", "480 mL/min", "140 mL/min", "48 L/min"], "answer": 0, "explication": "60 × 80 mL = 4 800 mL/min, soit 4,8 L/min."}, {"type": "trou", "q": "Dans « 120/80 », le chiffre 80 est la pression ___.", "choices": ["diastolique", "systolique", "veineuse", "moyenne"], "answer": 0, "explication": "C'est la pression minimale, pendant la diastole."}, {"type": "vf", "q": "L'hypertension donne presque toujours des symptômes.", "answer": false, "explication": "Elle est le plus souvent silencieuse, d'où l'importance de la mesurer régulièrement."}, {"type": "qcm", "q": "Chez l'adulte, à partir de quelle valeur parle-t-on d'hypertension au cabinet ?", "choices": ["140/90 mmHg", "100/60 mmHg", "120/80 mmHg", "200/120 mmHg"], "answer": 0, "explication": "C'est le seuil utilisé pour une mesure au cabinet médical."}]}, {"id": "physio-4", "titre": "Les échanges respiratoires", "niveau": "pont", "objectif": "Suivre l'oxygène de l'air jusqu'aux cellules.", "sources": {"sorbonne": "UE3 Physiologie · Régulation du CO₂, apport en O₂", "saclay": "Biophysique · Biophysique des membranes"}, "slides": [{"t": "Des alvéoles au sang", "p": ["L'O₂ passe des **alvéoles** vers le sang, et le CO₂ fait le chemin inverse, par **diffusion**.", "La barrière alvéolo-capillaire est très fine (moins d'un micromètre) et sa surface immense.", "Au repos, on respire environ **12 à 20 fois par minute**, à peu près 0,5 L à chaque fois."]}, {"t": "Le transport des gaz", "p": ["Presque tout l'O₂ est transporté par l'**hémoglobine** des globules rouges. Chaque hémoglobine fixe jusqu'à **4 O₂**.", "Le CO₂ voyage surtout sous forme de **bicarbonate** (HCO₃⁻).", "La respiration est commandée par le **tronc cérébral**, qui réagit surtout à la **hausse du CO₂**."]}], "cours": ["O₂ et CO₂ traversent la barrière alvéolo-capillaire par diffusion.", "L'hémoglobine transporte l'O₂ (jusqu'à 4 par molécule). Le CO₂ voyage surtout en bicarbonate.", "Le tronc cérébral commande la respiration, surtout en fonction du CO₂."], "paires": [["Hémoglobine", "Transporte l'O₂"], ["Bicarbonate", "Transporte le CO₂"], ["Tronc cérébral", "Commande la respiration"], ["Alvéole", "Lieu des échanges"]], "questions": [{"type": "qcm", "q": "Combien de molécules d'O₂ une hémoglobine peut-elle fixer ?", "choices": ["4", "1", "2", "100"], "answer": 0, "explication": "Une par chaîne : l'hémoglobine a 4 chaînes, chacune avec un groupe hème contenant du fer."}, {"type": "trou", "q": "Le CO₂ est surtout transporté dans le sang sous forme de ___.", "choices": ["bicarbonate", "glucose", "hémoglobine", "urée"], "answer": 0, "explication": "Il réagit avec l'eau pour donner HCO₃⁻ et H⁺, grâce à une enzyme des globules rouges."}, {"type": "vf", "q": "L'envie de respirer vient surtout de la hausse du CO₂ dans le sang.", "answer": true, "explication": "C'est ce qu'on ressent en apnée : le CO₂ monte bien avant que l'O₂ ne manque."}, {"type": "qcm", "q": "Au repos, un adulte respire environ :", "choices": ["12 à 20 fois par minute", "60 à 100 fois par minute", "2 à 4 fois par minute", "100 fois par minute"], "answer": 0, "explication": "60 à 100, c'est la fréquence cardiaque, pas la fréquence respiratoire."}, {"type": "pointe", "model": "tronc", "target": ["trachee"], "q": "L'air passe par un tube avant de se diviser en deux bronches. Touche-le.", "explication": "C'est la trachée, renforcée par des anneaux de cartilage."}]}, {"id": "physio-5", "titre": "Le rein et l'urine", "niveau": "pont", "objectif": "Comprendre comment le rein fabrique l'urine.", "sources": {"sorbonne": "UE3 Physiologie · Adaptations rénales aux variations de sodium", "saclay": "Anatomie · Appareil urinaire"}, "slides": [{"t": "Le néphron", "p": ["Chaque rein contient environ **1 million de néphrons**, les unités qui fabriquent l'urine.", "Dans le **glomérule**, le sang est **filtré** : environ **180 L** de liquide par jour.", "Les **tubules** **réabsorbent** l'essentiel de l'eau, du glucose et des sels. Il ne reste qu'environ **1,5 L** d'urine."]}, {"t": "Les rôles du rein", "p": ["Il élimine les **déchets** : urée, créatinine, médicaments.", "Il règle l'**eau**, le **sodium**, le **potassium** et le **pH** du sang.", "Il fabrique aussi l'**EPO**, une hormone qui stimule la production de globules rouges, et il active la **vitamine D**."]}], "cours": ["Le néphron filtre le sang dans le glomérule (180 L par jour), puis réabsorbe presque tout.", "Il reste environ 1,5 L d'urine par jour.", "Le rein élimine les déchets, règle l'eau, les sels et le pH, et fabrique l'EPO."], "paires": [["Glomérule", "Filtre le sang"], ["Tubule", "Réabsorbe"], ["EPO", "Stimule les globules rouges"], ["Créatinine", "Déchet surveillé"]], "questions": [{"type": "qcm", "q": "Combien de litres de liquide les reins filtrent-ils par jour ?", "choices": ["Environ 180 L", "Environ 1,5 L", "Environ 18 L", "Environ 1 800 L"], "answer": 0, "explication": "Plus de 99 % sont réabsorbés : il ne reste qu'environ 1,5 L d'urine."}, {"type": "trou", "q": "L'hormone rénale qui stimule la fabrication des globules rouges est l'___.", "choices": ["EPO", "insuline", "adrénaline", "ocytocine"], "answer": 0, "explication": "C'est aussi un produit dopant bien connu dans les sports d'endurance."}, {"type": "vf", "q": "Chez une personne en bonne santé, on trouve du glucose dans les urines.", "answer": false, "explication": "Il est entièrement réabsorbé. Du glucose dans les urines fait penser à un diabète."}, {"type": "qcm", "q": "L'unité fonctionnelle du rein s'appelle :", "choices": ["Le néphron", "Le neurone", "L'alvéole", "Le lobule"], "answer": 0, "explication": "Il y en a environ un million par rein."}]}, {"id": "physio-6", "titre": "L'eau et le sodium", "niveau": "fac", "objectif": "Comprendre la soif et les hormones de l'eau.", "sources": {"sorbonne": "UE3 Physiologie · Adaptations aux variations d'eau", "saclay": "Biophysique · Milieu intérieur"}, "slides": [{"t": "Réguler l'eau", "p": ["Quand on manque d'eau, l'osmolarité du plasma **monte**. L'hypothalamus le détecte.", "Il déclenche la **soif** et la libération d'**ADH** (hormone antidiurétique) par l'hypophyse.", "L'ADH fait **réabsorber l'eau** par le rein : l'urine devient concentrée et foncée."]}, {"t": "Réguler le sodium et le volume", "p": ["Le sodium détermine le **volume** du liquide extracellulaire : là où va le sodium, l'eau suit.", "Quand le volume de sang baisse, le rein libère la **rénine**, qui active le système **rénine-angiotensine-aldostérone**.", "L'**aldostérone** fait réabsorber le sodium. L'alcool, lui, **bloque l'ADH**, d'où l'envie d'uriner."]}], "cours": ["Déshydratation : l'osmolarité monte, on a soif et l'ADH est libérée.", "L'ADH fait réabsorber l'eau par le rein.", "L'aldostérone fait réabsorber le sodium. L'alcool bloque l'ADH."], "paires": [["ADH", "Fait réabsorber l'eau"], ["Aldostérone", "Fait réabsorber le sodium"], ["Rénine", "Libérée par le rein"], ["Soif", "Signal de l'hypothalamus"]], "questions": [{"type": "trou", "q": "L'hormone qui fait réabsorber l'eau par le rein est l'___.", "choices": ["ADH", "insuline", "aldostérone", "EPO"], "answer": 0, "explication": "Hormone antidiurétique : elle réduit le volume d'urine."}, {"type": "qcm", "q": "Pourquoi boire de l'alcool donne-t-il souvent envie d'uriner ?", "choices": ["L'alcool bloque la libération d'ADH", "L'alcool contient beaucoup de sodium", "L'alcool augmente l'aldostérone", "L'alcool irrite la vessie"], "answer": 0, "explication": "Sans ADH, le rein réabsorbe moins d'eau : on urine plus et on se déshydrate."}, {"type": "vf", "q": "L'aldostérone fait réabsorber le sodium par le rein.", "answer": true, "explication": "L'eau suit le sodium : elle augmente donc aussi le volume sanguin."}, {"type": "qcm", "q": "Quand on manque d'eau, l'osmolarité du plasma :", "choices": ["Augmente", "Diminue", "Ne change pas", "Devient nulle"], "answer": 0, "explication": "Il y a moins d'eau pour la même quantité de solutés : c'est ce qui déclenche la soif."}]}, {"id": "physio-7", "titre": "La glycémie", "niveau": "lycee", "objectif": "Comprendre la régulation du sucre dans le sang.", "sources": {"sorbonne": "UE1 Biochimie · Métabolisme énergétique", "saclay": "Biochimie · Interrelations métaboliques"}, "slides": [{"t": "Une valeur surveillée", "p": ["La **glycémie** à jeun normale est d'environ **0,7 à 1,1 g/L**.", "Après un repas, elle monte : le **pancréas** libère de l'**insuline**, qui fait entrer le glucose dans les cellules et le stocke en **glycogène**.", "Entre les repas, le pancréas libère le **glucagon**, qui fait libérer du glucose par le foie."]}, {"t": "Les diabètes", "p": ["On parle de **diabète** quand la glycémie à jeun atteint **1,26 g/L** ou plus, à deux reprises.", "**Type 1** : le système immunitaire détruit les cellules qui fabriquent l'insuline. Il faut des **injections d'insuline**.", "**Type 2** : l'insuline agit mal (résistance). Il est favorisé par le surpoids et la sédentarité, et bien plus fréquent."]}], "cours": ["La glycémie à jeun normale est d'environ 0,7 à 1,1 g/L.", "L'insuline la fait baisser, le glucagon la fait monter.", "Diabète si glycémie à jeun ≥ 1,26 g/L. Type 1 : plus d'insuline. Type 2 : insuline qui agit mal."], "paires": [["Insuline", "Fait baisser la glycémie"], ["Glucagon", "Fait monter la glycémie"], ["Type 1", "Destruction des cellules à insuline"], ["Type 2", "Résistance à l'insuline"]], "questions": [{"type": "qcm", "q": "Quelle hormone fait baisser la glycémie ?", "choices": ["L'insuline", "Le glucagon", "L'adrénaline", "Le cortisol"], "answer": 0, "explication": "C'est la seule hormone hypoglycémiante. Les autres font plutôt monter la glycémie."}, {"type": "trou", "q": "On parle de diabète quand la glycémie à jeun atteint ___ à deux reprises.", "choices": ["1,26 g/L", "0,7 g/L", "2 g/L", "1 g/L"], "answer": 0, "explication": "Soit 7 mmol/L."}, {"type": "vf", "q": "Le diabète de type 2 est plus fréquent que le type 1.", "answer": true, "explication": "Il représente environ 90 % des diabètes."}, {"type": "qcm", "q": "Dans le diabète de type 1 :", "choices": ["Les cellules qui fabriquent l'insuline sont détruites", "L'insuline est produite en excès", "Le foie ne stocke plus le glucose", "Le sport suffit à le guérir"], "answer": 0, "explication": "C'est une maladie auto-immune. Le traitement repose sur l'insuline."}]}, {"id": "physio-8", "titre": "L'adaptation à l'effort", "niveau": "pont", "objectif": "Décrire comment le corps s'adapte au sport.", "sources": {"sorbonne": "UE3 Physiologie · Adaptations à l'effort", "saclay": "Biophysique · Milieu intérieur, thermorégulation"}, "slides": [{"t": "Tout accélère", "p": ["Les muscles consomment beaucoup plus d'**O₂** : la **fréquence cardiaque** et le **volume d'éjection** augmentent, donc le débit cardiaque aussi.", "La **ventilation** augmente pour apporter l'O₂ et éliminer le CO₂.", "Le sang est redirigé vers les **muscles** et la **peau**, au détriment du tube digestif."]}, {"t": "Limites et entraînement", "p": ["La **fréquence cardiaque maximale** est d'environ **220 − âge**.", "La **VO₂max** est la quantité maximale d'O₂ que le corps peut utiliser. Elle augmente avec l'entraînement d'endurance.", "Un sportif entraîné a souvent une fréquence **au repos** plus basse : son cœur éjecte plus de sang à chaque battement."]}], "cours": ["À l'effort, le débit cardiaque et la ventilation augmentent.", "Le sang est redirigé vers les muscles et la peau.", "FC max ≈ 220 − âge. L'entraînement augmente la VO₂max et baisse la FC de repos."], "paires": [["VO₂max", "O₂ maximal utilisé"], ["220 − âge", "FC maximale estimée"], ["Sueur", "Évacue la chaleur"], ["Entraînement", "Baisse la FC de repos"]], "questions": [{"type": "qcm", "q": "Quelle est la fréquence cardiaque maximale estimée d'une personne de 20 ans ?", "choices": ["200 battements/min", "220 battements/min", "180 battements/min", "120 battements/min"], "answer": 0, "explication": "220 − 20 = 200. C'est une estimation, qui varie selon les personnes."}, {"type": "vf", "q": "Un sportif d'endurance a souvent une fréquence cardiaque de repos plus basse.", "answer": true, "explication": "Son cœur est plus efficace : il éjecte plus de sang à chaque battement."}, {"type": "trou", "q": "La quantité maximale d'O₂ que le corps peut utiliser s'appelle la ___.", "choices": ["VO₂max", "FC max", "capacité vitale", "glycémie"], "answer": 0, "explication": "C'est un bon indicateur de l'aptitude à l'endurance."}, {"type": "qcm", "q": "Pendant un effort intense, le débit sanguin du tube digestif :", "choices": ["Diminue", "Augmente beaucoup", "Ne change pas", "S'arrête complètement"], "answer": 0, "explication": "Le sang est redirigé vers les muscles. C'est une raison d'éviter un gros repas juste avant le sport."}]}]}, {"id": "medic", "titre": "Le médicament", "matiere": "Pharmacologie", "lycee": "Enseignement scientifique : santé. Le reste est nouveau.", "lecons": [{"id": "medic-1", "titre": "Qu'est-ce qu'un médicament ?", "niveau": "lycee", "objectif": "Définir un médicament et ce qu'il contient.", "sources": {"sorbonne": "UE6 Pharmacologie · Médicament : définition, histoire et régulation", "saclay": "Médicament · Définition juridique"}, "slides": [{"t": "Une définition précise", "p": ["En France, un **médicament** est une substance présentée comme ayant des propriétés pour **traiter** ou **prévenir** des maladies humaines ou animales, ou qui sert au **diagnostic** ou à **modifier des fonctions** de l'organisme.", "Il doit obtenir une **autorisation de mise sur le marché (AMM)** avant d'être vendu.", "En France, c'est l'**ANSM** qui surveille leur sécurité."]}, {"t": "Ce qu'il y a dans un comprimé", "p": ["Le **principe actif** (la substance active) produit l'effet.", "Les **excipients** donnent la forme, le goût, la conservation. Certains ont des effets à connaître, comme le lactose.", "Le médicament a une **DCI** (dénomination commune internationale), comme paracétamol ou ibuprofène, et souvent un **nom commercial**."]}], "cours": ["Un médicament traite, prévient, diagnostique ou modifie une fonction du corps.", "Il lui faut une AMM. En France, l'ANSM surveille sa sécurité.", "Principe actif = effet. Excipients = forme, goût, conservation. DCI = nom international."], "paires": [["AMM", "Autorisation de vente"], ["Principe actif", "Produit l'effet"], ["Excipient", "Forme et goût"], ["DCI", "Nom international"]], "questions": [{"type": "qcm", "q": "Dans un comprimé, quelle substance produit l'effet thérapeutique ?", "choices": ["Le principe actif", "L'excipient", "L'enrobage", "Le colorant"], "answer": 0, "explication": "Les excipients servent à fabriquer, conserver et faire avaler le médicament."}, {"type": "trou", "q": "Avant d'être vendu, un médicament doit obtenir une ___.", "choices": ["AMM", "DCI", "ordonnance", "ALD"], "answer": 0, "explication": "Autorisation de mise sur le marché, délivrée après évaluation de son efficacité et de sa sécurité."}, {"type": "vf", "q": "Paracétamol est une DCI.", "answer": true, "explication": "C'est le nom international de la molécule. Les noms de marque sont des noms commerciaux."}, {"type": "qcm", "q": "En France, quelle agence surveille la sécurité des médicaments ?", "choices": ["L'ANSM", "L'OMS", "La CNIL", "L'Ordre des médecins"], "answer": 0, "explication": "Agence nationale de sécurité du médicament et des produits de santé."}]}, {"id": "medic-2", "titre": "Du laboratoire à la pharmacie", "niveau": "pont", "objectif": "Connaître les étapes du développement d'un médicament.", "sources": {"sorbonne": "UE6 Pharmacologie · Phases de développement clinique", "saclay": "Médicament · Développement clinique"}, "slides": [{"t": "Avant l'humain", "p": ["Tout commence par la recherche d'une **cible** et le test de milliers de molécules.", "Les **études précliniques** testent la molécule **in vitro** et chez l'**animal** : efficacité, toxicité.", "Seule une petite fraction des molécules testées devient un médicament, souvent après plus de **10 ans** de développement."]}, {"t": "Les essais cliniques", "p": ["**Phase 1** : quelques dizaines de volontaires, souvent en bonne santé. On teste la **tolérance**.", "**Phase 2** : quelques centaines de malades. On cherche la **bonne dose** et un premier signe d'efficacité.", "**Phase 3** : des milliers de malades, souvent en **essai randomisé** contre placebo ou traitement de référence. Puis **AMM**, et la **phase 4** surveille le médicament une fois commercialisé : c'est la **pharmacovigilance**."]}], "cours": ["Préclinique : in vitro et chez l'animal.", "Phase 1 : tolérance. Phase 2 : dose. Phase 3 : efficacité sur des milliers de patients.", "Après l'AMM, la phase 4 surveille les effets indésirables (pharmacovigilance)."], "paires": [["Phase 1", "Tolérance"], ["Phase 2", "Recherche de la dose"], ["Phase 3", "Efficacité à grande échelle"], ["Phase 4", "Pharmacovigilance"]], "questions": [{"type": "qcm", "q": "Quelle phase d'essai teste un médicament sur des milliers de patients ?", "choices": ["La phase 3", "La phase 1", "La phase 2", "La phase préclinique"], "answer": 0, "explication": "C'est elle qui démontre l'efficacité avant la demande d'AMM."}, {"type": "trou", "q": "La surveillance des effets indésirables après la mise sur le marché s'appelle la ___.", "choices": ["pharmacovigilance", "pharmacocinétique", "pharmacodynamie", "galénique"], "answer": 0, "explication": "Les professionnels de santé, et même les patients, peuvent déclarer un effet indésirable."}, {"type": "vf", "q": "La phase 1 se fait en général sur des milliers de malades.", "answer": false, "explication": "Elle se fait sur quelques dizaines de volontaires, souvent en bonne santé, pour tester la tolérance."}, {"type": "qcm", "q": "Combien de temps faut-il en général pour développer un médicament ?", "choices": ["Plus de 10 ans", "Environ 6 mois", "Environ 2 ans", "Environ 50 ans"], "answer": 0, "explication": "Souvent 10 à 15 ans entre la découverte et la mise sur le marché."}]}, {"id": "medic-3", "titre": "Formes et voies d'administration", "niveau": "pont", "objectif": "Relier la forme d'un médicament à sa voie d'administration.", "sources": {"sorbonne": "UE6 Pharmacologie · Formes galéniques, voies d'administration", "saclay": "Médicament · Voies entérales, parentérales, topiques"}, "slides": [{"t": "La galénique", "p": ["La **galénique** est l'art de donner une forme au médicament : comprimé, gélule, sirop, injectable, patch, crème…", "Une **gélule** est une enveloppe, souvent de gélatine, qui contient le principe actif. Oui, comme la monnaie de l'app.", "Certaines formes libèrent le principe actif **lentement** (forme LP) pour espacer les prises."]}, {"t": "Les voies", "p": ["**Voie orale** : la plus simple, mais le médicament passe par l'intestin puis par le **foie**, qui peut en détruire une partie.", "**Voie intraveineuse** : action rapide, tout arrive directement dans le sang.", "Les voies **sublinguale**, **cutanée** (patch) ou **rectale** évitent en partie ce passage par le foie."]}], "cours": ["La galénique donne sa forme au médicament (comprimé, gélule, injectable…).", "Par voie orale, le foie peut détruire une partie du médicament avant qu'il n'agisse.", "L'intraveineuse est la plus rapide. Sublinguale, cutanée et rectale évitent en partie le foie."], "paires": [["Galénique", "Forme du médicament"], ["Intraveineuse", "Action la plus rapide"], ["Sublinguale", "Sous la langue"], ["LP", "Libération prolongée"]], "questions": [{"type": "qcm", "q": "Quelle voie d'administration agit le plus vite ?", "choices": ["L'intraveineuse", "La voie orale", "La voie cutanée", "La voie rectale"], "answer": 0, "explication": "Le médicament arrive directement dans le sang, sans étape d'absorption."}, {"type": "trou", "q": "L'art de donner une forme à un médicament s'appelle la ___.", "choices": ["galénique", "génétique", "glycolyse", "gastrulation"], "answer": 0, "explication": "Le nom vient de Galien, un médecin de l'Antiquité."}, {"type": "vf", "q": "Un médicament avalé passe par le foie avant d'atteindre la circulation générale.", "answer": true, "explication": "C'est l'effet de premier passage : une partie peut être détruite en route."}, {"type": "qcm", "q": "Que signifie « LP » sur une boîte de médicament ?", "choices": ["Libération prolongée", "Liste principale", "Laboratoire pharmaceutique", "Lent et puissant"], "answer": 0, "explication": "Le principe actif est libéré lentement, ce qui permet d'espacer les prises."}]}, {"id": "medic-4", "titre": "Le trajet du médicament", "niveau": "pont", "objectif": "Suivre un médicament dans le corps (ADME).", "sources": {"sorbonne": "UE6 Pharmacologie · Pharmacocinétique descriptive", "saclay": "Médicament · Pharmacocinétique, aspects qualitatifs"}, "slides": [{"t": "A comme absorption, D comme distribution", "p": ["La **pharmacocinétique**, c'est ce que le corps fait au médicament. On la résume par **ADME**.", "**Absorption** : le passage vers le sang. La **biodisponibilité** est la fraction qui arrive intacte dans la circulation : 100 % en intraveineuse.", "**Distribution** : le médicament se répartit dans les tissus. Une partie se fixe aux protéines du plasma, comme l'albumine."]}, {"t": "M comme métabolisme, E comme élimination", "p": ["**Métabolisme** : surtout dans le **foie**, où des enzymes, les **cytochromes P450**, transforment le médicament.", "Certains aliments ou médicaments modifient ces enzymes : le **jus de pamplemousse** en bloque certaines.", "**Élimination** : surtout par le **rein** (urine) ou la **bile**. Chez un patient au rein malade, on adapte souvent la dose."]}], "cours": ["ADME : absorption, distribution, métabolisme, élimination.", "La biodisponibilité est la fraction qui arrive intacte dans le sang.", "Le foie métabolise (cytochromes P450), le rein élimine le plus souvent."], "paires": [["Absorption", "Passage dans le sang"], ["Biodisponibilité", "Fraction qui arrive intacte"], ["Cytochrome P450", "Enzymes du foie"], ["Rein", "Principale voie d'élimination"]], "questions": [{"type": "qcm", "q": "Quelle est la biodisponibilité d'un médicament injecté en intraveineuse ?", "choices": ["100 %", "50 %", "0 %", "Elle dépend de l'heure"], "answer": 0 <script>
(function(){

var DATA = JSON.parse(document.getElementById('data').textContent);
var UNITS = DATA.unites;
var ORDER = [];
UNITS.forEach(function(u, ui){ u.lecons.forEach(function(l, li){ ORDER.push({u:u, ui:ui, l:l, li:li}); }); });
var QBYID={};
UNITS.forEach(function(u, ui){ u.lecons.forEach(function(l){ l.questions.forEach(function(q, i){ q.id=l.id+'#'+i; QBYID[q.id]={q:q, ui:ui}; }); }); });
var app = document.getElementById('app');

/* ================= State ================= */
var KEY = 'systole-proto-v1';
var MAXL = 5, REGEN = 30*60*1000;
function fresh(){ return {v:1, onboarded:false, goal:10, xp:0, xpByDay:{}, streak:0, best:0, lastDay:null, lostStreak:0, defib:1, lives:MAXL, livesTs:Date.now(), done:{}, days:[], frozen:[], sound:true, dayOffset:0, gel:50, chests:{}, subject:0, boostUntil:0, lastSkit:null, wrong:{}, owned:{rouge:1}, wear:{peau:'rouge'}, dailyHist:[]}; }
var S = (function(){ try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.v===1) return Object.assign(fresh(), s); }catch(e){} return fresh(); })();
S.owned=S.owned||{}; S.owned.rouge=1; S.wear=S.wear||{peau:'rouge'}; S.dailyHist=S.dailyHist||[];
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function now(){ return Date.now() + S.dayOffset*864e5; }
function pad(n){ return (n<10?'0':'')+n; }
function dayKey(t){ var d=new Date(t); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function today(){ return dayKey(now()); }
function daysBetween(a,b){ var pa=a.split('-').map(Number), pb=b.split('-').map(Number); return Math.round((Date.UTC(pb[0],pb[1]-1,pb[2])-Date.UTC(pa[0],pa[1]-1,pa[2]))/864e5); }
function tickLives(){
  if(S.lives>=MAXL){ S.lives=MAXL; return; }
  var n=Math.floor((now()-S.livesTs)/REGEN);
  if(n>0){ S.lives=Math.min(MAXL,S.lives+n); S.livesTs+=n*REGEN; save(); }
}
function loseLife(){ if(S.lives>=MAXL) S.livesTs=now(); S.lives=Math.max(0,S.lives-1); save(); }
function nextLifeMin(){ return Math.max(1, Math.ceil((REGEN-(now()-S.livesTs))/60000)); }
function bpm(){ return Math.min(150, 60 + S.streak*3); }
function doneToday(){ return S.lastDay===today(); }
function xpToday(){ return S.xpByDay[today()]||0; }
function currentIdx(){ for(var i=0;i<ORDER.length;i++){ if(!S.done[ORDER[i].l.id]) return i; } return -1; }
function checkStreak(){
  if(!S.lastDay || S.streak===0) return null;
  var gap=daysBetween(S.lastDay, today());
  if(gap<=1) return null;
  var missed=gap-1;
  if(S.defib>=missed){
    for(var k=1;k<=missed;k++){ S.frozen.push(dayKey(now()-k*864e5)); }
    S.defib-=missed; S.lastDay=dayKey(now()-864e5); save();
    return {type:'defib', used:missed};
  }
  S.lostStreak=S.streak; S.streak=0; save();
  return {type:'arrest'};
}

/* ================= Sound ================= */
/* Everything is synthesized live. The mix goes through a soft master (a gentle cut of the harsh
   highs, then a compressor) and a short, warm room reverb. Notes stay on one pentatonic scale;
   interface sounds are low, round and short so they never tire the ear; every note is detuned
   by a hair at random so repeats sound played, not looped. */
var AC=null, OUT=null, SEND=null, HALL=null, NOISE=null;
function audioGraph(c){
  var comp=c.createDynamicsCompressor(); comp.threshold.value=-18; comp.knee.value=14; comp.ratio.value=4; comp.attack.value=.004; comp.release.value=.22;
  comp.connect(c.destination);
  var bite=c.createBiquadFilter(), shelf=c.createBiquadFilter(), top=c.createBiquadFilter();
  bite.type='peaking'; bite.frequency.value=3000; bite.Q.value=.9; bite.gain.value=-3;
  shelf.type='highshelf'; shelf.frequency.value=5000; shelf.gain.value=-7;
  top.type='lowpass'; top.frequency.value=11000; top.Q.value=.5;
  OUT=c.createGain(); OUT.gain.value=.85;
  OUT.connect(bite); bite.connect(shelf); shelf.connect(top); top.connect(comp);
  /* Reverb: 1.4 s of decaying noise, darkened, as a small warm room */
  var sr=c.sampleRate, len=Math.floor(sr*1.4), ir=c.createBuffer(2,len,sr), fade=Math.floor(sr*.006);
  for(var ch=0; ch<2; ch++){ var d=ir.getChannelData(ch); for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.4)*(i<fade?i/fade:1); }
  var pre=c.createDelay(.1), conv=c.createConvolver(), dark=c.createBiquadFilter(), wet=c.createGain();
  pre.delayTime.value=.014; conv.buffer=ir; dark.type='lowpass'; dark.frequency.value=4200; wet.gain.value=.32;
  pre.connect(conv); conv.connect(dark); dark.connect(wet); wet.connect(OUT);
  SEND=pre;
  /* Hall: a longer, darker space for the trousses and their brass, choir and timpani */
  var hl=Math.floor(sr*2.6), hir=c.createBuffer(2,hl,sr);
  for(var hc=0; hc<2; hc++){ var hd=hir.getChannelData(hc); for(var hi=0;hi<hl;hi++) hd[hi]=(Math.random()*2-1)*Math.pow(1-hi/hl,2.6)*(hi<fade?hi/fade:1); }
  var hpre=c.createDelay(.1), hconv=c.createConvolver(), hdark=c.createBiquadFilter(), hwet=c.createGain();
  hpre.delayTime.value=.025; hconv.buffer=hir; hdark.type='lowpass'; hdark.frequency.value=3400; hwet.gain.value=.36;

function dailyGrid(n, openedToday){
  var d=dailyCycle(n), hist=S.dailyHist||[], legacy=!hist.length && !!S.dailyChest, h='';
  for(var i=1;i<=10;i++){
    var day=n-d+i, tr=dailyTier(day), got=false, st;
    if(i<d){ got=legacy || hist.indexOf(dayKey(now()-(d-i)*864e5))>-1; st=got?'got':'miss'; }
    else if(i===d){ got=!!openedToday; st=got?'got':'now'; }
    else st = (openedToday && i===d+1) ? 'next soon' : 'next';
    h+='<div class="dg '+st+'" style="--dc:'+TIERS[tr].col+'" title="Jour '+day+' : trousse '+TIERS[tr].n+'">'+kit(got,tr,40)+'<b>J'+day+'</b>'+(got?'<i>'+I.check+'</i>':'')+'</div>';
  }
  return '<div class="dgrid">'+h+'</div>';
}
function dailyCard(){

/* ================= Paths: one per subject, with checkpoints ================= */
var USTART=[]; (function(){ var g=0; UNITS.forEach(function(u){ USTART.push(g); g+=u.lecons.length; }); })();
var PATHS = UNITS.map(function(u, ui){
  var items=[], n=u.lecons.length;
  u.lecons.forEach(function(l, li){
    var pt=(u.parties||[]).filter(function(x){ return x.debut===l.id; })[0];
    if(pt) items.push({kind:'part', titre:pt.titre, n:u.parties.indexOf(pt)+1});
    items.push({kind:'lesson', g:USTART[ui]+li, li:li, ui:ui});
    if(li===n-1) items.push({kind:'chest', id:u.id+'-final', big:true, need:li, ui:ui});
    else if((li+1)%3===0 && n-li-1>=2) items.push({kind:'chest', id:u.id+'-c'+((li+1)/3), big:false, need:li, ui:ui});
  });
  return items;
});
function findChest(id){ for(var i=0;i<PATHS.length;i++){ for(var j=0;j<PATHS[i].length;j++){ if(PATHS[i][j].id===id) return PATHS[i][j]; } } return null; }
function chestState(it){
  if(S.chests[it.id]!=null) return 'opened';
  var ls=UNITS[it.ui].lecons; for(var k=0;k<=it.need;k++){ if(!S.done[ls[k].id]) return 'locked'; }
  return 'ready';
}
function curIdx(ui){ var ls=UNITS[ui].lecons; for(var k=0;k<ls.length;k++){ if(!S.done[ls[k].id]) return USTART[ui]+k; } return -1; }
function anyCur(){ var c=curIdx(S.subject); if(c>-1) return c; for(var i=0;i<UNITS.length;i++){ c=curIdx(i); if(c>-1) return c; } return 0; }
function tipTarget(ui){
  var cur=curIdx(ui);
  for(var i=0;i<PATHS[ui].length;i++){ var it=PATHS[ui][i]; if(it.kind==='chest' && chestState(it)==='ready') return it; if(it.kind==='lesson' && it.g===cur) return it; }
  return null;
}
function nodeIdAfter(g){
  var o=ORDER[g], p=PATHS[o.ui];
  for(var i=0;i<p.length;i++){ if(p[i].kind==='lesson' && p[i].g===g){ var nx=p[i+1]; if(nx && nx.kind==='part') nx=p[i+2]; if(!nx) return null; return nx.kind==='chest' ? 'chest-'+nx.id : 'node-'+nx.g; } }
  return null;
}

/* Trousses for sale. Each one keeps its 5 taps. Prices sit close to what a trousse gives back
   on average (gélules plus the odds of an object), so buying them never becomes a money machine. */
var SHOPK=[
  {t:0, n:'Trousse de secours', s:'Secours', p:200},
  {t:1, n:'Trousse de garde', s:'Garde', p:500},
  {t:2, n:'Trousse de réa', s:'Réa', p:1100},
  {t:3, n:'Trousse du Professeur', s:'Professeur', p:2500}
];
function fmtN(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '); }
/* Final rarity after the 5 taps, from a starting rarity */
function tierDist(t0){
  var d=[0,0,0,0]; d[t0]=1;
  for(var k=0;k<TAPS;k++){
    var nd=[0,0,0,0];
    for(var t=0;t<4;t++){ if(!d[t]) continue; var u=upChance(t,k); nd[t]+=d[t]*(1-u); JUMP.forEach(function(j){ nd[Math.min(3,t+j[0])]+=d[t]*u*j[1]; }); }
    d=nd;
  }
  return d;
}
function chancesTable(){
  var rows=SHOPK.map(function(k){ return '<tr><th>'+k.s+'</th>'+tierDist(k.t).map(function(x){ return '<td>'+(x>0.0005?pctStr(x):'–')+'</td>'; }).join('')+'</tr>'; }).join('');
  return '<table class="ctab"><thead><tr><th></th>'+TIERS.map(function(T){ return '<th><i style="background:'+T.col+'"></i>'+T.n+'</th>'; }).join('')+'</tr></thead><tbody>'+rows+'</tbody></table>'+
    '<p>Rareté finale après tes 5 touches. Les trousses du parcours commencent comme la trousse de secours (les trophées comme celle de garde), celle du jour suit ta série.</p>'+
    '<p>Une trousse épique a 30 % de chances de cacher un objet (rare ou épique). Une légendaire en cache toujours un (épique ou légendaire). Jamais un objet que tu as déjà.</p>';
}
function buyChest(i){
  var k=SHOPK[i]; if(!k || S.gel<k.p) return;
  S.gel-=k.p; save(); SFX.buy(); buzz(30);
