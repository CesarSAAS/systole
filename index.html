/* ================= Lesson engine ================= */
/* Combo tiers drive the whole feel: green (0-2), orange "en feu" (3-4), electric blue (5+). */
function tierOf(c){ return c>=5 ? 2 : (c>=3 ? 1 : 0); }
var TIER_COL=['#3DBA4E','#FF7A1F','#1E9BFF'];
var JUDGE=['BIEN','SUPER','EXCELLENT','PARFAIT','INCROYABLE','LÉGENDAIRE'];
function startLesson(idx, practice){
  var o = ORDER[idx];
  var steps;
  if(practice){
    var pool=[]; ORDER.forEach(function(x){ if(S.done[x.l.id]) x.l.questions.forEach(function(q){ pool.push({kind:'q', q:q, ui:x.ui}); }); });
    if(!pool.length) o.l.questions.forEach(function(q){ pool.push({kind:'q', q:q, ui:o.ui}); });
    steps = shuffle(pool).slice(0,4);
  } else {
    var qs=o.l.questions;
    steps = (o.l.slides||[]).map(function(_,k){ return {kind:'slide', k:k}; }).concat([{kind:'intro'}, {kind:'q', q:qs[0]}, {kind:'q', q:qs[1]}, {kind:'pairs'}]).concat(qs.slice(2).map(function(q){ return {kind:'q', q:q}; }));
  }
  R.lesson = {idx:idx, o:o, practice:!!practice, steps:steps, base:steps.length, i:0, ok:0, answered:0, correct:0, mistakes:0, t0:Date.now(), phase:'idle', sel:null, order:null, pairs:null, replay:!!S.done[o.l.id], combo:0, maxCombo:0, prevPct:0};
  prepStep();
  steps.forEach(function(st2){ if(st2.q && st2.q.type==='pointe') V3.prefetch(st2.q.model); });
  R.pop=null; SFX.whoosh(); go('lesson');
}
function prepStep(){
  var L=R.lesson, s=L.steps[L.i];
  L.phase = (s.kind==='intro' || s.kind==='slide') ? 'ready' : 'idle'; L.sel=null; L.order=null; L.pairs=null;
  L.enter=true; L.justChecked=false; L.comboLost=0;
  if(s.kind==='q' && (s.q.type==='qcm' || s.q.type==='trou')) L.order = shuffle(s.q.choices.map(function(_,i){return i;}));
  if(s.kind==='pairs'){
    var P=L.o.l.paires.map(function(p,i){ return {i:i, a:p[0], b:p[1]}; });
    L.pairs={left:shuffle(P), right:shuffle(P), selL:null, selR:null, matched:{}, bad:null, flash:null};
  }
}
function pct(L){ return Math.min(100, (L.ok/L.base)*100); }
function vLesson(){
  var L=R.lesson, s=L.steps[L.i], ui = s.ui!=null ? s.ui : L.o.ui;
  var p=pct(L), t=tierOf(L.combo);
  var body = s.kind==='slide' ? vSlide(L, s.k) : s.kind==='intro' ? vIntro(L, ui) : s.kind==='pairs' ? vPairs(L) : vQuestion(L, s);
  return '<div class="screen'+(L.quake?' quake':'')+'" style="--c0:'+uc(ui)+'">'+
    '<div class="lhead"><button class="xbtn" data-act="quit" aria-label="Quitter la leçon">'+I.x+'</button>'+
      '<div class="bar lbar tier'+t+'" id="lbar" role="progressbar" aria-valuenow="'+Math.round(p)+'" aria-valuemin="0" aria-valuemax="100"><i id="lbarfill" data-to="'+p+'" style="width:'+L.prevPct+'%"></i></div>'+
      '<span class="combo t'+t+(L.bumpCombo?' bump':'')+'"'+(L.combo<2?' hidden':'')+' aria-label="Combo '+L.combo+'">'+BOLT+'×'+L.combo+'</span>'+
      (L.practice ? '<span class="lives-pill" style="color:var(--u4)">'+I.target+'</span>' : '<span class="lives-pill" id="lp">'+I.heart+S.lives+'</span>')+'</div>'+
    '<div class="body"><div class="inner'+(L.enter?' enter':'')+'">'+body+'</div></div>'+
    vLessonFoot(L, s)+'</div>';
}
function md(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>'); }
function vSlide(L, k){
  var l=L.o.l, n=l.slides.length+1, sl=l.slides[k];
  var line = k===0 ? (L.o.li===0 ? 'Nouvelle matière : '+esc(L.o.u.titre)+' ! ' : '')+'Prends le temps de lire, les questions arrivent après.' : 'Encore une, puis le récap.';
  return '<div class="intro"><div class="intro-top">'+boum({size:72})+'<div class="bubble">'+line+'</div></div>'+
    '<div class="slide"><div class="slide-h"><b>'+esc(sl.t)+'</b><span>'+(k+1)+' / '+n+'</span></div><div class="slide-b">'+
    sl.p.map(function(p){ return '<p>'+md(p)+'</p>'; }).join('')+'</div></div>'+
    (function(){ var mk=lessonModel(l); if(!mk || k!==0) return ''; var mm=MODELS[mk]; return '<button class="explore3d" data-act="labo-open" data-v="'+mk+'">'+(mm.type==='svg'?LABICO[mk]:CUBE)+(mm.type==='svg'?'Explorer le schéma : ':'Explorer en 3D : ')+esc(mm.titre)+'</button>'; })()+'</div>';
}
function vIntro(L, ui){
  var l=L.o.l, n=(l.slides||[]).length+1;
  return '<div class="intro"><div class="intro-top">'+boum({size:72, mood:'wink'})+'<div class="bubble">Le récap avant les questions. Retiens ces 3 points.</div></div>'+
    '<div class="memo"><div class="memo-h"><span>À retenir · '+esc(l.titre)+'</span><span>'+n+' / '+n+'</span></div><ol>'+
    l.cours.map(function(c){ return '<li><span>'+esc(c)+'</span></li>'; }).join('')+'</ol></div></div>';
}
function vQuestion(L, s){
  var q=s.q, h='', checked = L.phase==='good' || L.phase==='bad', fresh=L.justChecked;
  if(s.retry) h+='<div class="retry-tag">'+I.clock.replace('<svg','<svg style="width:18px;height:18px"')+'Tu t\'étais trompé ici</div>';
  if(q.type==='pointe'){
    var mdl=MODELS[q.model], stp={sel:L.sel, good:checked?q.target:[], bad:(checked && L.phase==='bad' && L.sel)?L.sel:null};
    h+='<div class="kicker">'+(mdl.type==='svg'?'Touche la bonne zone':'Touche la bonne structure')+'</div><div class="qtext">'+esc(q.q)+'</div>';
    h+=viewerHTML(q.model,'quiz',stp,'q'+L.i);
    var hint = checked ? (L.sel ? 'Tu as touché : <b>'+esc(partName(q.model,L.sel))+'</b>' : '') : (L.sel ? 'Sélection faite. Appuie sur Vérifier, ou touche ailleurs pour changer.' : (mdl.type==='svg' ? 'Touche le schéma pour choisir.' : 'Un doigt pour tourner, deux pour zoomer. Touche pour choisir.'));
    h+='<p class="v3hint">'+hint+'</p>';
    return h;
  }
  function cls(isAnswer, i){
    var c='opt';
    if(!checked){ if(L.sel===i) c+=' sel'; return c; }
    if(isAnswer) c+=' good'+(fresh?' popnow':'');
    else if(L.sel===i) c+=' bad'+(fresh?' shakenow':'');
    return c;
  }
  if(q.type==='vf'){
    h+='<div class="kicker">Vrai ou faux ?</div><div class="qtext">'+esc(q.q)+'</div>';
    h+='<div class="vf">'+[['Vrai',true],['Faux',false]].map(function(o,i){
      return '<button class="'+cls(o[1]===q.answer,i)+'" data-act="sel" data-v="'+i+'"'+(checked?' disabled':'')+'><span class="k">'+(i+1)+'</span>'+o[0]+'</button>';
    }).join('')+'</div>';
    return h;
  }
  if(q.type==='trou'){
    var parts=q.q.split('___'), txt='', bc='blank';
    if(L.sel!=null){ txt=q.choices[L.order[L.sel]]; bc+=' filled'; }
    if(checked){ bc='blank '+(L.phase==='good'?'good':'bad'); if(!txt) txt='…'; }
    h+='<div class="kicker">Complète la phrase</div><div class="qtext trou-q">'+esc(parts[0])+'<span class="'+bc+'">'+(txt?esc(txt):'&nbsp;')+'</span>'+esc(parts[1]||'')+'</div>';
    h+='<div class="chips">'+L.order.map(function(ci, i){
      return '<button class="'+cls(ci===q.answer,i)+'" data-act="sel" data-v="'+i+'"'+(checked?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(q.choices[ci])+'</span></button>';
    }).join('')+'</div>';
    return h;
  }
  h+='<div class="kicker">Choisis la bonne réponse</div><div class="qtext">'+esc(q.q)+'</div>';
  h+='<div class="choice-list" style="max-width:none">'+L.order.map(function(ci, i){
    return '<button class="'+cls(ci===q.answer,i)+'" data-act="sel" data-v="'+i+'"'+(checked?' disabled':'')+'><span class="k">'+(i+1)+'</span><span>'+esc(q.choices[ci])+'</span></button>';
  }).join('')+'</div>';
  return h;
}
function vPairs(L){
  var P=L.pairs;
  function tile(p, side){
    var id=side+p.i, cls='ptile';
    if(P.matched[p.i]) cls += (P.flash===p.i ? ' good pop' : ' gone');
    else if(P.bad && P.bad.indexOf(id)>-1) cls+=' bad';
    else if((side==='L'&&P.selL===p.i)||(side==='R'&&P.selR===p.i)) cls+=' sel';
    return '<button class="'+cls+'" data-act="pair" data-side="'+side+'" data-v="'+p.i+'"'+(P.matched[p.i]?' disabled':'')+'>'+esc(side==='L'?p.a:p.b)+'</button>';
  }
  return '<div class="kicker">Relie les paires</div><div class="pairs"><div class="col">'+P.left.map(function(p){return tile(p,'L');}).join('')+'</div><div class="col">'+P.right.map(function(p){return tile(p,'R');}).join('')+'</div></div>';
}
function vLessonFoot(L, s){
  var rise = L.justChecked ? ' rise' : '';
  if(L.phase==='good' || L.phase==='bad'){
    var good=L.phase==='good', q=s.q, extra='';

      extra = (good?'':'<p class="ans">Réponse : '+esc(ans)+'</p>')+'<p>'+esc(q.explication)+'</p>';
    } else if(s.kind==='pairs'){ extra='<p>Les 4 paires sont reliées.</p>'; }
    if(!good && L.comboLost) extra+='<div class="lost">'+I.x+'Combo ×'+L.comboLost+' perdu</div>';
    return '<div class="foot lfoot '+(good?'good':'bad')+rise+'"><div class="foot-in split"><div class="verdict"><div class="ico">'+(good?I.check:I.x)+'</div><div><h3>'+esc(L.head)+'</h3>'+extra+'</div></div>'+
      '<button class="btn '+(good?'okb':'red')+'" data-act="continue" id="primary">Continuer</button></div></div>';

    var dots='<span class="dots" aria-hidden="true">'+Array.apply(null,{length:ns}).map(function(_,i){ return '<i'+(i===cur?' class="on"':'')+'></i>'; }).join('')+'</span>';
    var canBack = L.i>0 && L.steps[L.i-1].kind==='slide';
    return '<div class="foot"><div class="foot-in split"><div class="footl">'+(canBack?'<button class="iconbtn" data-act="slide-back" aria-label="Diapo précédente">‹</button>':'')+dots+'</div><button class="btn" data-act="continue" id="primary">'+(s.kind==='slide'?'Suivant':'C\'est parti !')+'</button></div></div>';
  }
  if(s.kind==='pairs') return '<div class="foot"><div class="foot-in split"><span style="color:var(--muted); font-weight:700">Touche un mot à gauche, puis sa paire à droite. Chaque paire compte dans ton combo.</span><button class="btn" disabled>Vérifier</button></div></div>';
  return '<div class="foot"><div class="foot-in split"><button class="linkbtn" data-act="skip" style="justify-self:start">Je ne sais pas</button><button class="btn" data-act="check" id="primary"'+(L.sel==null?' disabled':'')+'>Vérifier</button></div></div>';
}

function judgePos(){ var b=document.getElementById('lbar'), r=b && b.getBoundingClientRect(); return r ? {x:r.left+r.width/2, y:r.bottom+40} : {x:innerWidth/2, y:96}; }

function finishLesson(){
  var L=R.lesson, t=today(), boost=boostActive();

  R.goalFrom=Math.min(1, before/S.goal);
  var xp = ((L.practice || L.replay) ? 5 : 10 + (L.mistakes===0 ? 5 : 0)) * (boost ? 2 : 1);
  S.xp+=xp; S.xpByDay[t]=before+xp;
  var gel=gelForXp(xp), goalBonus=(before<S.goal && before+xp>=S.goal) ? GOAL_BONUS : 0;
  S.gel+=gel+goalBonus;
  var wasDone=!!S.done[L.o.l.id];
  if(!L.practice) S.done[L.o.l.id]=true;
  R.justDone = (!L.practice && !wasDone) ? L.idx : null;
  var streakUp=false, relaunch=false, gotDefib=false;
  if(S.lastDay!==t){
    var gap = S.lastDay ? daysBetween(S.lastDay,t) : 99;
    relaunch = S.streak===0 && S.lostStreak>0;
    S.streak = (gap===1 && S.streak>0) ? S.streak+1 : 1;
    S.lastDay=t; if(S.days.indexOf(t)<0) S.days.push(t);
    if(S.streak>S.best) S.best=S.streak;
    if(S.streak%7===0 && S.defib<2){ S.defib++; gotDefib=true; }
    if(relaunch) S.lostStreak=0;
    streakUp=true;
  }
  var heartBack=false;
  if(L.practice && S.lives<MAXL){ S.lives++; if(S.lives>=MAXL) S.livesTs=now(); heartBack=true; }
  R.bump={xp:true, streak:streakUp, gel:true};
  save();
  R.after={xp:xp, gel:gel, goalBonus:goalBonus, boost:boost, acc: L.answered ? Math.round(100*L.correct/L.answered) : 100, secs:Math.round((Date.now()-L.t0)/1000), maxCombo:L.maxCombo, streakUp:streakUp, relaunch:relaunch, gotDefib:gotDefib, heartBack:heartBack, practice:L.practice, label:(L.custom&&L.custom.labo?'Défi terminé !':(L.custom&&L.custom.review?'Erreurs révisées !':null))};

}

function rollItem(t){

  var pool=function(tt){ return ITEMS.filter(function(it){ return it.t===tt && it.id!=='rouge' && !S.owned[it.id]; }); };
  var p=pool(want); if(!p.length) p=pool(alt);
  if(!p.length) return {dup:true, gel:t===2?100:300};
  return pick(p);
}

/* ================= Effects ================= */
function confetti(){
  if(RM) return;
  var c=document.createElement('canvas'); c.className='confetti'; document.body.appendChild(c);
  var ctx=c.getContext('2d'), W=c.width=innerWidth, H=c.height=innerHeight;
  var cols=['#14B89C','#8A63F2','#FF8A34','#2F8CFF','#F2549B','#FFC22E','#FF4760'];
  var P=[]; for(var i=0;i<130;i++) P.push({x:W/2+(Math.random()-.5)*80, y:H*0.35, vx:(Math.random()-.5)*15, vy:-Math.random()*15-4, r:Math.random()*6+4, a:Math.random()*6, va:(Math.random()-.5)*.4, c:cols[i%cols.length], s:Math.random()<.5});
  var t0=performance.now();
  (function f(t){
    var dt=Math.min(32,t-(f.l||t))/16; f.l=t; ctx.clearRect(0,0,W,H);
    P.forEach(function(p){ p.vy+=0.45*dt; p.vx*=0.99; p.x+=p.vx*dt; p.y+=p.vy*dt; p.a+=p.va*dt;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c;
      if(p.s){ ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); } else { ctx.beginPath(); ctx.arc(0,0,p.r/2.4,0,6.3); ctx.fill(); }
      ctx.restore(); });
    if(t-t0<2800) requestAnimationFrame(f); else c.remove();
  })(t0);
}

  tronc:'<svg viewBox="0 0 48 48"><path d="M24 6v14" stroke="#CDB9B1" stroke-width="4" stroke-linecap="round"/><path d="M22 20c-6-2-14 4-14 14 0 6 3 8 7 8 6 0 8-6 8-12zM26 20c6-2 14 4 14 14 0 6-3 8-7 8-6 0-8-6-8-12z" fill="#E7A39C"/></svg>',
  squelette:'<svg viewBox="0 0 48 48"><g transform="rotate(-40 24 24)"><path d="M12 20a5 5 0 1 1 4-6h16a5 5 0 1 1 4 6 5 5 0 1 1-4 6H16a5 5 0 1 1-4-6z" fill="#EADFC7" stroke="#B9A782" stroke-width="2"/></g></svg>',

  adn:'<svg viewBox="0 0 48 48"><path d="M16 4c18 10-2 20 16 40M32 4C14 14 34 24 16 44" fill="none" stroke="#6E8CA8" stroke-width="3.5" stroke-linecap="round"/><path d="M19 10h10M21 16h6M20 30h8M18 37h12" stroke="#43A047" stroke-width="3" stroke-linecap="round"/><path d="M22 23h4" stroke="#E53935" stroke-width="3" stroke-linecap="round"/></svg>',
  hemoglobine:'<svg viewBox="0 0 48 48"><circle cx="18" cy="18" r="10" fill="#E57373"/><circle cx="31" cy="17" r="10" fill="#5C9CE6"/><circle cx="17" cy="31" r="10" fill="#8DBDF2"/><circle cx="30" cy="30" r="10" fill="#F0A0A0"/><circle cx="24" cy="24" r="4" fill="#FFB300"/></svg>',
  ecg:'<svg viewBox="0 0 48 48"><rect x="3" y="8" width="42" height="32" rx="6" fill="#FFF1F1" stroke="#F0B3B3"/><path d="M5 28h8l3-5 3 5h3l3 6 4-20 4 22 3-8h7" fill="none" stroke="#1D2433" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>',
  neurone:'<svg viewBox="0 0 48 48"><path d="M12 22C8 16 6 12 3 10M12 26c-4 5-6 9-9 11M14 20c0-6 2-10 5-13" stroke="#C98BB9" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="15" cy="24" r="6" fill="#E7B1D6" stroke="#B56F9C" stroke-width="1.5"/><path d="M21 24h22" stroke="#C98BB9" stroke-width="2.5"/><rect x="24" y="21" width="7" height="6" rx="3" fill="#F4E4A1"/><rect x="33" y="21" width="7" height="6" rx="3" fill="#F4E4A1"/></svg>',
  chromosome:'<svg viewBox="0 0 48 48"><g transform="rotate(-8 18 22)"><rect x="12" y="5" width="10" height="17" rx="5" fill="#BFA3E0" stroke="#7D5BB0" stroke-width="1.5"/></g><g transform="rotate(8 30 22)"><rect x="26" y="5" width="10" height="17" rx="5" fill="#BFA3E0" stroke="#7D5BB0" stroke-width="1.5"/></g><g transform="rotate(6 18 26)"><rect x="12" y="25" width="10" height="19" rx="5" fill="#BFA3E0" stroke="#7D5BB0" stroke-width="1.5"/></g><g transform="rotate(-6 30 26)"><rect x="26" y="25" width="10" height="19" rx="5" fill="#BFA3E0" stroke="#7D5BB0" stroke-width="1.5"/></g><ellipse cx="24" cy="24" rx="10" ry="3.5" fill="#6C45A3"/></svg>'
};
function viewerHTML(model, mode, s, vid){
  var md=MODELS[model];
  if(md.type==='svg' || (model==='cellule' && !V3.isOK('cellule'))){
    var key = md.type==='svg' ? model : 'cellule2d';
    return '<div class="schemabox '+mode+'">'+SVGS[key](s)+'</div>';
  }
  var gl=V3.glOK();
  return '<div class="v3mount '+mode+'" data-model="'+model+'" data-mode="'+mode+'" data-vid="'+esc(vid)+'" data-sel="'+esc(s.sel||'')+'" data-good="'+esc((s.good||[]).join(','))+'" data-bad="'+esc(s.bad||'')+'">'+
    '<div class="v3load"><span class="spin"></span><span>Chargement du modèle 3D…</span></div>'+
    '<div class="v3err"><b>'+(gl?'Le modèle 3D n\'a pas pu se charger.':'Ton appareil n\'affiche pas la 3D.')+'</b>'+
      (gl?'<button class="btn small" data-act="v3retry" data-v="'+model+'">Réessayer</button>':'')+
      (mode==='quiz'?'<button class="linkbtn" data-act="v3skip">Passer cette question</button>':'')+'</div>'+
    (mode==='explore' && s.tip?'<div class="v3tip">1 doigt : tourner · 2 doigts : zoomer · 2 taps : recentrer</div>':'')+
    '<button class="v3reset" data-act="v3reset" aria-label="Recentrer la vue">'+I.target+'</button></div>';
}
function uniqueParts(model){
  var seen={}, out=[];
  (PARTS[model]||[]).forEach(function(p){ if(!seen[p[1]]){ seen[p[1]]=1; out.push(p); } });
  return out;
}
function lessonModel(l){
  var q=(l.questions||[]).filter(function(x){ return x.type==='pointe'; })[0];
  return q ? q.model : null;
}
function vLabo(){
  var keys=Object.keys(MODELS).filter(function(k){ return !MODELS[k].hidden; });
  var cards=keys.map(function(k){
    var m=MODELS[k], tag = m.type==='svg' ? 'Schéma' : (m.type==='mol' ? 'Molécule 3D' : '3D');
    return '<div class="lab-card" style="--uc:'+uc(m.ui)+'"><button class="lab-open" data-act="labo-open" data-v="'+k+'" aria-label="Explorer '+esc(m.titre)+'">'+
      '<span class="lab-ico">'+LABICO[k]+'</span><span class="lab-tag">'+tag+'</span><b>'+esc(m.titre)+'</b><span class="lab-desc">'+esc(m.desc)+'</span></button>'+
      '<button class="btn small lab-quiz" data-act="labo-quiz" data-v="'+k+'">Défi</button></div>';
  }).join('');
  return '<h1 class="h-page">Labo 3D</h1>'+
    '<div class="coach"><button class="poke" data-act="poke" aria-label="Boum">'+boum({size:80, mood:'wow'})+'</button><div class="bubble" id="coachb">Fais tourner, zoome, touche. Chaque défi te fait retrouver jusqu\'à 5 structures, sans perdre de cœur.</div></div>'+
    '<div class="lab-grid">'+cards+'</div>'+
    '<div class="section-t">Crédits</div>'+
    '<div class="card credits"><p>'+esc(CREDITS.mesh)+' Les reins, sous licence non commerciale, ont été retirés.</p><p>ADN : PDB 1BNA. Hémoglobine : PDB 2HHB (RCSB Protein Data Bank).</p><p>Moteur 3D : three.js (licence MIT). Chaque modèle ne se télécharge que quand tu l\'ouvres.</p></div>';
}
function vLaboModal(m){
  var md=MODELS[m.model], st3={sel:m.sel, good:[], bad:null, tip:!m.tipDone};
  m.tipDone=true;
  var chips=uniqueParts(m.model).map(function(p){ return '<button class="lchip'+(m.sel && partName(m.model,m.sel)===p[1]?' on':'')+'" data-act="labo-part" data-v="'+p[0]+'">'+esc(p[1])+'</button>'; }).join('');
  var hint = md.type==='svg' ? 'Touche une zone du schéma' : 'Touche une structure pour voir son nom';
  return '<div class="scrim full"><div class="labo" role="dialog" aria-modal="true" aria-label="'+esc(md.titre)+'" style="--c0:'+uc(md.ui)+'">'+
    '<div class="labo-h"><button class="xbtn" data-act="m-close" aria-label="Fermer">'+I.x+'</button><b>'+esc(md.titre)+'</b><button class="btn small" data-act="labo-quiz" data-v="'+m.model+'">Défi</button></div>'+
    viewerHTML(m.model,'explore',st3,'labo-'+m.model)+
    '<div class="labo-name">'+(m.sel ? '<b>'+esc(partName(m.model,m.sel))+'</b>' : '<span>'+hint+'</span>')+'</div>'+
    '<div class="labo-chips">'+chips+'</div>'+
    (function(){ var flat=md.type==='cell' && !V3.isOK('cellule'); return '<p class="labo-credit">'+esc(CREDITS[flat?'svg':md.type])+(md.size && !flat?' · '+esc(md.size):'')+'</p>'; })()+
  '</div></div>';
}
function isTarget(q,k){
  return q.target.indexOf(k)>-1 || q.target.some(function(t){ return partName(q.model,t)===partName(q.model,k); });
}
function pickPart(k, model, cands){
  if(R.modal && R.modal.type==='labo'){ R.modal.sel=k; SFX.pop(); render(); return; }
  if(R.screen==='lesson' && R.lesson){
    var L=R.lesson, s=L.steps[L.i];
    if(s && s.kind==='q' && s.q.type==='pointe' && L.phase!=='good' && L.phase!=='bad'){
      var c=(cands||[k]).filter(function(x){ return isTarget(s.q,x); })[0];
      L.sel=c||k; SFX.tap(3); buzz(8); render();
    }
  }
}
function startCustom(title, ui, steps, extra){
  var o={l:{id:'custom', titre:title, slides:[], cours:[], paires:[], questions:[]}, u:{titre:title}, ui:ui, li:1};
  R.lesson={idx:-1, o:o, practice:true, custom:extra||{}, steps:steps, base:steps.length, i:0, ok:0, answered:0, correct:0, mistakes:0, t0:Date.now(), phase:'idle', sel:null, order:null, pairs:null, replay:true, combo:0, maxCombo:0, prevPct:0};
  prepStep(); R.pop=null; R.modal=null; SFX.whoosh(); go('lesson');
}
function startLabQuiz(model){
  var md=MODELS[model], by={};
  (PARTS[model]||[]).forEach(function(p){ if((md.noquiz||[]).indexOf(p[0])<0) (by[p[1]]=by[p[1]]||[]).push(p[0]); });
  var names=shuffle(Object.keys(by)).slice(0,5);
  var steps=names.map(function(n){ return {kind:'q', ui:md.ui, q:{type:'pointe', model:model, target:by[n], q:'Trouve : '+n+'.', explication:'Retiens où se trouve cette structure : '+n+'.'}}; });
  V3.prefetch(model);
  startCustom(md.titre, md.ui, steps, {labo:model});
}
function wrongCount(){ return Object.keys(S.wrong||{}).filter(function(id){ return QBYID[id]; }).length; }
function startReview(){
  var ids=shuffle(Object.keys(S.wrong||{}).filter(function(id){ return QBYID[id]; })).slice(0,6);
  if(!ids.length) return;
  var steps=ids.map(function(id){ var e=QBYID[id]; return {kind:'q', q:e.q, ui:e.ui}; });
  steps.forEach(function(s){ if(s.q.type==='pointe') V3.prefetch(s.q.model); });
  startCustom('Mes erreurs', steps[0].ui, steps, {review:true});
}
function skipPointe(){
  var L=R.lesson; if(!L) return;
  L.ok++; L.i++;
  if(L.i>=L.steps.length){ finishLesson(); return; }
  prepStep(); render();
}
function slideBack(){
  var L=R.lesson; if(!L || L.i<=0) return;
  var p=L.steps[L.i-1]; if(p.kind!=='slide' && p.kind!=='intro') return;
  L.i--; L.ok=Math.max(0,L.ok-1); prepStep(); SFX.pop(); render();
}
function bindSwipe(){
  if(R.screen!=='lesson' || !R.lesson || R.modal) return;
  var L=R.lesson, s=L.steps[L.i]; if(!s || (s.kind!=='slide' && s.kind!=='intro')) return;
  var el=document.querySelector('#app .screen .body'); if(!el) return;
  var x0=null, y0=0, t0=0;
  el.addEventListener('touchstart', function(e){ var t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); }, {passive:true});
  el.addEventListener('touchend', function(e){
    if(x0===null) return; var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0; x0=null;
    if(Date.now()-t0>700 || Math.abs(dx)<60 || Math.abs(dy)>Math.abs(dx)*0.7) return;
    if(dx<0){ SFX.pop(); doContinue(); } else slideBack();
  }, {passive:true});
}

/* ================= Events ================= */
V3.onPick(function(k, model, cands){ pickPart(k, model, cands); });
document.addEventListener('pointerdown', function(){ ac(); }, true);
document.addEventListener('click', function(e){
  var t=e.target.closest('[data-act]');
  if(!t){ if(R.pop!=null){ R.pop=null; render(); } return; }
  var a=t.getAttribute('data-act'), v=t.getAttribute('data-v');
  if(a==='scrim'){ if(e.target===t && R.modal && R.modal.type!=='nolives-lesson'){ R.modal=null; render(); } return; }
  ac();
  switch(a){
    case 'noop': break;
    case 'labo-open': R.modal={type:'labo', model:v, sel:null, back:(R.modal && R.modal.type==='fiches') ? R.modal : null}; SFX.whoosh(); render(); break;
    case 'labo-part': if(R.modal && R.modal.type==='labo'){ R.modal.sel=v; SFX.pop(); render(); requestAnimationFrame(function(){ V3.focus(v); }); } break;
    case 'labo-quiz': startLabQuiz(v); break;
    case 'svgpart': pickPart(v); break;
    case 'v3reset': V3.reset(); SFX.pop(); break;
    case 'v3retry': V3.retry(v); render(); break;
    case 'v3skip': skipPointe(); break;
    case 'review': startReview(); break;
    case 'slide-back': slideBack(); break;
    case 'logo': splash(true); break;
    case 'poke': poke(t); break;
    case 'ob-next':
      var ob=center(document.getElementById('obboum'));
      SFX.zap(true); buzz(40);
      if(ob){ fxBolts(ob.x,ob.y,10,150,{inner:40,life:450}); fxRing(ob.x,ob.y,'#FF4760',140,{w:10}); fxSparks(ob.x,ob.y,24,['#FF4760','#FFC22E','#FF9DB0'],{speed:6,life:700,star:true}); }
      setTimeout(function(){ go('onboard2'); }, 320); break;
    case 'ob-goal': S.goal=+v; save(); SFX.tap(+t.getAttribute('data-i')); render(); break;
    case 'ob-done': S.onboarded=true; save(); startLesson(0); break;
    case 'tab': SFX.tab(['learn','labo','shop','league','profile'].indexOf(v)); R.tab=v; R.pop=null; go('home'); break;
    case 'subj': S.subject=+v; save(); R.pop=null; SFX.tap(+v); render(); requestAnimationFrame(scrollToCurrent); break;
    case 'node': var idx=+v; R.pop = (R.pop===idx ? null : idx); SFX.pop(); render(); break;
    case 'chest':
      var it=findChest(v);
      if(it && chestState(it)==='ready'){ openChest(v); }
      else { R.pop = (R.pop===v ? null : v); SFX.pop(); render(); }
      break;
    case 'chest-done': R.tab = (R.chest && R.chest.demo) ? 'profile' : (R.chest && R.chest.shop ? 'shop' : 'learn'); go('home'); break;
    case 'buy-chest': buyChest(+v); break;
    case 'win-wear': winWear(v, t); break;
    case 'w-open': wardOpen(v); break;
    case 'w-cat': wardCat(v, +t.getAttribute('data-i')); break;
    case 'w-sel': wardSel(v); break;
    case 'w-buy': buyItem(v); break;
    case 'w-wear': wearItem(v, true); break;
    case 'w-off': wearItem(v, false); break;
    case 'd-chest': openChest(null, +v); break;
    case 'buy': buy(v, false); break;
    case 'buy-modal': buy(v, true); break;
    case 'start':
      if(S.lives<=0){ R.pop=null; R.modal={type:'nolives'}; render(); break; }
      startLesson(+v); break;
    case 'quit': R.modal={type:'quit'}; render(); break;
    case 'quit-yes': R.lesson=null; go('home'); break;
    case 'm-close': R.modal=(R.modal && R.modal.back) || null; render(); break;
    case 'sel':
      var L=R.lesson; if(L.phase==='good'||L.phase==='bad') break;
      L.sel=+v; SFX.tap(+v); render(); break;
    case 'check': doCheck(false); break;
    case 'skip': doCheck(true); break;
    case 'continue': doContinue(); break;
    case 'pair': onPair(t.getAttribute('data-side'), +v); break;
    case 'end-next':
      if(R.after && R.after.demo){ R.tab='profile'; go('home'); }
      else if(R.after && R.after.streakUp){ R._counted=false; go('streak'); }
      else go('home');
      break;
    case 'home': go('home'); break;
    case 'relaunch': if(S.lives<=0){ S.lives=MAXL; save(); } startLesson(anyCur()); break;
    case 'practice': R.modal=null; startLesson(anyCur(), true); break;
    case 'm-streak': R.modal={type:'streak'}; render(); break;
    case 'm-lives': R.modal={type:'lives'}; render(); break;
    case 'm-guide': R.modal={type:'fiches', ui:+v, li:null}; SFX.page(); render(); break;
    case 'fiche-open': ficheOpen(+v, t); break;
    case 'fiche-back': ficheBack(); break;
    case 'fiche-node': R.pop=null; R.modal={type:'fiches', ui:ORDER[+v].ui, li:ORDER[+v].li}; SFX.page(); render(); break;
    case 'daily-open': if(dailyReady()){ openChest('daily'); } break;
    case 'sound': S.sound=!S.sound; save(); if(!S.sound) ambStop(.2); render(); if(S.sound) SFX.good(3); break;
    case 'goal': S.goal=+v; save(); render(); break;
    case 'd-next': S.dayOffset+=1; save(); onOpen(); break;
    case 'd-skip': S.dayOffset+=2; save(); onOpen(); break;
    case 'd-empty': S.lives=0; S.livesTs=now(); save(); render(); break;
    case 'd-gel': S.gel+=200; save(); R.bump={gel:true}; render(); SFX.coin(5); later(1200,function(){ R.bump=null; }); break;
    case 'd-gel2': S.gel+=2000; save(); R.bump={gel:true}; render(); SFX.coin(8); later(1200,function(){ R.bump=null; }); break;
    case 'd-unlock': ORDER.forEach(function(o){ S.done[o.l.id]=true; }); save(); render(); break;
    case 'd-skit': R.after={xp:15, gel:8, goalBonus:0, acc:100, secs:74, maxCombo:6, practice:false, streakUp:false, demo:true, entrance:v}; go('end'); break;
    case 'd-reset': R.modal={type:'reset'}; render(); break;
    case 'd-reset-yes': S=fresh(); save(); R.tab='learn'; go('onboard1'); splash(false); break;
  }
});
document.addEventListener('keydown', function(e){
  if(R.modal){ if(e.key==='Escape' && R.modal.type!=='nolives-lesson'){ R.modal=null; render(); } return; }
  if(R.screen!=='lesson') { if(e.key==='Enter'){ var p=document.getElementById('primary'); if(p && !p.disabled){ e.preventDefault(); p.click(); } } return; }
  var L=R.lesson, s=L.steps[L.i];
  if(s.kind==='q' && L.phase!=='good' && L.phase!=='bad'){
    var n=parseInt(e.key,10), max = s.q.type==='pointe' ? 0 : (s.q.type==='vf'?2:s.q.choices.length);
    if(n>=1 && n<=max){ ac(); L.sel=n-1; SFX.tap(n-1); render(); return; }
  }
  if(e.key==='Enter'){ var b=document.getElementById('primary'); if(b && !b.disabled){ e.preventDefault(); ac(); b.click(); } }
});

function onOpen(){
  tickLives();
  R._defibFx=false;
  if(!S.onboarded){ go('onboard1'); return; }
  var ev=checkStreak();
  if(ev && ev.type==='arrest'){ SFX.flat(); go('arrest'); return; }
  if(ev && ev.type==='defib'){ R.defibUsed=ev.used; go('defib'); return; }
  go('home');
}
try{ if(document.fonts) document.fonts.load('700 44px Caveat'); }catch(e){}
setInterval(function(){ var before=S.lives; tickLives(); if(S.lives!==before && R.screen==='home' && !R.modal) render(); }, 30000);
onOpen();
splash(false);
})();
</script>
