 une partie différente de ses gènes : c'est la régulation de l'expression."}, {"type": "vf", "q": "Les facteurs de transcription sont des protéines qui contrôlent l'activation de certains gènes.", "answer": true, "explication": "Ils se fixent sur l'ADN près des gènes et favorisent ou bloquent leur transcription."}, {"type": "qcm", "q": "La méthylation de l'ADN :", "choices": ["Éteint des gènes sans changer la séquence", "Change la séquence des bases", "Détruit le chromosome", "Double le nombre de gènes"], "answer": 0, "explication": "C'est une modification épigénétique : l'information est la même, mais elle n'est plus lue."}, {"type": "trou", "q": "La spécialisation d'une cellule en neurone, en cellule du foie… s'appelle la ___.", "choices": ["différenciation", "mutation", "réplication", "méiose"], "answer": 0, "explication": "Elle repose sur l'expression d'un ensemble particulier de gènes."}], "cours": ["Toutes tes cellules ont le même ADN, mais n'utilisent pas les mêmes gènes.", "Des protéines, les facteurs de transcription, allument ou éteignent les gènes.", "C'est ce qui fait la différence entre un neurone et une cellule du foie."], "paires": [["Facteur de transcription", "Contrôle un gène"], ["Promoteur", "Début du gène"], ["Gène éteint", "Pas transcrit"], ["Différenciation", "Spécialisation"]], "slides": [{"t": "Allumer le bon gène au bon moment", "p": ["Toutes les cellules ont le même ADN, mais chacune n'en utilise qu'une partie : c'est la **différenciation**.", "Des **facteurs de transcription** se fixent sur l'ADN et activent ou bloquent la transcription.", "Des signaux extérieurs, comme les **hormones**, peuvent modifier ces facteurs."]}, {"t": "L'épigénétique", "p": ["La **méthylation de l'ADN** ajoute des marques chimiques qui éteignent des gènes, sans changer la séquence.", "Les **histones** peuvent aussi être modifiées pour ouvrir ou fermer la chromatine.", "Ces marques peuvent varier avec l'environnement : alimentation, tabac, stress."]}]}]}, {"id": "molecules", "titre": "Les molécules du vivant", "matiere": "Biochimie", "lycee": "SVT : enzymes (1re), respiration cellulaire (Tle)", "lecons": [{"id": "molecules-1", "titre": "Les acides aminés", "niveau": "pont", "objectif": "Reconnaître la structure commune des acides aminés.", "sources": {"sorbonne": "UE1 Biochimie · Structure des protéines", "saclay": "Biochimie · Acides aminés"}, "questions": [{"type": "qcm", "q": "Quelles fonctions chimiques possède tout acide aminé ?", "choices": ["Une fonction amine et une fonction acide carboxylique", "Une fonction alcool et une fonction cétone", "Deux fonctions acide carboxylique", "Une fonction aldéhyde et une fonction amine"], "answer": 0, "explication": "C'est ce qui leur donne leur nom. Seule la chaîne latérale change d'un acide aminé à l'autre."}, {"type": "vf", "q": "Dans une protéine, les acides aminés sont reliés par des liaisons peptidiques.", "answer": true, "explication": "La liaison peptidique relie la fonction acide d'un acide aminé à la fonction amine du suivant."}, {"type": "trou", "q": "Un acide aminé que le corps ne sait pas fabriquer est dit ___.", "choices": ["essentiel", "polaire", "basique", "chiral"], "answer": 0, "explication": "Il y en a 9 chez l'adulte : il faut les trouver dans l'alimentation."}, {"type": "vf", "q": "La formation d'une liaison peptidique libère une molécule d'eau.", "answer": true, "explication": "C'est une réaction de condensation entre le –COOH d'un acide aminé et le –NH₂ du suivant."}], "cours": ["Un acide aminé porte une fonction amine (–NH₂) et une fonction acide (–COOH).", "Ce qui change d'un acide aminé à l'autre, c'est la chaîne latérale.", "Les acides aminés s'enchaînent par des liaisons peptidiques pour former les protéines."], "paires": [["–NH₂", "Fonction amine"], ["–COOH", "Acide carboxylique"], ["Liaison peptidique", "Relie deux acides aminés"], ["Chaîne latérale", "Change selon l'acide aminé"]], "slides": [{"t": "La structure commune", "p": ["Un acide aminé a un **carbone central** qui porte une **fonction amine** (–NH₂), une **fonction acide** (–COOH), un hydrogène et une **chaîne latérale** R.", "Il en existe **20** principaux dans nos protéines. Seule la chaîne R change.", "Sauf la glycine, ils sont **chiraux** : dans nos protéines, on trouve la forme **L**."]}, {"t": "Classer les acides aminés", "p": ["Selon leur chaîne R, ils sont **hydrophobes** (leucine), **polaires** (sérine), **acides** (glutamate) ou **basiques** (lysine).", "**9** acides aminés sont **essentiels** : le corps ne sait pas les fabriquer, il faut les manger.", "Deux acides aminés se lient par une **liaison peptidique**, en libérant une molécule d'eau."]}]}, {"id": "molecules-2", "titre": "La structure des protéines", "niveau": "pont", "objectif": "Distinguer les structures primaire, secondaire, tertiaire et quaternaire.", "sources": {"sorbonne": "UE1 Biochimie · Structure des protéines, Relation structure-fonction", "saclay": "Biochimie · Structure, fonctions et méthodes d'étude des protéines"}, "questions": [{"type": "qcm", "q": "La structure primaire d'une protéine correspond à :", "choices": ["La séquence de ses acides aminés", "Son repliement en hélice α", "Sa forme 3D globale", "L'association de plusieurs chaînes"], "answer": 0, "explication": "Primaire : la séquence. Secondaire : hélices α et feuillets β. Tertiaire : forme 3D. Quaternaire : plusieurs chaînes."}, {"type": "vf", "q": "L'hémoglobine, formée de 4 chaînes associées, possède une structure quaternaire.", "answer": true, "explication": "2 chaînes α et 2 chaînes β. C'est l'exemple le plus classique de structure quaternaire."}, {"type": "qcm", "q": "Quand on cuit un blanc d'œuf, les protéines :", "choices": ["Sont dénaturées", "Changent de séquence", "Se transforment en lipides", "Se répliquent"], "answer": 0, "explication": "La chaleur casse les liaisons faibles qui tiennent la forme 3D. La séquence, elle, ne change pas."}, {"type": "trou", "q": "Les hélices α et les feuillets β forment la structure ___.", "choices": ["secondaire", "primaire", "tertiaire", "quaternaire"], "answer": 0, "explication": "Ce sont des repliements locaux, stabilisés par des liaisons hydrogène."}, {"type": "pointe", "model": "hemoglobine", "target": ["heme"], "q": "Chaque chaîne de l'hémoglobine porte un petit groupe non protéique qui fixe l'O₂. Touche-en un.", "explication": "C'est le groupe hème (en jaune), avec son atome de fer (en orange). Il y en a 4, un par chaîne."}], "cours": ["Structure primaire : l'ordre des acides aminés.", "Secondaire : hélices α et feuillets β. Tertiaire : la forme 3D.", "Quaternaire : plusieurs chaînes assemblées, comme dans l'hémoglobine."], "paires": [["Primaire", "Séquence"], ["Secondaire", "Hélice α, feuillet β"], ["Tertiaire", "Forme 3D"], ["Quaternaire", "Plusieurs chaînes"]], "slides": [{"t": "Quatre niveaux", "p": ["**Primaire** : l'ordre des acides aminés, dicté par le gène.", "**Secondaire** : des repliements locaux en **hélices α** ou **feuillets β**, tenus par des liaisons hydrogène.", "**Tertiaire** : la forme 3D de toute la chaîne. **Quaternaire** : l'assemblage de plusieurs chaînes."]}, {"t": "La forme fait la fonction", "p": ["Une protéine ne marche que si elle a la **bonne forme**.", "La chaleur ou un pH extrême peuvent la **dénaturer** : elle perd sa forme et sa fonction, comme le blanc d'œuf qui cuit.", "Dans la **drépanocytose**, un seul acide aminé change dans l'hémoglobine, qui s'agrège et déforme les globules rouges."]}]}, {"id": "molecules-3", "titre": "Les enzymes", "niveau": "lycee", "objectif": "Expliquer comment une enzyme accélère une réaction.", "sources": {"sorbonne": "UE1 Biochimie · Relation structure-fonction", "saclay": "Biochimie · Enzymologie 1 : propriétés générales"}, "questions": [{"type": "qcm", "q": "Une enzyme :", "choices": ["Accélère une réaction sans être consommée", "Fournit l'énergie de la réaction", "Est détruite à la fin de la réaction", "Change l'équilibre final de la réaction"], "answer": 0, "explication": "Elle abaisse l'énergie d'activation. Elle ne change pas l'équilibre, elle y fait arriver plus vite."}, {"type": "vf", "q": "Une enzyme reconnaît son substrat grâce à la forme de son site actif.", "answer": true, "explication": "C'est la spécificité enzymatique : le substrat doit être complémentaire du site actif."}, {"type": "trou", "q": "Une enzyme accélère une réaction en abaissant son énergie d'___.", "choices": ["activation", "équilibre", "ionisation", "oxydation"], "answer": 0, "explication": "La réaction a besoin d'un « coup de pouce » plus petit pour démarrer."}, {"type": "qcm", "q": "La pepsine, enzyme de l'estomac, fonctionne le mieux à un pH d'environ :", "choices": ["2", "7", "9", "12"], "answer": 0, "explication": "L'estomac est très acide. La pepsine y digère les protéines."}], "cours": ["Une enzyme est une protéine qui accélère une réaction.", "Elle n'est pas consommée et ne change pas l'équilibre final.", "Son substrat se fixe dans le site actif, dont la forme lui est complémentaire."], "paires": [["Substrat", "Se fixe sur l'enzyme"], ["Site actif", "Poche de l'enzyme"], ["Catalyseur", "Accélère la réaction"], ["Produit", "Résultat de la réaction"]], "slides": [{"t": "Des catalyseurs biologiques", "p": ["Une **enzyme** accélère une réaction chimique en abaissant son **énergie d'activation**.", "Elle n'est **pas consommée** et ne change pas l'équilibre de la réaction.", "Son nom se termine souvent par **-ase** : amylase, lipase, ADN polymérase…"]}, {"t": "Spécificité et conditions", "p": ["Le **substrat** se fixe dans le **site actif**, dont la forme lui est complémentaire.", "Chaque enzyme a une **température** et un **pH optimaux** : 37 °C chez nous, pH 2 pour la **pepsine** de l'estomac.", "Trop de chaleur la **dénature**, et elle ne fonctionne plus."]}]}, {"id": "molecules-4", "titre": "Cinétique enzymatique", "niveau": "fac", "objectif": "Lire une courbe de Michaelis-Menten.", "sources": {"sorbonne": "UE1 Biochimie · Relation structure-fonction", "saclay": "Biochimie · Enzymologie 2 : cinétique enzymatique"}, "questions": [{"type": "qcm", "q": "Le Km est la concentration en substrat pour laquelle la vitesse de réaction vaut :", "choices": ["Vmax / 2", "Vmax", "0", "2 × Vmax"], "answer": 0, "explication": "Km et Vmax sont les deux paramètres clés de Michaelis-Menten."}, {"type": "vf", "q": "Plus le Km est petit, plus l'enzyme a d'affinité pour son substrat.", "answer": true, "explication": "Il faut peu de substrat pour atteindre la moitié de la vitesse maximale : l'enzyme le « capte » facilement."}, {"type": "qcm", "q": "Avec un inhibiteur compétitif :", "choices": ["Le Km augmente et Vmax ne change pas", "Vmax diminue et le Km ne change pas", "Les deux augmentent", "Rien ne change"], "answer": 0, "explication": "En ajoutant beaucoup de substrat, on finit par chasser l'inhibiteur : Vmax peut toujours être atteinte."}, {"type": "vf", "q": "À Vmax, toutes les enzymes sont occupées par du substrat.", "answer": true, "explication": "On dit qu'elles sont saturées : ajouter du substrat n'accélère plus la réaction."}], "cours": ["Plus il y a de substrat, plus la réaction va vite, jusqu'à un plafond : Vmax.", "Le Km est la concentration de substrat qui donne la moitié de Vmax.", "Un petit Km veut dire une grande affinité."], "paires": [["Vmax", "Vitesse maximale"], ["Km", "Donne Vmax / 2"], ["Petit Km", "Forte affinité"], ["Inhibiteur", "Ralentit l'enzyme"]], "slides": [{"t": "La courbe de Michaelis-Menten", "p": ["On mesure la **vitesse** de la réaction selon la **concentration en substrat** [S].", "Au début, la vitesse augmente vite, puis elle plafonne à **Vmax** : toutes les enzymes sont occupées.", "Le **Km** est la concentration [S] qui donne **Vmax / 2**."]}, {"t": "Les inhibiteurs", "p": ["Un **inhibiteur compétitif** prend la place du substrat dans le site actif : le Km augmente, Vmax ne change pas.", "Un **inhibiteur non compétitif** se fixe ailleurs et diminue Vmax.", "Beaucoup de **médicaments** sont des inhibiteurs d'enzymes. L'aspirine inhibe par exemple la cyclo-oxygénase."]}]}, {"id": "molecules-5", "titre": "Les glucides", "niveau": "pont", "objectif": "Reconnaître les principaux sucres et leur rôle.", "sources": {"sorbonne": "UE1 Biochimie · Glucides", "saclay": "Biochimie · Glucides"}, "questions": [{"type": "qcm", "q": "Sous quelle forme le corps humain stocke-t-il le glucose, surtout dans le foie et les muscles ?", "choices": ["Glycogène", "Amidon", "Cellulose", "Saccharose"], "answer": 0, "explication": "L'amidon est la réserve des plantes. Chez l'animal, c'est le glycogène."}, {"type": "vf", "q": "Le saccharose (le sucre de table) est formé d'un glucose et d'un fructose.", "answer": true, "explication": "C'est un diholoside. Le lactose du lait, lui, est formé de glucose et de galactose."}, {"type": "trou", "q": "Le glucose, le fructose et le galactose ont la même formule brute : ___.", "choices": ["C₆H₁₂O₆", "C₁₂H₂₂O₁₁", "CO₂", "C₆H₆"], "answer": 0, "explication": "Ce sont des isomères : même formule, structures différentes."}, {"type": "vf", "q": "L'être humain digère la cellulose.", "answer": false, "explication": "Il n'a pas l'enzyme nécessaire. La cellulose passe comme fibre alimentaire."}], "cours": ["Le glucose est le carburant principal des cellules.", "Le corps le stocke sous forme de glycogène, dans le foie et les muscles.", "Saccharose = glucose + fructose. Lactose = glucose + galactose."], "paires": [["Glycogène", "Réserve animale"], ["Amidon", "Réserve végétale"], ["Lactose", "Sucre du lait"], ["Saccharose", "Sucre de table"]], "slides": [{"t": "Les oses", "p": ["Les **oses** (sucres simples) sont les briques des glucides : **glucose**, **fructose** et **galactose** ont tous la formule C₆H₁₂O₆.", "Le **glucose** est le carburant principal des cellules. Le cerveau en consomme environ 120 g par jour.", "Deux oses liés forment un **diholoside** : saccharose, lactose, maltose."]}, {"t": "Les réserves", "p": ["Les **polyosides** sont de longues chaînes de glucose.", "Les plantes stockent l'**amidon**, les animaux le **glycogène**, surtout dans le **foie** et les **muscles**.", "La **cellulose** des plantes est aussi faite de glucose, mais nous ne savons pas la digérer : ce sont des fibres."]}]}, {"id": "molecules-6", "titre": "Les lipides", "niveau": "pont", "objectif": "Connaître triglycérides, phospholipides et cholestérol.", "sources": {"sorbonne": "UE1 Biochimie · Lipides", "saclay": "Biochimie · Lipides"}, "questions": [{"type": "qcm", "q": "Un triglycéride est formé de :", "choices": ["Un glycérol et 3 acides gras", "3 molécules de glucose", "Un acide aminé et 3 acides gras", "Un cholestérol et 3 phosphates"], "answer": 0, "explication": "C'est la forme de réserve des graisses, stockée dans le tissu adipeux."}, {"type": "vf", "q": "Le cholestérol est indispensable à l'organisme.", "answer": true, "explication": "Il entre dans la composition des membranes et sert à fabriquer les hormones stéroïdes et la vitamine D."}, {"type": "qcm", "q": "Combien de kilocalories apporte 1 g de lipides ?", "choices": ["9", "4", "1", "20"], "answer": 0, "explication": "Plus du double des glucides et des protéines (4 kcal/g) : c'est la réserve la plus compacte."}, {"type": "trou", "q": "Un acide gras avec au moins une double liaison est dit ___.", "choices": ["insaturé", "saturé", "hydrophile", "essentiel"], "answer": 0, "explication": "Les doubles liaisons créent des coudes : les huiles restent liquides à température ambiante."}], "cours": ["Les triglycérides sont les graisses de réserve : un glycérol et 3 acides gras.", "Les phospholipides forment les membranes.", "Le cholestérol sert aux membranes et à fabriquer des hormones."], "paires": [["Triglycéride", "Graisse de réserve"], ["Phospholipide", "Forme les membranes"], ["Cholestérol", "Précurseur d'hormones"], ["Tissu adipeux", "Stocke les graisses"]], "slides": [{"t": "Les acides gras", "p": ["Un **acide gras** est une longue chaîne de carbones terminée par une fonction acide.", "Il est **saturé** sans double liaison (beurre, solide), **insaturé** avec au moins une double liaison (huile d'olive, liquide).", "Les **oméga-3** et **oméga-6** sont des acides gras **essentiels** : il faut les manger."]}, {"t": "Les grandes familles", "p": ["Les **triglycérides** (glycérol + 3 acides gras) sont la réserve d'énergie du **tissu adipeux** : 9 kcal par gramme, contre 4 pour les glucides.", "Les **phospholipides** forment les membranes.", "Le **cholestérol** rigidifie les membranes et sert à fabriquer les **hormones stéroïdes**, la **vitamine D** et les **acides biliaires**."]}]}, {"id": "molecules-7", "titre": "L'énergie de la cellule", "niveau": "pont", "objectif": "Suivre le glucose de la glycolyse au cycle de Krebs.", "sources": {"sorbonne": "UE1 Biochimie · Métabolisme énergétique", "saclay": "Biochimie · Métabolisme : vue d'ensemble, Cycle de Krebs"}, "questions": [{"type": "qcm", "q": "Quelle molécule sert de « monnaie énergétique » à la cellule ?", "choices": ["L'ATP", "L'ADN", "Le glucagon", "L'urée"], "answer": 0, "explication": "L'ATP libère de l'énergie en perdant un phosphate. La cellule le recycle en permanence."}, {"type": "qcm", "q": "Où se déroule la glycolyse ?", "choices": ["Dans le cytoplasme", "Dans la mitochondrie", "Dans le noyau", "Dans le réticulum endoplasmique"], "answer": 0, "explication": "La glycolyse a lieu dans le cytoplasme. Le cycle de Krebs, lui, se déroule dans la matrice de la mitochondrie."}, {"type": "trou", "q": "La glycolyse transforme une molécule de glucose en deux molécules de ___.", "choices": ["pyruvate", "lactose", "glycogène", "cholestérol"], "answer": 0, "explication": "Le pyruvate part ensuite vers la mitochondrie, ou devient du lactate sans oxygène."}, {"type": "vf", "q": "Sans oxygène, un muscle peut produire du lactate.", "answer": true, "explication": "C'est la fermentation lactique. Elle donne peu d'ATP mais permet de continuer l'effort un moment."}], "cours": ["L'ATP est la monnaie énergétique de la cellule.", "La glycolyse découpe le glucose, dans le cytoplasme.", "Le cycle de Krebs continue le travail, dans la mitochondrie."], "paires": [["ATP", "Monnaie énergétique"], ["Glycolyse", "Dans le cytoplasme"], ["Cycle de Krebs", "Dans la mitochondrie"], ["Pyruvate", "Produit de la glycolyse"]], "slides": [{"t": "L'ATP, la monnaie de la cellule", "p": ["L'**ATP** (adénosine triphosphate) libère de l'énergie en perdant un phosphate et devient de l'**ADP**.", "La cellule le recycle sans cesse : un humain en renouvelle environ **son propre poids** chaque jour.", "L'énergie vient de l'**oxydation** des nutriments, surtout du glucose."]}, {"t": "Du glucose au cycle de Krebs", "p": ["La **glycolyse**, dans le **cytoplasme**, coupe le glucose en 2 **pyruvates** et donne un peu d'ATP.", "Sans oxygène, le pyruvate devient du **lactate** : c'est la **fermentation**, par exemple dans un muscle en effort intense.", "Avec oxygène, il entre dans la **mitochondrie** et alimente le **cycle de Krebs**, qui produit du CO₂ et des transporteurs d'électrons."]}]}, {"id": "molecules-8", "titre": "La chaîne respiratoire", "niveau": "fac", "objectif": "Comprendre pourquoi on a besoin d'oxygène.", "sources": {"sorbonne": "UE1 Biochimie · Mitochondrie et chaîne respiratoire", "saclay": "Biochimie · Phosphorylation oxydative"}, "questions": [{"type": "qcm", "q": "Quel est l'accepteur final des électrons de la chaîne respiratoire ?", "choices": ["Le dioxygène (O₂)", "Le dioxyde de carbone (CO₂)", "Le glucose", "L'ATP"], "answer": 0, "explication": "L'O₂ est réduit en eau. Sans lui, la chaîne s'arrête : c'est pour ça qu'on respire."}, {"type": "vf", "q": "L'ATP synthase utilise un flux de protons pour fabriquer de l'ATP.", "answer": true, "explication": "La chaîne pompe des protons, qui refluent ensuite à travers l'ATP synthase comme l'eau dans une turbine."}, {"type": "qcm", "q": "Combien d'ATP donne à peu près l'oxydation complète d'un glucose ?", "choices": ["30 à 32", "2", "100", "1 000"], "answer": 0, "explication": "La glycolyse seule n'en donne que 2 : la mitochondrie fait l'essentiel du travail."}, {"type": "trou", "q": "Au bout de la chaîne respiratoire, l'oxygène devient de l'___.", "choices": ["eau", "ozone", "ATP", "urée"], "answer": 0, "explication": "O₂ + 4 électrons + 4 H⁺ donnent 2 H₂O."}], "cours": ["La chaîne respiratoire se trouve dans la membrane interne de la mitochondrie.", "Elle fait passer des électrons jusqu'à l'O₂, qui devient de l'eau.", "L'ATP synthase fabrique l'ATP grâce à un flux de protons."], "paires": [["O₂", "Accepteur final"], ["H₂O", "Produit final"], ["ATP synthase", "Turbine à protons"], ["Membrane interne", "Siège de la chaîne"]], "slides": [{"t": "Une cascade d'électrons", "p": ["Le cycle de Krebs remplit des transporteurs, le **NADH** et le **FADH₂**, avec des électrons.", "Ces électrons passent de complexe en complexe dans la **membrane interne** de la mitochondrie.", "L'**O₂** les récupère au bout de la chaîne et devient de l'**eau**."]}, {"t": "La turbine à protons", "p": ["En passant, l'énergie des électrons sert à **pomper des protons** vers l'espace intermembranaire.", "Les protons reviennent en traversant l'**ATP synthase**, qui tourne comme une turbine et fabrique l'ATP.", "Au total, un glucose donne environ **30 à 32 ATP**. Le **cyanure** tue en bloquant cette chaîne."]}]}]}, {"id": "chimie", "titre": "Chimie pour la santé", "matiere": "Chimie", "lycee": "Physique-chimie, de la 2de à la Terminale", "lecons": [{"id": "chimie-1", "titre": "L'atome", "niveau": "lycee", "objectif": "Décrire le noyau, les électrons et les isotopes.", "sources": {"sorbonne": "UE1 Chimie · De l'atome aux molécules", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Le numéro atomique Z d'un élément correspond au nombre de :", "choices": ["Protons", "Neutrons", "Nucléons", "Électrons de valence"], "answer": 0, "explication": "Z = nombre de protons. A = nombre de nucléons (protons + neutrons)."}, {"type": "vf", "q": "Deux isotopes d'un même élément ont le même nombre de protons mais pas le même nombre de neutrons.", "answer": true, "explication": "Exemple : l'iode 131, radioactif, est utilisé en médecine nucléaire pour la thyroïde."}, {"type": "qcm", "q": "Combien de neutrons contient le carbone 14 (Z = 6) ?", "choices": ["8", "6", "14", "20"], "answer": 0, "explication": "A − Z = 14 − 6 = 8 neutrons."}, {"type": "trou", "q": "Un atome qui a perdu un électron devient un ion chargé ___.", "choices": ["positivement", "négativement", "neutre", "deux fois"], "answer": 0, "explication": "Il a alors un proton de plus que d'électrons, comme Na⁺."}], "cours": ["Un atome, c'est un noyau (protons + neutrons) entouré d'électrons.", "Z est le nombre de protons, A le nombre de nucléons.", "Les isotopes ont le même Z mais pas le même nombre de neutrons."], "paires": [["Z", "Nombre de protons"], ["A", "Nombre de nucléons"], ["Isotopes", "Même Z, A différent"], ["Électron", "Charge négative"]], "slides": [{"t": "Noyau et électrons", "p": ["Le noyau contient des **protons** (charge +) et des **neutrons** (neutres). Les **électrons** (charge −) l'entourent.", "**Z** = nombre de protons (numéro atomique). **A** = protons + neutrons (nombre de masse). Un atome neutre a autant d'électrons que de protons.", "Presque toute la masse est dans le noyau, pourtant environ **100 000 fois plus petit** que l'atome."]}, {"t": "Isotopes et ions", "p": ["Des **isotopes** ont le même Z mais pas le même nombre de neutrons : ¹²C et ¹⁴C, par exemple.", "Certains sont **radioactifs** et servent en médecine : l'**iode 131** traite la thyroïde, le **technétium 99m** sert en imagerie.", "Un **ion** a gagné ou perdu des électrons : Na⁺ en a perdu un, Cl⁻ en a gagné un."]}]}, {"id": "chimie-2", "titre": "Le tableau périodique", "niveau": "lycee", "objectif": "Lire une colonne, une ligne et l'électronégativité.", "sources": {"sorbonne": "UE1 Chimie · De l'atome aux molécules", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Les éléments d'une même colonne du tableau périodique ont :", "choices": ["Le même nombre d'électrons de valence", "Le même nombre de neutrons", "La même masse", "Le même nombre de couches électroniques"], "answer": 0, "explication": "C'est pour ça qu'ils ont des propriétés chimiques proches."}, {"type": "qcm", "q": "Quel élément est le plus électronégatif ?", "choices": ["Le fluor", "Le sodium", "Le carbone", "L'hydrogène"], "answer": 0, "explication": "L'électronégativité augmente vers la droite et vers le haut du tableau. Le fluor est le champion."}, {"type": "trou", "q": "Le sodium et le potassium appartiennent à la famille des ___.", "choices": ["alcalins", "halogènes", "gaz nobles", "métaux de transition"], "answer": 0, "explication": "Colonne 1 : un seul électron de valence, qu'ils perdent facilement pour donner Na⁺ et K⁺."}, {"type": "vf", "q": "Les gaz nobles réagissent très facilement.", "answer": false, "explication": "Leur couche externe est complète : ils sont très stables."}], "cours": ["Dans une même colonne, les éléments ont le même nombre d'électrons de valence.", "Dans une même ligne, ils ont le même nombre de couches.", "L'électronégativité augmente vers la droite et vers le haut : le fluor est en tête."], "paires": [["Colonne", "Même valence"], ["Ligne", "Même nombre de couches"], ["Fluor", "Le plus électronégatif"], ["Gaz nobles", "Couche externe pleine"]], "slides": [{"t": "Lire le tableau", "p": ["Les éléments sont rangés par **Z croissant**.", "Une **ligne** (période) correspond au nombre de **couches électroniques** occupées.", "Une **colonne** (famille) regroupe les éléments qui ont le même nombre d'**électrons de valence**, donc des propriétés proches."]}, {"t": "Les familles à connaître", "p": ["Colonne 1 : les **alcalins** (Na, K), très réactifs, qui donnent des ions +1.", "Colonne 17 : les **halogènes** (F, Cl), qui donnent des ions −1.", "Colonne 18 : les **gaz nobles** (He, Ne), stables car leur couche externe est pleine. L'**électronégativité** augmente vers la droite et vers le haut : le **fluor** est en tête."]}]}, {"id": "chimie-3", "titre": "Liaisons et schéma de Lewis", "niveau": "lycee", "objectif": "Dessiner le schéma de Lewis d'une petite molécule.", "sources": {"sorbonne": "UE1 Chimie · Structure des molécules", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Combien de liaisons covalentes un atome de carbone forme-t-il habituellement ?", "choices": ["4", "2", "3", "1"], "answer": 0, "explication": "Le carbone a 4 électrons de valence. Il forme 4 liaisons pour respecter la règle de l'octet."}, {"type": "qcm", "q": "Combien de doublets non liants porte l'oxygène dans la molécule d'eau ?", "choices": ["2", "0", "1", "3"], "answer": 0, "explication": "L'oxygène a 6 électrons de valence : 2 servent aux liaisons O–H, il reste 2 doublets non liants."}, {"type": "trou", "q": "Dans la molécule N₂, les deux atomes d'azote sont reliés par une liaison ___.", "choices": ["triple", "simple", "double", "ionique"], "answer": 0, "explication": "Chaque azote met 3 électrons en commun pour compléter son octet."}, {"type": "qcm", "q": "Combien de doublets non liants porte l'azote dans NH₃ ?", "choices": ["1", "0", "2", "3"], "answer": 0, "explication": "5 électrons de valence : 3 servent aux liaisons N–H, les 2 restants forment un doublet non liant."}], "cours": ["Une liaison covalente : deux atomes partagent une paire d'électrons.", "Le carbone fait 4 liaisons, l'azote 3, l'oxygène 2, l'hydrogène 1.", "Le schéma de Lewis montre les liaisons et les doublets non liants."], "paires": [["Carbone", "4 liaisons"], ["Azote", "3 liaisons"], ["Oxygène", "2 liaisons"], ["Hydrogène", "1 liaison"]], "slides": [{"t": "La règle de l'octet", "p": ["Les atomes tendent à avoir **8 électrons** sur leur couche externe (2 pour l'hydrogène), comme les gaz nobles.", "Dans une **liaison covalente**, deux atomes **partagent** une paire d'électrons.", "Une double liaison partage 2 paires, une triple liaison 3 paires, comme dans N₂."]}, {"t": "Dessiner le schéma de Lewis", "p": ["On compte les **électrons de valence** de chaque atome : C = 4, N = 5, O = 6, H = 1.", "On forme les liaisons, puis on place les électrons restants en **doublets non liants**.", "Exemple : dans NH₃, l'azote fait 3 liaisons et garde **1 doublet non liant**."]}]}, {"id": "chimie-4", "titre": "La forme des molécules", "niveau": "pont", "objectif": "Prévoir la géométrie d'une molécule (méthode VSEPR).", "sources": {"sorbonne": "UE1 Chimie · Structure des molécules", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Quelle est la géométrie de la molécule de méthane (CH₄) ?", "choices": ["Tétraédrique", "Plane carrée", "Linéaire", "Coudée"], "answer": 0, "explication": "4 liaisons qui se repoussent au maximum forment des angles de 109,5°."}, {"type": "qcm", "q": "Pourquoi la molécule d'eau est-elle coudée ?", "choices": ["Les 2 doublets non liants de l'oxygène repoussent les liaisons O–H", "L'hydrogène est plus lourd que l'oxygène", "Les liaisons O–H sont des doubles liaisons", "L'oxygène n'a aucun électron libre"], "answer": 0, "explication": "L'angle H–O–H vaut environ 104,5°. Cette forme rend l'eau polaire."}, {"type": "qcm", "q": "Pourquoi CO₂ n'est-il pas polaire alors que ses liaisons C=O le sont ?", "choices": ["La molécule est linéaire : les deux effets se compensent", "Le carbone n'a pas d'électrons", "L'oxygène n'est pas électronégatif", "Les liaisons sont triples"], "answer": 0, "explication": "Les deux liaisons tirent dans des directions opposées : la somme est nulle."}, {"type": "trou", "q": "Une molécule avec 4 paires liantes autour de l'atome central a une géométrie ___.", "choices": ["tétraédrique", "linéaire", "plane", "coudée"], "answer": 0, "explication": "C'est la disposition qui éloigne le plus 4 paires : angles de 109,5°."}], "cours": ["Les paires d'électrons autour d'un atome se repoussent au maximum.", "4 paires liantes donnent un tétraèdre (CH₄, angles de 109,5°).", "Les doublets non liants poussent plus fort : l'eau est coudée."], "paires": [["CH₄", "Tétraédrique"], ["H₂O", "Coudée"], ["CO₂", "Linéaire"], ["NH₃", "Pyramidale"]], "slides": [{"t": "Le principe VSEPR", "p": ["Autour d'un atome central, les **paires d'électrons** (liantes et non liantes) se **repoussent** au maximum.", "2 paires : forme **linéaire** (180°), comme CO₂. 3 paires : **triangulaire** (120°). 4 paires : **tétraédrique** (109,5°), comme CH₄.", "Les doublets non liants prennent plus de place et **resserrent** les angles."]}, {"t": "De la forme à la polarité", "p": ["NH₃ (1 doublet non liant) est **pyramidale**, avec des angles d'environ 107°. H₂O (2 doublets) est **coudée**, à environ 104,5°.", "Une molécule est **polaire** si ses charges partielles ne se compensent pas. L'eau est polaire, CO₂ ne l'est pas malgré ses liaisons polaires.", "La polarité de l'eau explique pourquoi elle **dissout** si bien les ions et les sucres."]}]}, {"id": "chimie-5", "titre": "Nommer une molécule organique", "niveau": "lycee", "objectif": "Reconnaître les familles : alcool, acide, cétone, amine.", "sources": {"sorbonne": "UE1 Chimie · Éléments de nomenclature", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Quelle est la formule de l'éthanol ?", "choices": ["CH₃–CH₂–OH", "CH₃–OH", "CH₃–CHO", "CH₃–COOH"], "answer": 0, "explication": "« Éth- » : 2 carbones. « -ol » : fonction alcool."}, {"type": "qcm", "q": "Dans « acide éthanoïque », la terminaison « -oïque » indique :", "choices": ["Un acide carboxylique", "Un alcool", "Une cétone", "Une amine"], "answer": 0, "explication": "L'acide éthanoïque, c'est l'acide acétique du vinaigre : CH₃–COOH."}, {"type": "trou", "q": "Une molécule à 3 carbones avec une fonction cétone s'appelle la ___.", "choices": ["propanone", "propanol", "propanal", "propane"], "answer": 0, "explication": "C'est l'acétone, le solvant des dissolvants pour vernis."}, {"type": "qcm", "q": "Quelle terminaison indique une double liaison C=C ?", "choices": ["-ène", "-ane", "-ol", "-al"], "answer": 0, "explication": "L'éthène (éthylène) est l'hormone végétale qui fait mûrir les fruits."}], "cours": ["Le préfixe donne le nombre de carbones : méth- 1, éth- 2, prop- 3, but- 4.", "Le suffixe donne la fonction : -ol alcool, -al aldéhyde, -one cétone, -oïque acide.", "Éthanol : 2 carbones et une fonction alcool."], "paires": [["-ol", "Alcool"], ["-one", "Cétone"], ["-oïque", "Acide carboxylique"], ["Prop-", "3 carbones"]], "slides": [{"t": "La chaîne carbonée", "p": ["Le **préfixe** donne le nombre de carbones de la chaîne principale : méth- (1), éth- (2), prop- (3), but- (4), pent- (5), hex- (6).", "**-ane** : que des liaisons simples. **-ène** : une double liaison.", "Exemple : le **propane** a 3 carbones, l'**éthène** a une double liaison C=C."]}, {"t": "Les fonctions", "p": ["**-ol** : alcool (–OH). **-al** : aldéhyde (–CHO). **-one** : cétone (C=O au milieu de la chaîne).", "**Acide …-oïque** : acide carboxylique (–COOH). **-amine** : amine (–NH₂).", "Exemple : l'**acétone**, ou propanone, est une cétone à 3 carbones."]}]}, {"id": "chimie-6", "titre": "Isomérie et chiralité", "niveau": "pont", "objectif": "Repérer un carbone asymétrique.", "sources": {"sorbonne": "UE1 Chimie · Structure des molécules", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Un carbone asymétrique est un carbone lié à :", "choices": ["4 groupes tous différents", "4 atomes d'hydrogène", "2 doubles liaisons", "3 groupes identiques"], "answer": 0, "explication": "Une molécule qui en possède un existe sous deux formes images l'une de l'autre dans un miroir : les énantiomères."}, {"type": "vf", "q": "Deux énantiomères peuvent avoir des effets différents sur l'organisme.", "answer": true, "explication": "Nos récepteurs sont eux-mêmes chiraux. Par exemple, les deux énantiomères de la carvone n'ont pas la même odeur."}, {"type": "vf", "q": "L'éthanol et le méthoxyméthane sont des isomères.", "answer": true, "explication": "Même formule C₂H₆O, mais un alcool d'un côté et un éther de l'autre."}, {"type": "trou", "q": "Deux molécules images l'une de l'autre dans un miroir, non superposables, sont des ___.", "choices": ["énantiomères", "isotopes", "polymères", "ions"], "answer": 0, "explication": "Comme la main droite et la main gauche."}], "cours": ["Des isomères ont la même formule brute mais pas la même structure.", "Un carbone lié à 4 groupes différents est asymétrique.", "Il donne deux énantiomères, images l'un de l'autre dans un miroir."], "paires": [["Énantiomères", "Images miroir"], ["Carbone asymétrique", "4 groupes différents"], ["Chiral", "Non superposable"], ["Isomères", "Même formule brute"]], "slides": [{"t": "Même formule, autre molécule", "p": ["Des **isomères** ont la même formule brute mais des structures différentes.", "Isomères de **constitution** : les atomes ne sont pas reliés dans le même ordre. Exemple : l'éthanol et le méthoxyméthane (C₂H₆O).", "**Stéréo-isomères** : même enchaînement, mais disposition différente dans l'espace."]}, {"t": "La chiralité", "p": ["Un **carbone asymétrique** porte 4 groupes différents. La molécule existe alors en deux **énantiomères**, images l'une de l'autre dans un miroir, comme nos deux mains.", "Les deux énantiomères ont les mêmes propriétés physiques, mais peuvent agir **différemment dans le corps**.", "Avec une double liaison, on peut aussi avoir des isomères **Z** (même côté) et **E** (côtés opposés)."]}]}, {"id": "chimie-7", "titre": "Acides, bases et pH", "niveau": "lycee", "objectif": "Interpréter un pH et connaître celui du sang.", "sources": {"sorbonne": "UE1 Chimie · Équilibres acido-basiques ; UE3 Biophysique · pH", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Une solution de pH = 3 est :", "choices": ["Acide", "Basique", "Neutre", "Impossible à dire"], "answer": 0, "explication": "À 25 °C : pH < 7 acide, pH = 7 neutre, pH > 7 basique."}, {"type": "qcm", "q": "Le pH normal du sang est d'environ :", "choices": ["7,4", "5,5", "7,0", "8,5"], "answer": 0, "explication": "Entre 7,35 et 7,45. Il est maintenu par des systèmes tampons, surtout le couple CO₂ / bicarbonate."}, {"type": "qcm", "q": "Si le pH passe de 7 à 5, la concentration en ions H₃O⁺ est multipliée par :", "choices": ["100", "2", "10", "20"], "answer": 0, "explication": "2 unités de pH, c'est 10 × 10 = 100 fois plus d'ions H₃O⁺."}, {"type": "trou", "q": "Un pH sanguin inférieur à 7,35 s'appelle une ___.", "choices": ["acidose", "alcalose", "anémie", "hypoxie"], "answer": 0, "explication": "Elle peut venir des poumons (CO₂ mal éliminé) ou du métabolisme."}], "cours": ["Un acide libère des ions H⁺, une base en capte.", "pH < 7 : acide. pH = 7 : neutre. pH > 7 : basique (à 25 °C).", "Le sang reste entre 7,35 et 7,45 grâce à des tampons."], "paires": [["pH 2", "Suc gastrique"], ["pH 7,4", "Sang"], ["Tampon", "Stabilise le pH"], ["Acide", "Libère H⁺"]], "slides": [{"t": "Acides, bases et pH", "p": ["Selon **Brønsted**, un **acide** cède un ion H⁺ et une **base** en capte un.", "Le **pH** mesure l'acidité : pH = −log[H₃O⁺]. Quand le pH baisse d'une unité, il y a **10 fois plus** d'ions H₃O⁺.", "À 25 °C, une solution est acide si pH < 7, neutre si pH = 7, basique si pH > 7."]}, {"t": "Le pH du corps", "p": ["Le **pKa** indique la force d'un acide : plus il est petit, plus l'acide est fort.", "Une **solution tampon** limite les variations de pH. Dans le sang, c'est surtout le couple **CO₂ / HCO₃⁻** (bicarbonate).", "Le sang reste entre **7,35 et 7,45**. En dessous, c'est une **acidose**. Au-dessus, une **alcalose**."]}]}, {"id": "chimie-8", "titre": "Oxydoréduction", "niveau": "lycee", "objectif": "Identifier l'oxydant et le réducteur.", "sources": {"sorbonne": "UE1 Chimie · États d'équilibres redox", "saclay": "Chimie (dossier non accessible)"}, "questions": [{"type": "qcm", "q": "Un oxydant est une espèce capable de :", "choices": ["Capter des électrons", "Céder des électrons", "Capter des protons", "Céder des protons"], "answer": 0, "explication": "L'oxydant capte des électrons (il est réduit). Le réducteur en cède (il est oxydé)."}, {"type": "vf", "q": "Dans la chaîne respiratoire, le dioxygène joue le rôle d'oxydant.", "answer": true, "explication": "Il capte les électrons en bout de chaîne et devient de l'eau. La chimie et la biochimie se rejoignent ici."}, {"type": "trou", "q": "Dans la respiration cellulaire, le glucose est ___.", "choices": ["oxydé", "réduit", "neutralisé", "hydrolysé"], "answer": 0, "explication": "Il perd des électrons, qui finissent sur l'oxygène."}, {"type": "qcm", "q": "Dans le couple Fe³⁺/Fe²⁺, quel est l'oxydant ?", "choices": ["Fe³⁺", "Fe²⁺", "Les deux", "Aucun"], "answer": 0, "explication": "Fe³⁺ peut capter un électron pour devenir Fe²⁺. L'oxydant s'écrit toujours à gauche du couple."}], "cours": ["Un oxydant capte des électrons, un réducteur en cède.", "Une oxydoréduction est un échange d'électrons entre les deux.", "Dans ton corps, l'O₂ est l'oxydant final de la respiration."], "paires": [["Oxydant", "Capte des électrons"], ["Réducteur", "Cède des électrons"], ["Oxydation", "Perte d'électrons"], ["Réduction", "Gain d'électrons"]], "slides": [{"t": "Échanger des électrons", "p": ["L'**oxydant** capte des électrons : il est **réduit**. Le **réducteur** en cède : il est **oxydé**.", "On écrit des **couples** oxydant/réducteur, comme Fe³⁺/Fe²⁺ ou O₂/H₂O.", "Une **oxydation** est une perte d'électrons, une **réduction** un gain."]}, {"t": "L'oxydoréduction dans le corps", "p": ["La **respiration cellulaire** est une grande oxydoréduction : le glucose est oxydé, l'O₂ est réduit en eau.", "Le **NAD⁺** capte des électrons et devient **NADH**, puis les redonne à la chaîne respiratoire.", "Les **antioxydants** (vitamines C et E) protègent les cellules contre des espèces très oxydantes, les radicaux libres."]}]}]}, {"id": "biostats", "titre": "Probas et biostats", "matiere": "Biostatistiques", "lycee": "Maths : probabilités conditionnelles (1re), loi binomiale (Tle)", "lecons": [{"id": "biostats-1", "titre": "Décrire des données", "niveau": "lycee", "objectif": "Choisir entre moyenne et médiane, lire un écart-type.", "sources": {"sorbonne": "UE4 Biostats · pas de chapitre dédié", "saclay": "Biostats · Statistique descriptive"}, "questions": [{"type": "qcm", "q": "Tailles mesurées : 160, 165, 170, 175 et 200 cm. Quel indicateur est le moins influencé par la valeur 200 ?", "choices": ["La médiane", "La moyenne", "L'étendue", "La variance"], "answer": 0, "explication": "Médiane = 170 cm, moyenne = 174 cm. La médiane résiste aux valeurs extrêmes."}, {"type": "qcm", "q": "L'écart-type mesure :", "choices": ["La dispersion des valeurs autour de la moyenne", "La valeur la plus fréquente", "La valeur du milieu", "L'erreur de l'appareil de mesure"], "answer": 0, "explication": "Plus il est grand, plus les valeurs sont étalées."}, {"type": "qcm", "q": "Quelle est la médiane de la série 3, 8, 5, 1, 9 ?", "choices": ["5", "8", "5,2", "3"], "answer": 0, "explication": "On trie : 1, 3, 5, 8, 9. La valeur du milieu est 5. La moyenne, elle, vaut 5,2."}, {"type": "trou", "q": "L'écart-type est la racine carrée de la ___.", "choices": ["variance", "moyenne", "médiane", "étendue"], "answer": 0, "explication": "Il s'exprime dans la même unité que les données, ce qui le rend plus parlant."}], "cours": ["La moyenne additionne tout et divise : elle est sensible aux valeurs extrêmes.", "La médiane coupe la série en deux moitiés : elle résiste aux extrêmes.", "L'écart-type mesure à quel point les valeurs sont étalées."], "paires": [["Moyenne", "Sensible aux extrêmes"], ["Médiane", "Valeur du milieu"], ["Mode", "Valeur la plus fréquente"], ["Écart-type", "Dispersion"]], "slides": [{"t": "Position", "p": ["La **moyenne** additionne toutes les valeurs et divise par leur nombre.", "La **médiane** coupe la série triée en deux moitiés égales. Elle **résiste aux valeurs extrêmes**.", "Le **mode** est la valeur la plus fréquente."]}, {"t": "Dispersion", "p": ["L'**étendue** = maximum − minimum. Simple, mais sensible aux extrêmes.", "La **variance** est la moyenne des carrés des écarts à la moyenne. L'**écart-type** est sa racine carrée, dans la même unité que les données.", "En santé, on résume souvent une variable par **moyenne ± écart-type**, ou par la **médiane** si la distribution est asymétrique."]}]}, {"id": "biostats-2", "titre": "Probabilités conditionnelles", "niveau": "lycee", "objectif": "Lire et utiliser P(A | B).", "sources": {"sorbonne": "UE4 Biostats · Probabilités", "saclay": "Biostats · Probabilités appliquées aux tests médicaux"}, "questions": [{"type": "qcm", "q": "M = « être malade », T+ = « test positif ». Que signifie P(M | T+) ?", "choices": ["La probabilité d'être malade sachant que le test est positif", "La probabilité d'être malade et d'avoir un test positif", "La probabilité d'avoir un test positif sachant qu'on est malade", "La probabilité d'être malade ou d'avoir un test positif"], "answer": 0, "explication": "Ce qui est après la barre est ce qu'on sait déjà. Ne confonds pas P(M | T+) et P(T+ | M) : c'est le piège n°1 en médecine."}, {"type": "vf", "q": "Si A et B sont indépendants, alors P(A ∩ B) = P(A) × P(B).", "answer": true, "explication": "C'est même la définition de l'indépendance."}, {"type": "qcm", "q": "P(A ∩ B) = 0,12 et P(B) = 0,4. Que vaut P(A | B) ?", "choices": ["0,3", "0,048", "0,52", "0,12"], "answer": 0, "explication": "0,12 / 0,4 = 0,3."}, {"type": "trou", "q": "Pour calculer une probabilité avec un arbre, on ___ les probabilités le long d'une branche.", "choices": ["multiplie", "additionne", "soustrait", "divise"], "answer": 0, "explication": "Puis on additionne les branches qui mènent au même événement."}], "cours": ["P(A | B), c'est la probabilité de A quand on sait que B est vrai.", "P(A | B) et P(B | A) sont deux choses différentes. C'est le piège classique.", "Si A et B sont indépendants : P(A ∩ B) = P(A) × P(B)."], "paires": [["P(A | B)", "A sachant B"], ["P(A ∩ B)", "A et B"], ["P(A ∪ B)", "A ou B"], ["Indépendance", "P(A) × P(B)"]], "slides": [{"t": "Probabilité conditionnelle", "p": ["P(A | B) se lit « probabilité de A **sachant** B ».", "Formule : **P(A | B) = P(A ∩ B) / P(B)**.", "Exemple : sur 100 élèves, 40 font de la SVT, dont 10 visent médecine. P(médecine | SVT) = 10 / 40 = 0,25."]}, {"t": "Arbres et indépendance", "p": ["Un **arbre pondéré** aide à calculer : on multiplie le long d'une branche, on additionne les branches qui mènent au même résultat.", "C'est la **formule des probabilités totales**.", "A et B sont **indépendants** si savoir B ne change rien à A : P(A | B) = P(A)."]}]}, {"id": "biostats-3", "titre": "Variables aléatoires et loi binomiale", "niveau": "lycee", "objectif": "Calculer une probabilité sur des épreuves répétées.", "sources": {"sorbonne": "UE4 Biostats · Variables aléatoires, Distributions usuelles", "saclay": "Biostats · Variables aléatoires, lois discrètes"}, "questions": [{"type": "qcm", "q": "Dans une famille, chaque enfant a 1 risque sur 4 d'avoir une maladie génétique. Avec 3 enfants, quelle est la probabilité qu'aucun ne soit atteint ?", "choices": ["(3/4)³ ≈ 0,42", "1/4", "3/4", "1/64"], "answer": 0, "explication": "Chaque enfant est indemne avec la probabilité 3/4, indépendamment des autres : 27/64 ≈ 0,42."}, {"type": "qcm", "q": "L'espérance d'une loi binomiale B(n, p) vaut :", "choices": ["n × p", "n + p", "p / n", "n × p × (1 − p)"], "answer": 0, "explication": "n × p × (1 − p), c'est la variance."}, {"type": "qcm", "q": "Un test est positif chez 20 % des patients. Sur 50 patients, combien de tests positifs attend-on en moyenne ?", "choices": ["10", "20", "5", "2,5"], "answer": 0, "explication": "E(X) = n × p = 50 × 0,2 = 10."}, {"type": "vf", "q": "Pour utiliser la loi binomiale, les épreuves doivent être indépendantes.", "answer": true, "explication": "Et elles doivent toutes avoir la même probabilité de succès p."}], "cours": ["La loi binomiale compte les succès sur n épreuves identiques et indépendantes.", "Chaque épreuve réussit avec la probabilité p.", "Espérance : n × p. Variance : n × p × (1 − p)."], "paires": [["n", "Nombre d'épreuves"], ["p", "Probabilité de succès"], ["n × p", "Espérance"], ["n p (1 − p)", "Variance"]], "slides": [{"t": "Variable aléatoire", "p": ["Une **variable aléatoire** associe un nombre à chaque résultat d'une expérience : le nombre de filles dans une fratrie, par exemple.", "Son **espérance** E(X) est la valeur moyenne obtenue en répétant l'expérience un très grand nombre de fois.", "La **variance** mesure la dispersion autour de cette espérance."]}, {"t": "La loi binomiale", "p": ["On répète **n** épreuves identiques et indépendantes, chacune réussie avec la probabilité **p**. X compte les succès.", "**P(X = k) = C(n, k) × pᵏ × (1 − p)ⁿ⁻ᵏ**.", "Espérance **n × p**, variance **n × p × (1 − p)**."]}]}, {"id": "biostats-4", "titre": "La loi normale", "niveau": "pont", "objectif": "Utiliser la règle des 95 %.", "sources": {"sorbonne": "UE4 Biostats · Distributions usuelles, Théorème central limite", "saclay": "Biostats · Lois continues, intervalle de fluctuation"}, "questions": [{"type": "qcm", "q": "Pour une loi normale, quelle part des valeurs se trouve à moins de 2 écarts-types de la moyenne ?", "choices": ["Environ 95 %", "Environ 50 %", "Environ 68 %", "Environ 99,9 %"], "answer": 0, "explication": "68 % à 1 écart-type, 95 % à 2 écarts-types. Les « valeurs normales » d'une prise de sang reposent sur cette idée."}, {"type": "vf", "q": "La courbe de la loi normale est symétrique autour de sa moyenne.", "answer": true, "explication": "C'est la fameuse courbe en cloche : moyenne, médiane et mode sont confondus."}, {"type": "vf", "q": "Une valeur un peu en dehors des normes d'une prise de sang prouve qu'on est malade.", "answer": false, "explication": "Par construction, environ 5 % des personnes en bonne santé sont en dehors de l'intervalle de référence."}, {"type": "qcm", "q": "La taille suit une loi normale de moyenne 170 cm et d'écart-type 10 cm. Quelle est la valeur z d'une personne de 190 cm ?", "choices": ["2", "20", "0,2", "1,9"], "answer": 0, "explication": "z = (190 − 170) / 10 = 2 écarts-types au-dessus de la moyenne."}], "cours": ["La loi normale a la forme d'une cloche symétrique autour de la moyenne.", "68 % des valeurs sont à moins d'un écart-type de la moyenne.", "95 % sont à moins de 2 écarts-types (1,96 pour être précis)."], "paires": [["± 1 écart-type", "68 %"], ["± 1,96 écart-type", "95 %"], ["Courbe en cloche", "Loi normale"], ["Centre", "Moyenne = médiane"]], "slides": [{"t": "La courbe en cloche", "p": ["La **loi normale** N(μ, σ) décrit beaucoup de mesures biologiques : taille, tension artérielle, glycémie…", "Elle est **symétrique** autour de sa moyenne μ, et sa largeur dépend de l'écart-type σ.", "**68 %** des valeurs sont entre μ − σ et μ + σ, **95 %** entre μ − 1,96σ et μ + 1,96σ."]}, {"t": "Les valeurs de référence", "p": ["Les « valeurs normales » d'une prise de sang correspondent souvent aux **95 % centraux** de la population en bonne santé.", "Donc **5 %** des gens en bonne santé sont « hors normes » sans être malades.", "On peut **centrer-réduire** une valeur : z = (x − μ) / σ, pour la comparer à la loi N(0, 1)."]}]}, {"id": "biostats-5", "titre": "Sensibilité et spécificité", "niveau": "pont", "objectif": "Évaluer un test diagnostique.", "sources": {"sorbonne": "UE4 Biostats · Tests diagnostiques", "saclay": "Biostats · Probabilités appliquées aux tests médicaux"}, "questions": [{"type": "qcm", "q": "La sensibilité d'un test, c'est :", "choices": ["La probabilité que le test soit positif chez un malade", "La probabilité que le test soit négatif chez un non-malade", "La probabilité d'être malade si le test est positif", "La proportion de malades dans la population"], "answer": 0, "explication": "Sensibilité = P(T+ | M). La spécificité, c'est P(T− | non M)."}, {"type": "qcm", "q": "Sur 100 malades, le test est positif chez 90. Quelle est sa sensibilité ?", "choices": ["90 %", "10 %", "100 %", "Impossible sans les non-malades"], "answer": 0, "explication": "La sensibilité ne se calcule que chez les malades : 90 / 100."}, {"type": "qcm", "q": "Sur 200 personnes saines, le test est négatif chez 180. Quelle est sa spécificité ?", "choices": ["90 %", "10 %", "80 %", "On ne peut pas savoir"], "answer": 0, "explication": "180 / 200 = 0,9. La spécificité se calcule uniquement chez les non-malades."}, {"type": "trou", "q": "Un malade dont le test est négatif est un ___.", "choices": ["faux négatif", "vrai négatif", "faux positif", "vrai positif"], "answer": 0, "explication": "Le test l'a raté : c'est ce qu'on veut éviter en dépistage."}], "cours": ["Sensibilité : la part des malades que le test détecte.", "Spécificité : la part des non-malades pour qui le test est négatif.", "Un test sensible rate peu de malades. Un test spécifique donne peu de fausses alertes."], "paires": [["Sensibilité", "Positif chez les malades"], ["Spécificité", "Négatif chez les sains"], ["Faux positif", "Sain mais test +"], ["Faux négatif", "Malade mais test −"]], "slides": [{"t": "Le tableau à 4 cases", "p": ["On croise le résultat du test (+ ou −) avec l'état réel (malade ou non).", "**Vrais positifs (VP)** : malades avec test +. **Faux négatifs (FN)** : malades avec test −.", "**Faux positifs (FP)** : sains avec test +. **Vrais négatifs (VN)** : sains avec test −."]}, {"t": "Sensibilité et spécificité", "p": ["**Sensibilité** = VP / (VP + FN) : la capacité à détecter les malades.", "**Spécificité** = VN / (VN + FP) : la capacité à rassurer les sains.", "Pour **dépister**, on veut un test très sensible. Pour **confirmer** un diagnostic, un test très spécifique."]}]}, {"id": "biostats-6", "titre": "Valeurs prédictives", "niveau": "pont", "objectif": "Comprendre pourquoi un bon test peut tromper.", "sources": {"sorbonne": "UE4 Biostats · Tests diagnostiques", "saclay": "Biostats · Probabilités appliquées aux tests médicaux"}, "questions": [{"type": "vf", "q": "La valeur prédictive positive (VPP) d'un test dépend de la fréquence de la maladie dans la population testée.", "answer": true, "explication": "Plus la maladie est rare, plus les faux positifs pèsent lourd parmi les tests positifs."}, {"type": "qcm", "q": "Un test a 99 % de sensibilité et 99 % de spécificité. La maladie touche 1 personne sur 10 000. Ton test est positif. Tu es probablement :", "choices": ["Non malade : la plupart des positifs sont des faux positifs", "Malade à 99 %", "Malade à 50 %", "Malade à coup sûr"], "answer": 0, "explication": "Sur 1 million de personnes : 99 vrais positifs contre environ 10 000 faux positifs. La VPP est d'environ 1 %."}, {"type": "qcm", "q": "Parmi 100 tests positifs, 30 correspondent à de vrais malades. Quelle est la VPP ?", "choices": ["30 %", "70 %", "100 %", "3 %"], "answer": 0, "explication": "VPP = VP / tous les positifs = 30 / 100."}, {"type": "vf", "q": "La sensibilité d'un test dépend de la prévalence de la maladie.", "answer": false, "explication": "Sensibilité et spécificité sont propres au test. Ce sont les valeurs prédictives qui dépendent de la prévalence."}], "cours": ["VPP : la probabilité d'être malade quand le test est positif.", "VPN : la probabilité d'être sain quand le test est négatif.", "Elles dépendent de la fréquence de la maladie. Pour une maladie rare, même un excellent test donne beaucoup de faux positifs."], "paires": [["VPP", "Malade si test +"], ["VPN", "Sain si test −"], ["Prévalence", "Fréquence de la maladie"], ["Maladie rare", "VPP qui chute"]], "slides": [{"t": "La question du patient", "p": ["Le patient ne demande pas « quelle est la sensibilité ? », mais « **je suis positif, suis-je malade ?** ».", "C'est la **valeur prédictive positive** : VPP = VP / (VP + FP).", "La **valeur prédictive négative** : VPN = VN / (VN + FN)."]}, {"t": "Le piège de la prévalence", "p": ["La **prévalence** est la proportion de malades dans la population testée.", "Quand la maladie est **rare**, les faux positifs deviennent nombreux par rapport aux vrais : la **VPP chute**.", "C'est pour ça qu'on dépiste surtout les **populations à risque**, où la prévalence est plus élevée."]}]}, {"id": "biostats-7", "titre": "Le principe d'un test statistique", "niveau": "fac", "objectif": "Comprendre H0 et le risque α.", "sources": {"sorbonne": "UE4 Biostats · Principes des tests", "saclay": "Biostats · Principe d'un test statistique"}, "questions": [{"type": "qcm", "q": "Dans un test statistique, l'hypothèse nulle H0 dit en général :", "choices": ["Qu'il n'y a pas de différence (ou pas d'effet)", "Qu'il y a une différence", "Que le traitement est efficace", "Que l'échantillon est trop petit"], "answer": 0, "explication": "On part de « pas d'effet » et on regarde si les données sont assez surprenantes pour rejeter cette idée."}, {"type": "vf", "q": "Un risque α de 5 % signifie qu'on accepte 5 % de chances de conclure à une différence alors qu'il n'y en a pas.", "answer": true, "explication": "C'est le risque de faux positif du test statistique, appelé risque de première espèce."}, {"type": "qcm", "q": "Une étude trouve p = 0,03 avec α = 5 %. On :", "choices": ["Rejette H0", "Démontre H1 avec certitude", "Garde H0", "Doit refaire l'étude"], "answer": 0, "explication": "0,03 < 0,05 : on rejette H0. Il reste un risque de s'être trompé, jamais une certitude."}, {"type": "trou", "q": "Passer à côté d'une différence qui existe vraiment, c'est le risque ___.", "choices": ["β", "α", "p", "z"], "answer": 0, "explication": "On le réduit en augmentant le nombre de sujets."}], "cours": ["On part de l'hypothèse nulle H0 : pas de différence, pas d'effet.", "Si les données sont trop surprenantes sous H0, on la rejette.", "Le risque α (souvent 5 %) est le risque de voir un effet qui n'existe pas."], "paires": [["H0", "Pas de différence"], ["H1", "Il y a une différence"], ["α", "Risque de faux positif"], ["p < 0,05", "On rejette H0"]], "slides": [{"t": "La démarche", "p": ["On pose **H0** (pas de différence) et **H1** (il y a une différence).", "On calcule la probabilité d'observer des résultats aussi extrêmes **si H0 était vraie** : c'est la **p-value**.", "Si **p < α** (souvent 5 %), on **rejette H0** : la différence est dite statistiquement significative."]}, {"t": "Les deux erreurs", "p": ["**Risque α** (1re espèce) : conclure à une différence qui n'existe pas. C'est un faux positif.", "**Risque β** (2e espèce) : passer à côté d'une vraie différence. C'est un faux négatif.", "La **puissance** (1 − β) augmente avec la **taille de l'échantillon**."]}]}, {"id": "biostats-8", "titre": "Les études épidémiologiques", "niveau": "fac", "objectif": "Reconnaître une cohorte et lire un risque relatif.", "sources": {"sorbonne": "UE4 Biostats · Études épidémiologiques", "saclay": "Biostats · Risque relatif et odds ratio"}, "questions": [{"type": "qcm", "q": "Un risque relatif (RR) égal à 1 signifie :", "choices": ["Pas d'association entre l'exposition et la maladie", "L'exposition protège de la maladie", "L'exposition double le risque", "Toutes les personnes exposées sont malades"], "answer": 0, "explication": "RR > 1 : facteur de risque. RR < 1 : facteur protecteur. RR = 1 : aucun lien."}, {"type": "qcm", "q": "On suit pendant 20 ans des fumeurs et des non-fumeurs pour voir qui développe un cancer. C'est une étude :", "choices": ["De cohorte", "Cas-témoins", "Transversale", "Un essai randomisé"], "answer": 0, "explication": "Une cohorte part de l'exposition et suit les gens dans le temps. Une étude cas-témoins part de la maladie et remonte vers l'exposition."}, {"type": "qcm", "q": "10 % des fumeurs et 1 % des non-fumeurs développent la maladie. Quel est le risque relatif ?", "choices": ["10", "9", "0,1", "1"], "answer": 0, "explication": "RR = 10 % / 1 % = 10 : les fumeurs ont 10 fois plus de risque."}, {"type": "trou", "q": "Pour étudier une maladie rare, on préfère une étude ___.", "choices": ["cas-témoins", "de cohorte", "randomisée", "transversale"], "answer": 0, "explication": "Suivre une cohorte donnerait trop peu de malades : on part donc directement des cas."}], "cours": ["Une cohorte suit des gens exposés et non exposés dans le temps.", "Une étude cas-témoins part des malades et cherche à quoi ils ont été exposés.", "Le risque relatif compare le risque des exposés à celui des non-exposés."], "paires": [["Cohorte", "Suit dans le temps"], ["Cas-témoins", "Part des malades"], ["RR > 1", "Facteur de risque"], ["RR < 1", "Facteur protecteur"]], "slides": [{"t": "Les grands types d'études", "p": ["**Cohorte** : on suit des personnes exposées et non exposées dans le temps, et on compte les malades.", "**Cas-témoins** : on part de malades (cas) et de non-malades (témoins), et on compare leurs expositions passées. C'est idéal pour les maladies rares.", "**Essai randomisé** : on tire au sort qui reçoit le traitement. C'est la meilleure preuve d'efficacité."]}, {"t": "Mesurer l'association", "p": ["Le **risque relatif** RR = risque chez les exposés / risque chez les non-exposés. On le calcule dans une cohorte.", "L'**odds ratio** (OR) s'utilise dans les études cas-témoins. Pour une maladie rare, il est proche du RR.", "Une association n'est pas une causalité : un **facteur de confusion** peut tout expliquer. Par exemple, les buveurs de café fument plus souvent."]}]}]}, {"id": "corps", "titre": "Le corps humain", "matiere": "Anatomie et histologie", "lycee": "SVT : corps humain et santé. Le vocabulaire anatomique est nouveau.", "lecons": [{"id": "corps-1", "titre": "Parler comme un anatomiste", "niveau": "fac", "objectif": "Utiliser les plans et les termes de position.", "sources": {"sorbonne": "UE5 Anatomie · Introduction à l'anatomie générale", "saclay": "Anatomie · Généralités"}, "questions": [{"type": "qcm", "q": "En anatomie, « proximal » signifie :", "choices": ["Plus proche de la racine du membre", "Plus proche de la ligne médiane", "Vers l'avant", "Vers le haut"], "answer": 0, "explication": "Le coude est proximal par rapport au poignet. « Médial » veut dire proche de la ligne médiane."}, {"type": "qcm", "q": "Le plan sagittal sépare le corps en :", "choices": ["Une partie droite et une partie gauche", "Une partie avant et une partie arrière", "Une partie haute et une partie basse", "L'intérieur et l'extérieur"], "answer": 0, "explication": "Le plan frontal sépare l'avant et l'arrière, le plan transversal le haut et le bas."}, {"type": "qcm", "q": "Par rapport au nez, les oreilles sont :", "choices": ["Latérales", "Médiales", "Antérieures", "Distales"], "answer": 0, "explication": "Elles sont plus loin de la ligne médiane que le nez."}, {"type": "trou", "q": "Le poignet est ___ par rapport au coude.", "choices": ["distal", "proximal", "médial", "supérieur"], "answer": 0, "explication": "Il est plus loin de la racine du membre, l'épaule."}], "cours": ["Position de référence : debout, face à toi, paumes vers l'avant.", "Proximal = proche de la racine du membre. Distal = loin.", "Médial = proche de la ligne du milieu. Latéral = loin."], "paires": [["Proximal", "Près de la racine"], ["Distal", "Loin de la racine"], ["Médial", "Vers la ligne médiane"], ["Latéral", "Vers l'extérieur"]], "slides": [{"t": "La position de référence", "p": ["Le sujet est **debout**, face à toi, bras le long du corps, **paumes vers l'avant**.", "Toutes les descriptions se font dans cette position, même si le patient est couché.", "« À gauche » veut dire à la **gauche du patient**, pas à la tienne."]}, {"t": "Plans et directions", "p": ["Plan **sagittal** : droite / gauche. Plan **frontal** (ou coronal) : avant / arrière. Plan **transversal** : haut / bas.", "**Antérieur** = vers l'avant, **postérieur** = vers l'arrière. **Supérieur** (crânial) = vers la tête, **inférieur** (caudal) = vers les pieds.", "**Médial** = vers la ligne du milieu, **latéral** = vers l'extérieur. Sur un membre : **proximal** = près de la racine, **distal** = loin."]}]}, {"id": "corps-2", "titre": "Le squelette", "niveau": "fac", "objectif": "Nommer les grands os et les régions de la colonne.", "sources": {"sorbonne": "UE5 Anatomie · Le rachis, Membres", "saclay": "Anatomie · Ostéologie, Colonne vertébrale"}, "questions": [{"type": "qcm", "q": "Quel est l'os le plus long du corps humain ?", "choices": ["Le fémur", "Le tibia", "L'humérus", "La clavicule"], "answer": 0, "explication": "Le fémur est l'os de la cuisse. Il représente environ un quart de la taille d'une personne."}, {"type": "qcm", "q": "Combien de vertèbres cervicales (au cou) possède l'être humain ?", "choices": ["7", "5", "12", "33"], "answer": 0, "explication": "7 cervicales, 12 thoraciques, 5 lombaires, puis le sacrum et le coccyx."}, {"type": "trou", "q": "Le nom actuel de l'omoplate est la ___.", "choices": ["scapula", "patella", "fibula", "clavicule"], "answer": 0, "explication": "La nomenclature internationale a remplacé omoplate, rotule et péroné par scapula, patella et fibula."}, {"type": "qcm", "q": "Combien de paires de côtes a l'être humain ?", "choices": ["12", "10", "7", "24"], "answer": 0, "explication": "12 paires, soit 24 côtes, une par vertèbre thoracique."}, {"type": "pointe", "model": "squelette", "target": ["femur"], "q": "Touche le fémur.", "explication": "C'est l'os de la cuisse, le plus long du corps."}], "cours": ["Un adulte a environ 206 os.", "Le fémur, dans la cuisse, est le plus long.", "La colonne : 7 vertèbres cervicales, 12 thoraciques, 5 lombaires, puis le sacrum et le coccyx."], "paires": [["Fémur", "Cuisse"], ["Humérus", "Bras"], ["Tibia", "Jambe"], ["Crâne", "Protège l'encéphale"]], "slides": [{"t": "Le squelette axial", "p": ["Il comprend le **crâne**, la **colonne vertébrale**, les **côtes** et le **sternum**.", "La colonne : **7 cervicales, 12 thoraciques, 5 lombaires**, puis le **sacrum** et le **coccyx**.", "Il y a **12 paires de côtes**, chacune articulée avec une vertèbre thoracique."]}, {"t": "Le squelette des membres", "p": ["Membre supérieur : **clavicule** et **scapula** (omoplate), **humérus**, puis **radius** et **ulna** dans l'avant-bras.", "Membre inférieur : **os coxal**, **fémur**, **patella** (rotule), puis **tibia** et **fibula** dans la jambe.", "Astuce : le **radius** est du côté du **pouce**."]}]}, {"id": "corps-3", "titre": "Articulations et muscles", "niveau": "fac", "objectif": "Relier un muscle à son mouvement.", "sources": {"sorbonne": "UE5 Anatomie · Membre supérieur", "saclay": "Anatomie · Arthrologie, Myologie"}, "questions": [{"type": "qcm", "q": "Quel muscle fléchit le coude ?", "choices": ["Le biceps brachial", "Le triceps brachial", "Le deltoïde", "Le quadriceps"], "answer": 0, "explication": "Le triceps fait l'inverse : il étend le coude. Ce sont deux muscles antagonistes."}, {"type": "vf", "q": "Un tendon relie un muscle à un os, un ligament relie deux os.", "answer": true, "explication": "Exemple : le tendon d'Achille relie le mollet au calcanéus, l'os du talon."}, {"type": "qcm", "q": "Quel muscle étend le genou ?", "choices": ["Le quadriceps", "Les ischio-jambiers", "Le biceps", "Le triceps"], "answer": 0, "explication": "C'est lui qu'on sollicite pour se relever d'une chaise."}, {"type": "trou", "q": "Le liquide qui lubrifie les articulations mobiles s'appelle la ___.", "choices": ["synovie", "lymphe", "bile", "salive"], "answer": 0, "explication": "Il nourrit aussi le cartilage, qui n'a pas de vaisseaux."}, {"type": "pointe", "model": "squelette", "target": ["patella"], "q": "Touche la patella (l'ancienne « rotule »). Zoome à deux doigts si besoin.", "explication": "Elle est devant le genou, dans le tendon du quadriceps."}], "cours": ["Un muscle tire sur un os par l'intermédiaire d'un tendon.", "Un ligament relie deux os au niveau d'une articulation.", "Les muscles marchent par paires opposées : le biceps fléchit le coude, le triceps l'étend."], "paires": [["Biceps", "Fléchit le coude"], ["Triceps", "Étend le coude"], ["Tendon", "Relie muscle et os"], ["Ligament", "Relie deux os"]], "slides": [{"t": "Les articulations", "p": ["Une articulation relie deux os. Les plus mobiles sont les articulations **synoviales**, comme le genou ou l'épaule.", "Leurs surfaces osseuses sont couvertes de **cartilage** et baignent dans un liquide lubrifiant, la **synovie**.", "Des **ligaments** les stabilisent, comme les ligaments croisés du genou."]}, {"t": "Les muscles", "p": ["Un muscle squelettique se fixe aux os par des **tendons**. En se contractant, il rapproche ses deux points d'attache.", "Les muscles travaillent en paires **antagonistes** : le **biceps** fléchit le coude, le **triceps** l'étend.", "Le **quadriceps**, à l'avant de la cuisse, étend le genou. Les **ischio-jambiers**, à l'arrière, le fléchissent."]}]}, {"id": "corps-4", "titre": "Les 4 tissus fondamentaux", "niveau": "pont", "objectif": "Classer un tissu dans l'une des 4 familles.", "sources": {"sorbonne": "UE2 Histo · Épithéliums, Tissus conjonctifs, Tissus musculaires, Tissu nerveux", "saclay": "Biologie · Épithéliums, Tissus conjonctifs, musculaires, nerveux"}, "questions": [{"type": "qcm", "q": "Quels sont les 4 tissus fondamentaux ?", "choices": ["Épithélial, conjonctif, musculaire, nerveux", "Osseux, sanguin, adipeux, cutané", "Cardiaque, pulmonaire, hépatique, rénal", "Lisse, strié, cardiaque, squelettique"], "answer": 0, "explication": "Tous les organes sont construits à partir de ces 4 familles."}, {"type": "vf", "q": "En histologie, le sang est classé parmi les tissus conjonctifs.", "answer": true, "explication": "C'est un tissu conjonctif particulier, dont la matrice est liquide : le plasma."}, {"type": "qcm", "q": "Quel tissu musculaire trouve-t-on dans la paroi de l'intestin ?", "choices": ["Lisse", "Strié squelettique", "Cardiaque", "Aucun"], "answer": 0, "explication": "Le muscle lisse fait avancer les aliments par des contractions involontaires : le péristaltisme."}, {"type": "vf", "q": "Les épithéliums contiennent des vaisseaux sanguins.", "answer": false, "explication": "Ils n'en ont pas : ils sont nourris par diffusion à partir du tissu conjonctif en dessous."}], "cours": ["Épithélial : il recouvre les surfaces et forme les glandes.", "Conjonctif : il soutient et relie (os, cartilage, graisse, sang).", "Musculaire : il se contracte. Nerveux : il transmet l'information."], "paires": [["Épithélium", "Recouvre les surfaces"], ["Conjonctif", "Soutient et relie"], ["Musculaire", "Se contracte"], ["Nerveux", "Transmet l'information"]], "slides": [{"t": "Épithéliums et tissu conjonctif", "p": ["Un **épithélium** est fait de cellules jointives posées sur une **lame basale**. Il recouvre les surfaces (peau, tube digestif) ou forme des **glandes**.", "Il n'a **pas de vaisseaux** : il est nourri par le tissu situé en dessous.", "Le **tissu conjonctif** soutient et relie. Il contient beaucoup de **matrice extracellulaire**, riche en collagène. L'os, le cartilage, la graisse et le sang en font partie."]}, {"t": "Muscles et nerfs", "p": ["Il existe 3 tissus musculaires : **strié squelettique** (volontaire), **cardiaque** (involontaire, strié) et **lisse** (involontaire, dans les vaisseaux et l'intestin).", "Le **tissu nerveux** associe des **neurones**, qui transmettent l'information, et des **cellules gliales**, qui les soutiennent.", "Tous les organes sont construits en combinant ces 4 tissus."]}]}, {"id": "corps-5", "titre": "Le cœur et la circulation", "niveau": "lycee", "objectif": "Suivre le trajet du sang dans le cœur et les vaisseaux.", "sources": {"sorbonne": "UE5 Anatomie · Appareil cardio-circulatoire", "saclay": "Anatomie · Appareil circulatoire, Paroi, cavités et valves cardiaques"}, "questions": [{"type": "qcm", "q": "Quel vaisseau transporte le sang pauvre en O₂ du cœur vers les poumons ?", "choices": ["L'artère pulmonaire", "La veine pulmonaire", "L'aorte", "La veine cave"], "answer": 0, "explication": "Une artère part du cœur, quel que soit son contenu en oxygène. L'artère pulmonaire est l'exception qui piège."}, {"type": "qcm", "q": "Combien de cavités le cœur compte-t-il ?", "choices": ["4", "2", "3", "6"], "answer": 0, "explication": "2 atriums (oreillettes) et 2 ventricules. La systole, c'est la contraction des ventricules."}, {"type": "trou", "q": "La valve entre l'atrium gauche et le ventricule gauche s'appelle la valve ___.", "choices": ["mitrale", "tricuspide", "aortique", "pulmonaire"], "answer": 0, "explication": "Elle a deux valvules, comme une mitre d'évêque, d'où son nom."}, {"type": "qcm", "q": "Quelle cavité du cœur a la paroi la plus épaisse ?", "choices": ["Le ventricule gauche", "Le ventricule droit", "L'atrium droit", "L'atrium gauche"], "answer": 0, "explication": "Il doit envoyer le sang dans tout le corps, à une pression bien plus élevée."}, {"type": "pointe", "model": "coeur", "target": ["vg"], "q": "Touche le ventricule gauche.", "explication": "Il est en bas, à gauche du patient (donc à ta droite quand il te fait face). C'est la cavité à la paroi la plus épaisse : c'est elle qui envoie le sang dans tout le corps."}], "cours": ["Le cœur a 4 cavités : 2 atriums en haut, 2 ventricules en bas.", "Les artères partent du cœur, les veines y reviennent.", "Le cœur droit envoie le sang aux poumons, le cœur gauche vers tout le corps."], "paires": [["Aorte", "Sang vers le corps"], ["Artère pulmonaire", "Sang vers les poumons"], ["Veine cave", "Retour au cœur droit"], ["Systole", "Contraction du cœur"]], "slides": [{"t": "Deux pompes en une", "p": ["Le **cœur droit** reçoit le sang pauvre en O₂ par les **veines caves** et l'envoie aux poumons par l'**artère pulmonaire** : c'est la **petite circulation**.", "Le **cœur gauche** reçoit le sang oxygéné par les **veines pulmonaires** et l'envoie dans tout le corps par l'**aorte** : c'est la **grande circulation**.", "Le ventricule gauche a la paroi la plus épaisse : c'est lui qui pousse le sang le plus loin."]}, {"t": "Valves et battements", "p": ["Des **valves** empêchent le sang de refluer : **tricuspide** à droite, **mitrale** à gauche, puis les valves **pulmonaire** et **aortique**.", "Leur fermeture fait les bruits du cœur : « **boum-tac** ».", "La **systole** est la contraction des ventricules, la **diastole** leur remplissage. Au repos, le cœur bat environ **60 à 100 fois par minute**."]}]}, {"id": "corps-6", "titre": "L'appareil respiratoire", "niveau": "pont", "objectif": "Suivre l'air du nez jusqu'aux alvéoles.", "sources": {"sorbonne": "UE5 Anatomie · Appareil respiratoire", "saclay": "Anatomie · Voies aériennes, Poumons et plèvre, Diaphragme"}, "questions": [{"type": "qcm", "q": "Où se font les échanges gazeux entre l'air et le sang ?", "choices": ["Dans les alvéoles pulmonaires", "Dans les bronches", "Dans la trachée", "Dans la plèvre"], "answer": 0, "explication": "Les alvéoles offrent une surface d'échange d'environ 70 m² par une paroi très fine."}, {"type": "vf", "q": "Le diaphragme est le principal muscle de l'inspiration.", "answer": true, "explication": "En se contractant, il descend et agrandit la cage thoracique : l'air entre."}, {"type": "qcm", "q": "Combien de lobes a le poumon gauche ?", "choices": ["2", "3", "1", "4"], "answer": 0, "explication": "Le cœur prend de la place à gauche. Le poumon droit, lui, en a 3."}, {"type": "vf", "q": "Au repos, l'expiration est un phénomène passif.", "answer": true, "explication": "Le diaphragme se relâche et les poumons reviennent à leur volume grâce à leur élasticité."}, {"type": "pointe", "model": "tronc", "target": ["lmd"], "q": "Touche le lobe moyen du poumon droit.", "explication": "Seul le poumon droit a un lobe moyen : le gauche n'a que 2 lobes, pour laisser la place au cœur."}], "cours": ["L'air passe par le nez, le pharynx, le larynx, la trachée, puis les bronches.", "Les échanges de gaz se font dans les alvéoles.", "Le diaphragme est le principal muscle de l'inspiration."], "paires": [["Alvéole", "Échanges gazeux"], ["Trachée", "Conduit l'air"], ["Diaphragme", "Muscle de l'inspiration"], ["Plèvre", "Enveloppe du poumon"]], "slides": [{"t": "Le trajet de l'air", "p": ["**Voies aériennes supérieures** : nez, pharynx, larynx (avec les cordes vocales).", "**Voies inférieures** : trachée, puis deux **bronches**, qui se divisent en bronchioles de plus en plus fines.", "Au bout, les **alvéoles** : environ 300 millions, pour une surface d'échange d'environ 70 m²."]}, {"t": "Respirer", "p": ["À l'**inspiration**, le **diaphragme** se contracte et descend : le volume du thorax augmente et l'air entre.", "L'**expiration** au repos est passive : le diaphragme se relâche.", "Les **plèvres** entourent les poumons. Le poumon droit a **3 lobes**, le gauche **2**, pour laisser la place au cœur."]}]}, {"id": "corps-7", "titre": "Le système nerveux", "niveau": "lycee", "objectif": "Distinguer système nerveux central, périphérique et végétatif.", "sources": {"sorbonne": "UE5 Anatomie · Système nerveux", "saclay": "Anatomie · Cerveau, Moelle, Système nerveux végétatif"}, "questions": [{"type": "qcm", "q": "Le système nerveux central comprend :", "choices": ["L'encéphale et la moelle spinale (épinière)", "Les nerfs et les ganglions", "Le cerveau seulement", "La moelle spinale et les nerfs"], "answer": 0, "explication": "Les nerfs forment le système nerveux périphérique."}, {"type": "vf", "q": "Le système nerveux végétatif contrôle des fonctions involontaires comme le rythme cardiaque.", "answer": true, "explication": "Il a deux branches : le sympathique (accélère) et le parasympathique (ralentit)."}, {"type": "trou", "q": "Les enveloppes qui protègent le cerveau et la moelle s'appellent les ___.", "choices": ["méninges", "plèvres", "synovies", "fascias"], "answer": 0, "explication": "Leur inflammation s'appelle une méningite."}, {"type": "qcm", "q": "Combien de paires de nerfs crâniens a-t-on ?", "choices": ["12", "31", "7", "24"], "answer": 0, "explication": "12 paires partent de l'encéphale. Les 31 paires de nerfs spinaux partent de la moelle."}, {"type": "pointe", "model": "neurone", "target": ["soma", "noyau"], "q": "Touche le corps cellulaire du neurone.", "explication": "C'est la partie qui contient le noyau. Les dendrites y amènent les messages, l'axone les emporte."}], "cours": ["Système nerveux central : l'encéphale et la moelle spinale.", "Système nerveux périphérique : les nerfs.", "Le système végétatif gère l'involontaire : cœur, digestion, sueur."], "paires": [["Encéphale", "Dans le crâne"], ["Moelle spinale", "Dans la colonne"], ["Nerf", "Système périphérique"], ["Sympathique", "Accélère le cœur"]], "slides": [{"t": "Central et périphérique", "p": ["Le **système nerveux central** comprend l'**encéphale** (cerveau, cervelet, tronc cérébral) et la **moelle spinale**.", "Il est protégé par les os, les **méninges** et le **liquide cérébrospinal**.", "Le **système nerveux périphérique** regroupe les **nerfs** : 12 paires de nerfs crâniens et 31 paires de nerfs spinaux."]}, {"t": "Volontaire et automatique", "p": ["Le **système somatique** commande les muscles squelettiques (volontaire) et reçoit les sensations.", "Le **système végétatif** (autonome) gère ce qui est involontaire : cœur, digestion, pupilles, sueur.", "**Sympathique** : action, stress, le cœur accélère. **Parasympathique** : repos, digestion, le cœur ralentit."]}]}, {"id": "corps-8", "titre": "L'appareil digestif", "niveau": "pont", "objectif": "Placer chaque organe digestif et son rôle.", "sources": {"sorbonne": "UE5 Anatomie · Appareil digestif", "saclay": "Anatomie · Tube digestif, Annexes du tube digestif"}, "questions": [{"type": "qcm", "q": "Où se fait l'essentiel de l'absorption des nutriments ?", "choices": ["Dans l'intestin grêle", "Dans l'estomac", "Dans le côlon", "Dans l'œsophage"], "answer": 0, "explication": "Ses villosités lui donnent une énorme surface d'absorption. Le côlon absorbe surtout de l'eau."}, {"type": "qcm", "q": "Quel organe produit la bile ?", "choices": ["Le foie", "La vésicule biliaire", "Le pancréas", "La rate"], "answer": 0, "explication": "Le foie la produit, la vésicule biliaire la stocke et la libère pendant les repas."}, {"type": "trou", "q": "La première partie de l'intestin grêle, juste après l'estomac, s'appelle le ___.", "choices": ["duodénum", "côlon", "iléon", "rectum"], "answer": 0, "explication": "C'est là qu'arrivent la bile et les enzymes du pancréas."}, {"type": "vf", "q": "Le pancréas a à la fois un rôle digestif et un rôle hormonal.", "answer": true, "explication": "Il envoie des enzymes dans l'intestin et fabrique l'insuline et le glucagon."}, {"type": "pointe", "model": "tronc", "target": ["pancreas"], "q": "Le pancréas est caché derrière l'estomac. Fais tourner le modèle pour le trouver, puis touche-le.", "explication": "Il est derrière l'estomac, allongé le long de la courbe du duodénum."}], "cours": ["Bouche, œsophage, estomac, intestin grêle, côlon : c'est le tube digestif.", "L'intestin grêle absorbe l'essentiel des nutriments.", "Le foie fabrique la bile, la vésicule biliaire la stocke, le pancréas envoie des enzymes."], "paires": [["Foie", "Produit la bile"], ["Vésicule biliaire", "Stocke la bile"], ["Pancréas", "Enzymes digestives"], ["Intestin grêle", "Absorbe les nutriments"]], "slides": [{"t": "Le tube digestif", "p": ["Bouche, pharynx, **œsophage**, **estomac**, **intestin grêle** (duodénum, jéjunum, iléon), **côlon**, rectum.", "L'estomac brasse les aliments avec un suc **acide** (pH 1 à 3) et commence la digestion des protéines.", "L'intestin grêle mesure environ **6 mètres**. Ses **villosités** multiplient la surface d'absorption."]}, {"t": "Les glandes annexes", "p": ["Le **foie** fabrique la **bile**, qui émulsionne les graisses. La **vésicule biliaire** la stocke.", "Le **pancréas** envoie des **enzymes** digestives dans le duodénum et fabrique aussi l'**insuline**.", "Le **côlon** absorbe surtout de l'**eau**
